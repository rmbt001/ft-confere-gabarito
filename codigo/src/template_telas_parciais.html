<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validação de Cálculo — LIFT × PJC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--salmao:#F2705B;--salmao-claro:#FFE9E3;--preto:#1B1A19;--cinza:#6B6764;
    --linha:#E9E8EA;--bg:#FFFFFF;--card:#F6F6F7;--ok:#2E9E6B;--ok-bg:#E9F6EF;--ruim:#D8503C;--ruim-bg:#FBE8E4;--neutro:#9C9692;--neutro-bg:#F1F1F3;
    --text:#1B1A19;--surface:#FFFFFF;
    /* escala de acurácia (4 faixas, ver FAIXAS_ACC no script) */
    --acc-bate:#16794F;--acc-meta:#2E9E6B;--acc-perto:#C98A00;--acc-ruim:#D8503C;}
  /* tema escuro: sobrescreve só as variáveis + os poucos pontos com cor fixa;
     as regras do tema claro ficam intactas (todas leem as vars). --preto segue
     sendo o dark literal do header/botões (não flipa). */
  html.dark{--salmao-claro:#3A241F;--cinza:#9E99A0;--linha:#33333B;--bg:#161619;
    --card:#202027;--ok-bg:#123024;--ruim-bg:#3A1A14;--neutro-bg:#26262C;
    --text:#E9E6E2;--surface:#1E1E24;
    --acc-bate:#4FC58E;--acc-meta:#3FB37E;--acc-perto:#D9A22B;--acc-ruim:#E0705C;}
  html.dark body{color:var(--text)}
  html.dark aside,html.dark .cnjsel,html.dark .navside button,html.dark .prosa,
  html.dark .obs,html.dark .btn-dl,html.dark thead th{background:var(--surface)}
  html.dark .navside button,html.dark .btn-dl,html.dark th.gia{color:var(--text)}
  #themebtn{background:#ffffff1c;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:15px;cursor:pointer;line-height:1}
  #themebtn:hover{background:#ffffff33}
  *{box-sizing:border-box}
  body{margin:0;font-family:Onest,system-ui,sans-serif;color:var(--preto);background:var(--bg);font-size:14px}
  h1,h2,h3,.fh{font-family:Sora,sans-serif}
  header{background:var(--preto);color:#fff;padding:14px 26px}
  .htop{display:flex;justify-content:space-between;align-items:center;gap:20px}
  header h1{font-size:16px;margin:0}.acc{text-align:right}.acc .num{font-family:Sora;font-size:24px;font-weight:700;color:var(--salmao)}.acc .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
  .cnjtabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .cnjtabs button{font-family:Onest;font-size:12px;color:#fff;background:#ffffff18;border:0;padding:7px 12px;border-radius:7px;cursor:pointer}
  .cnjtabs button.on{background:var(--salmao)}
  .nav{display:flex;gap:8px;margin-top:10px}
  .nav button{font-family:Onest;font-size:12.5px;color:#fff;background:#ffffff14;border:0;padding:7px 13px;border-radius:7px;cursor:pointer}
  .nav button.on{background:#ffffff30}
  .btn-controle{width:100%;text-align:left;font-family:Sora;font-weight:600;font-size:13.5px;color:#fff;background:var(--preto);border:none;padding:10px 13px;border-radius:9px;cursor:pointer;margin-bottom:6px}
  /* grupos da navegação: o rótulo do grupo diz o RECORTE que as telas dele usam.
     Com 8 telas, deixar o recorte só no <h3> de dentro foi o que fez o mesmo
     número aparecer com três valores em telas diferentes. */
  .navgrp{margin:15px 0 7px;line-height:1.3}
  .navgrp b{font-family:Sora;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text)}
  .navgrp span{display:block;font-size:10.5px;color:var(--cinza);margin-top:2px}
  .navsep{border:0;height:1px;background:var(--linha);margin:16px 0 12px}
  .btn-controle:hover{background:var(--salmao)}
  .btn-controle.on{background:var(--salmao)}
  input[type=date]{font-family:Onest;font-size:12.5px;padding:6px 8px;border:1px solid var(--linha);border-radius:7px}
  .cnjsel{width:100%;padding:9px 10px;border:1px solid var(--linha);border-radius:9px;font-family:Onest;font-size:12.5px;background:#fff;margin-bottom:12px;cursor:pointer}
  .navside{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
  .navside button{text-align:left;font-family:Onest;font-size:13.5px;color:var(--preto);background:#fff;border:1px solid var(--linha);padding:9px 12px;border-radius:8px;cursor:pointer}
  .navside button:hover{border-color:var(--salmao)}
  .navside button.on{background:var(--salmao-claro);border-color:var(--salmao);font-weight:600}
  .layout{display:flex;min-height:calc(100vh - 70px)}
  aside{width:320px;border-right:1px solid var(--linha);padding:18px;overflow:auto;background:#fff}
  main{flex:1;padding:24px 28px;overflow:auto}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:10px}
  .card .n{font-family:Sora;font-size:19px;font-weight:700}.card .l{font-size:10px;color:var(--cinza);text-transform:uppercase}
  .secttl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--cinza);margin:14px 0 8px}
  .vitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 11px;border:1px solid var(--linha);border-radius:9px;margin-bottom:6px;cursor:pointer}
  .vitem:hover{border-color:var(--salmao)}.vitem.sel{border-color:var(--salmao);background:var(--salmao-claro)}
  .vitem .nm{font-size:12.5px;font-weight:500;line-height:1.25}
  .badge{font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:20px;white-space:nowrap}
  .b-ok{background:var(--ok-bg);color:var(--ok)}.b-ruim{background:var(--ruim-bg);color:var(--ruim)}.b-neutro{background:var(--neutro-bg);color:var(--neutro)}
  h2{margin:0 0 4px;font-size:20px}.sub{font-size:13px;color:var(--cinza)}
  .prosa{background:#fff;border:1px solid var(--linha);border-left:3px solid var(--salmao);border-radius:11px;padding:18px 22px;line-height:1.6;font-size:14.5px;max-width:900px}
  .prosa p{margin:0 0 12px}.prosa p:last-child{margin:0}
  .totais{display:flex;gap:24px;margin:10px 0 16px;flex-wrap:wrap}
  .totais .v{font-family:Sora;font-size:18px;font-weight:700}.totais .k{font-size:10px;color:var(--cinza);text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 9px;text-align:right;font-size:12.5px;border-bottom:1px solid var(--linha)}
  th{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--cinza);font-weight:600}
  th:first-child,td:first-child{text-align:left}
  thead th{position:sticky;top:0;background:#fff}
  td.ok{color:var(--ok)}td.ruim{color:var(--ruim);font-weight:600}td.vazio{color:var(--neutro)}
  .grp{border-left:1px solid var(--linha)}
  th.gia{color:var(--preto)}th.gpjc{color:var(--salmao)}
  .obs{margin-top:18px;background:#fff;border:1px solid var(--linha);border-left:3px solid var(--cinza);border-radius:10px;padding:14px 18px;line-height:1.55;font-size:14px;max-width:900px}
  .obs h3{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza)}
  .p4{background:var(--salmao-claro);border:1px solid #F3C9BF;border-radius:10px;padding:14px 18px;margin-top:14px;font-size:13.5px;line-height:1.5;max-width:900px}
  .p4 b{font-family:Sora}.fer{font-size:10px;color:var(--salmao)}
  .btn-dl{font-family:Onest;font-size:11.5px;color:var(--preto);background:#fff;border:1px solid var(--linha);padding:5px 11px;border-radius:7px;cursor:pointer;margin:8px 0}
  .btn-dl:hover{border-color:var(--salmao);color:var(--salmao)}
  .warn{background:#FFF4E5;border:1px solid #F0C277;border-left:4px solid #E08A00;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.5;max-width:920px}
  /* ---- aba Analytics ---- */
  :root{--azul:#2563C9;--azul-bg:#E7EEFB;--ouro:#C98A00}
  html.dark{--azul-bg:#16233F}
  .an-fil{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 18px}
  .an-fil .fl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--cinza);margin-right:4px}
  .an-fil button{font-family:Onest;font-size:12px;color:var(--text);background:var(--card);border:1px solid var(--linha);padding:6px 11px;border-radius:7px;cursor:pointer}
  .an-fil button.on{background:var(--salmao);border-color:var(--salmao);color:#fff}
  .seccab{display:flex;align-items:baseline;gap:10px;margin:26px 0 4px;flex-wrap:wrap}
  .seccab h3{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.06em}
  .seccab .q{font-size:12.5px;color:var(--cinza)}
  .sechr{height:2px;background:var(--salmao);width:34px;border-radius:2px;margin-bottom:14px}
  /* régua do topo do Placar: duas tabelas enxutas, % na meta como número principal */
  .rg-per{font-size:13.5px;margin:8px 0 14px;color:var(--cinza)}
  .rg-per b{color:var(--text)}
  .rg-aviso{color:#8a5a00}
  .rg-grid{display:grid;grid-template-columns:3fr 2fr;gap:28px;align-items:start;max-width:1200px}
  .rg-bloco h4{font-family:Sora;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza);margin:0 0 6px}
  .rg-tab{width:100%;border-collapse:collapse;font-size:14px}
  .rg-tab th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza);text-align:left;padding:6px 10px;border-bottom:2px solid var(--linha);background:none}
  .rg-tab td{padding:11px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
  .rg-tab .rg-num{text-align:right;white-space:nowrap}
  .rg-nome{font-family:Sora;font-weight:700;font-size:15px}
  .rg-desc{font-size:12.5px;color:var(--cinza);margin-top:2px}
  .rg-meta{font-family:Sora;font-weight:700;font-size:26px;color:var(--salmao);line-height:1}
  .rg-med{font-family:Sora;font-weight:600;font-size:17px}
  .rg-n{font-family:Sora;font-size:15px}
  .rg-princ td{background:var(--salmao-claro)}
  .rg-nota{font-size:12.5px;color:var(--cinza);margin:10px 0 18px;max-width:1200px}
  .rg-score{display:inline-flex;align-items:center;gap:6px;margin-left:10px}
  .rg-score select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--linha);border-radius:8px;background:var(--bg)}
  @media (max-width:900px){.rg-grid{grid-template-columns:1fr}}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:14px 15px}
  .tile.hero{background:var(--salmao-claro);border-color:var(--salmao)}
  .tile .n{font-family:Sora;font-size:27px;font-weight:700;line-height:1;color:var(--salmao)}
  .tile.plain .n{color:var(--text)}
  .tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza);margin-top:8px;line-height:1.35}
  .tile .d{font-size:11px;color:var(--cinza);margin-top:5px}
  .tile .n small{font-size:14px;font-weight:600;color:var(--cinza)}
  .panel{background:var(--surface);border:1px solid var(--linha);border-radius:14px;padding:18px 20px;margin-top:14px}
  .panel h3{font-size:13px;margin:0 0 2px}
  .panel .ph{font-size:11.5px;color:var(--cinza);margin-bottom:14px}
  .an-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  .an-grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mtx{display:grid;grid-template-columns:96px 1fr 1fr;gap:6px}
  .mtx .cell{border-radius:10px;padding:12px 13px;border:1px solid var(--linha);background:var(--card)}
  .mtx .rh,.mtx .ch{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--cinza);font-weight:600;text-align:center;line-height:1.3}
  .mtx .cell .cn{font-family:Sora;font-weight:700;font-size:23px;line-height:1}
  .mtx .cell .cl{font-size:10.5px;color:var(--cinza);margin-top:5px;line-height:1.3}
  .cell.okc{background:var(--ok-bg);border-color:var(--ok)}
  .cell.grave{background:var(--ruim-bg);border-color:var(--ruim)}
  .cell.perda{background:var(--neutro-bg);border-color:var(--neutro)}
  .kpi{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .kpi .kn{font-family:Sora;font-weight:700;font-size:19px}
  .kpi .kl{font-size:11.5px;color:var(--cinza)}
  .kpi.g .kn{color:var(--ruim)}.kpi.p .kn{color:var(--neutro)}
  .fstep{margin-bottom:7px}
  .fbar-wrap{display:flex;align-items:center;gap:12px}
  .fbar-track{flex:1;height:34px;background:var(--card);border:1px solid var(--linha);border-radius:8px;overflow:hidden}
  .fbar-fill{height:100%;background:var(--salmao);border-radius:7px 0 0 7px;display:flex;align-items:center;padding-left:11px;color:#fff;font-family:Sora;font-weight:600;font-size:13px}
  .fbar-meta{width:190px;font-size:12px;color:var(--cinza)}
  .frname{font-size:12px;font-weight:500;color:var(--text)}
  .fpass{font-size:11px;color:var(--ok);font-weight:600}
  .an-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:10px}
  .an-legend span{display:inline-flex;align-items:center;gap:6px;color:var(--cinza)}
  .an-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .an-note{font-size:11.5px;color:var(--cinza);margin-top:12px;line-height:1.5;border-left:2px solid var(--linha);padding-left:11px}
  .tag{display:inline-block;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--neutro-bg);color:var(--neutro);padding:2px 7px;border-radius:20px;vertical-align:middle}
  @media(max-width:900px){.tiles{grid-template-columns:1fr 1fr}.an-grid2,.an-grid2b{grid-template-columns:1fr}}

/* diagnóstico do agente: problemas agrupados por tipo */
.ag-grupo td{background:var(--surface-2,#f6f3f3);padding-top:9px;padding-bottom:7px;text-align:left}
.ag-p{vertical-align:top;text-align:left;max-width:680px;padding-top:8px;padding-bottom:9px}
.ag-v{vertical-align:top;text-align:right;white-space:nowrap;padding-top:8px}
.ag-s{vertical-align:top;text-align:left;padding-top:8px;min-width:150px}
.ag-l{margin-top:4px;color:var(--cinza);line-height:1.45}
.ag-l span{display:inline-block;min-width:118px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);opacity:.75;margin-right:6px}
.ag-gab{margin-top:6px;padding:7px 10px;border-left:3px solid #7a6fb0;border-radius:0 6px 6px 0;background:var(--surface-2,transparent)}
.ag-gab-t{font-size:10.5px;font-weight:700;color:#7a6fb0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div><h1>Validação de Cálculo — LIFT × PJC</h1><div class="sub" id="proc" style="color:#ffffffaa;font-size:12px;margin-top:3px"></div></div>
    <button id="themebtn" onclick="toggleTema()" title="Alternar tema claro/escuro">🌙</button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="navgrp"><b>Visão geral</b><span>rodada mais recente</span></div>
    <button id="nv-placar" class="btn-controle" onclick="irPlacar()">📊 Rodada</button>
    <button id="nv-verbas" class="btn-controle" onclick="irVerbas()">📐 Verbas</button>
    <button id="nv-consol" class="btn-controle" onclick="irConsol()">🧮 Verba consolidada</button>
    <button id="nv-naocalc" class="btn-controle" onclick="irNaoCalc()">🚫 Não calculadas</button>
    <button id="nv-problemas" class="btn-controle" onclick="irProblemas()">🤖 Problemas do agente</button>
    <button id="nv-premissas" class="btn-controle" onclick="irPremissas()">📋 Premissas do manual</button>
    <hr class="navsep">
    <button id="nv-caso" class="btn-controle" onclick="irCaso()">🔎 Análise por caso</button>
    <div id="caso-nav" style="display:none">
      <div class="sub" style="margin:0 0 6px;font-size:11px">Processo (digite p/ buscar)</div>
      <input id="cnjsel" class="cnjsel" list="cnjlist" placeholder="Buscar CNJ…" autocomplete="off"
             onchange="selCnj(this.value)" onfocus="this.select()">
      <datalist id="cnjlist"></datalist>
      <div class="navside">
        <button id="nv-lista" onclick="ir('lista')">📋 Lista de casos</button>
        <button id="nv-resumo" onclick="ir('resumo')">Resumo</button>
        <button id="nv-quadro" onclick="ir('quadro')">Quadro geral</button>
        <button id="nv-jornada" onclick="ir('jornada')">Jornada / Cartão</button>
        <button id="nv-hist" onclick="ir('hist')">Histórico Salarial</button>
        <button id="nv-rodadas" onclick="ir('rodadas')">Rodadas</button>
      </div>
      <div class="cards" id="cards"></div>
      <div id="lista"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
const D = /*__DADOS__*/;
// Caso COMPARÁVEL = tem cálculo de referência carregado E lido de forma confiável.
// `sem_pjc` = o PJC ainda não subiu (rodou, mas não há gabarito): o caso é visível e
// analisável pelo lado LIFT, e fica FORA de toda média/funil de acurácia — não é erro
// do FT, é ausência de referência. Todo agregado de acurácia passa por aqui.
// `fora_regua` = execução que terminou com ERRO antes do cálculo ("nao_calculado") ou
// gabarito de outro processo/cálculo ("gabarito_a_corrigir"): também fica FORA de
// toda média. O gerar_telas já reprova a guarda de extração nesses casos; a
// condição aqui é explícita para não depender disso.
const comPJC = c => !c.sem_pjc && c.extracao_confiavel && !c.fora_regua;
const FORA_REGUA_ROT={nao_calculado:"⛔ Não calculado (execução com erro)",gabarito_a_corrigir:"⚠️ Gabarito a corrigir"};
// default: caso pré-definido; se não existir, cai no melhor apto (extração confiável, maior acurácia)
let CNJ = (()=>{
  const PREF="0011753-36.2022.5.15.0067";
  if(D.casos[PREF])return PREF;
  const aptos=D.cnjs.filter(c=>D.casos[c]&&D.casos[c].apto);
  const conf=aptos.filter(c=>comPJC(D.casos[c]));
  const top=arr=>arr.slice().sort((a,b)=>((D.casos[b].quadro.assertividade||0)-(D.casos[a].quadro.assertividade||0)))[0];
  return top(conf.length?conf:aptos) || D.cnjs[0];
})();
const caso = () => D.casos[CNJ];
const brl = v => v==null?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const numf = v => v==null?"—":v.toLocaleString("pt-BR",{maximumFractionDigits:2});
const pct = v => v==null?"—":numf(v)+"%";
const mes = c => {if(!c)return"—";const[a,m]=c.split("-");return m+"/"+a;};
const BADGE={coincide:["b-ok","coincide"],so_ia:["b-ruim","só IA"],so_pjc:["b-ruim","só PJC"]};
// A comparação é sempre NOMINAL (o "Devido", antes da correção monetária): IA
// `total_verba` × PJC `devido`. A IA também tem o corrigido (`total_verba_atualizado`)
// e o PJC a atualização, mas isso é outra camada (índices SELIC/data), não a lógica do FT.
const NOTA_NOMINAL='<span title="Comparação de valores nominais: o Devido de cada verba, antes da correção monetária (SELIC/juros). A atualização é etapa mecânica e separada.">💡 valores <b>nominais</b> (devido, antes da correção monetária) · <span style="border-bottom:1px dotted">o quê?</span></span>';
function badgeDe(v){
  if(v.status==="nao_calc")return["b-neutro","não calculável (IA)"];
  if(v.status==="so_ia"&&v.motivo_nao_calc==="documental")return["b-neutro","depende de doc"];
  // sem gabarito nenhuma verba é "só IA" (isso afirmaria que o PJC não a tem):
  // ou a IA calculou, ou deferiu e não calculou. Sem julgamento de valor.
  if(caso().sem_pjc)return v.total_ia!=null?["b-neutro","calculada · sem PJC"]:["b-neutro","deferida, não calculada"];
  if(v.status==="so_ia"&&v.motivo_nao_calc==="no_pjc")return["b-ruim","não calculada (PJC tem)"];
  return BADGE[v.status]||["b-neutro",v.status];
}
const prox=(a,b)=>{if(a==null||b==null)return null;const m=Math.max(Math.abs(a),Math.abs(b))||1;return Math.abs(a-b)/m<0.01;};

function topo(){
  // datalist permite busca por dígitos do CNJ (a lista é grande). O label traz
  // assertividade + tipo p/ orientar a escolha sem abrir o caso.
  // ordena com APTOS primeiro (depois a ordem original) p/ a lista de busca
  const ordCnjs=D.cnjs.slice().sort((a,b)=>((D.casos[b]&&D.casos[b].apto?1:0)-(D.casos[a]&&D.casos[a].apto?1:0)));
  document.getElementById("cnjlist").innerHTML=ordCnjs.map(c=>{
    const k=D.casos[c], a=k&&k.quadro?k.quadro.assertividade:null;
    const acc=k&&k.sem_pjc?"⏳ sem PJC":(a!=null?a+"%":"—");
    return `<option value="${c}" label="${k&&k.apto?"✓ ":""}${c} · ${acc}${k&&k.tipo_calculo?" · "+esc(k.tipo_calculo):""}">`;}).join("");
  document.getElementById("cnjsel").value=CNJ;
  const c=caso();
  document.getElementById("proc").textContent=`${CNJ} · ${c.processo.periodo_calculo||""}`;
  const vs=c.verbas, cont=t=>vs.filter(v=>v.status===t).length;
  // sem PJC não existe "coincide/só IA/só PJC" — os cards viram o retrato do lado LIFT
  const _g=(c.camadas||{}).global||{};
  const cards=c.sem_pjc
    ?[[vs.filter(v=>v.total_ia!=null).length,"Calculadas"],[vs.filter(v=>v.total_ia==null).length,"Não calculadas"],["—","PJC"],[brl(c.quadro.total_ia),"Total IA"]]
    :[[cont("coincide"),"Coincidentes"],[cont("so_ia"),"Só IA"],[cont("so_pjc"),"Só PJC"],[brl(c.quadro.total_ia),"Total IA"],
      // as duas juntas, de propósito: a diferença entre elas é o erro que o total
      // esconde (verba acima compensando verba abaixo, verba perdida vs. extra).
      [`<span style="color:${corAcc(_g.acc)}">${accTxt(_g.acc)}</span>`,"Acurácia global",
       "Erro somado em módulo, verba a verba, nas três camadas. Verba que só a IA tem ou só o PJC tem conta como erro cheio. Dividido pelo total do PJC, então pode ficar negativo quando o cálculo excede a referência."],
      [accTxt(c.quadro.assertividade),"Assertividade (só os totais)",
       "Compara o total da IA com o total do PJC, dividido pelo PJC. É líquida: verba a mais cancela verba a menos — o quanto isso acontece neste caso está no índice de compensação."]];
  document.getElementById("cards").innerHTML=cards
    .map(([n,l,t])=>`<div class="card"${t?` title="${esc(t)}"`:""}><div class="n" style="font-size:${typeof n==='string'?'15px':'19px'}">${n}</div><div class="l">${l}</div></div>`).join("");
  const item=({v,i})=>{const[k,t]=badgeDe(v);
    return `<div class="vitem" data-i="${i}" onclick="verVerba(${i})"><div class="nm">${v.nome_ia||v.nome_pjc}</div><span class="badge ${k}">${t}</span></div>`;};
  const idx=vs.map((v,i)=>({v,i}));
  const princ=idx.filter(x=>!x.v.is_reflexo&&!x.v.is_rescisoria);
  const resc=idx.filter(x=>x.v.is_rescisoria);
  const refl=idx.filter(x=>x.v.is_reflexo);
  const grupo=(tit,arr)=>arr.length?`<div class="secttl" style="margin-top:12px">${tit}</div>`+arr.map(item).join(""):"";
  document.getElementById("lista").innerHTML=
    `<div class="secttl">Verbas — principais</div>`+princ.map(item).join("")
    +grupo("Verbas — rescisórias",resc)
    +grupo("Reflexos",refl);
}

// ---- camadas de VALOR: pré-índice (nominal) / pós-índice / pós-juros ----
// O mesmo cálculo tem três valores. Comparar os três separa "errou a conta" de
// "errou a atualização": se o nominal bate e o corrigido não, o problema é
// índice/data-base; se corrigido bate e com-juros não, é marco inicial/taxa.
const LAYERS_VALOR=[
  ["nominal","Pré-índice (nominal)","o devido, sem atualização — é onde mora a lógica do FT"],
  ["corrigido","Pós-índice (corrigido)","nominal × fator do índice de correção monetária (IPCA-E até a distribuição)"],
  ["juros","Pós-juros","corrigido + juros de mora (SELIC acumulada)"],
];
// valores da verba na camada pedida (nominal usa os campos de sempre)
const valLayer=(v,L)=>L==="nominal"

  : {ia:(v[L]||{}).ia,pjc:(v[L]||{}).pjc,acc:(v[L]||{}).acc};
// fator aplicado por cada lado, com destaque quando divergem mais de 2%
function fatorCell(v){
  const c=v.corrigido||{}, a=c.fator_ia, b=c.fator_pjc;
  const f=x=>x==null?"—":x.toFixed(3).replace(".",",");
  if(a==null&&b==null)return '<td class="sub" style="text-align:right">—</td>';
  const div=(a!=null&&b!=null&&Math.abs(a-b)/Math.max(a,b)>0.02);
  return `<td style="text-align:right;white-space:nowrap;color:${div?"var(--acc-perto)":"var(--cinza)"}" title="Fator MÉDIO da verba (corrigido ÷ nominal): IA ${f(a)} × referência ${f(b)}.${div?" Divergem mais de 2%, mas atenção: fator médio também muda quando os dois lados apuram valores em MESES diferentes, mesmo com o índice mensal idêntico (efeito de composição). A comparação limpa do índice é competência a competência, na tabela da verba.":""}">${f(a)} / ${f(b)}</td>`;
}
// cor da acurácia pela meta de 80%
// ---- escala ÚNICA de acurácia ----------------------------------------------
// Quatro faixas, usadas em toda a aplicação. Vermelho só abaixo de 50%: com a
// mediana da população em ~38%, o corte antigo (vermelho abaixo de 60%, e 70/40
// nas listas de caso) pintava quase tudo de vermelho e a cor parava de
// significar alguma coisa. Cor é reservada à ACURÁCIA: Δ em R$ e células de
// valor ficam neutros, com seta para a direção.
const FAIXAS_ACC=[
  [95,"var(--acc-bate)","bate","≥ 95% · bate"],
  [80,"var(--acc-meta)","na meta","80–95% · dentro da meta de 80%"],
  [50,"var(--acc-perto)","abaixo da meta","50–80% · abaixo da meta"],
  [-1e9,"var(--acc-ruim)","não bate","< 50% · não bate"],
];
const faixaAcc=a=>a==null?null:FAIXAS_ACC.find(f=>a>=f[0]);
const corAcc=a=>{const f=faixaAcc(a);return f?f[1]:"var(--cinza)";};
const rotAcc=a=>{const f=faixaAcc(a);return f?f[3]:"sem acurácia";};
// legenda reutilizável da escala (uma vez por tela, onde a cor aparece)
const LEGENDA_ACC=`<div class="an-legend" style="margin-top:8px;font-size:11.5px">${
  FAIXAS_ACC.map(f=>`<span><i class="an-dot" style="background:${f[1]}"></i> ${f[3]}</span>`).join("")}</div>`;
const accTxt=a=>a==null?"—":(Math.round(a*10)/10)+"%";
function quadroTabela(reflexo, titulo){
  const vs=caso().verbas.filter(v=>(!!v.is_reflexo)===reflexo);
  if(!vs.length)return"";
  const cm=(caso().camadas||{});
  const linhas=vs.map(v=>{
    const[k,t]=badgeDe(v);
    const cod=v.codigo||v.codigo_glossario||v.codigo_base||v.codigo_depara||"—";
    // linha que soma várias verbas do PJC contra uma da IA: mostra quais (0000740-56, HE em 3 verbas)
    const rp=(v.rotulos_pjc||[]).filter(Boolean);
    const nome=(v.nome_ia||v.nome_pjc)+(rp.length>1?`<div class="sub" style="margin-top:2px">PJC soma ${rp.length} verbas: ${rp.map(esc).join(" · ")}</div>`:"");
    const dif=(v.total_ia!=null&&v.total_pjc!=null)?v.total_ia-v.total_pjc:null;
    // Δ é NEUTRO: a seta dá a direção e o número dá o tamanho. Quão ruim é fica
    // só na coluna Acurácia — pintar o Δ de vermelho a cada centavo de diferença
    // deixava a tabela inteira vermelha e a cor sem informação.
    const dtxt=dif==null?"—":(Math.abs(dif)<0.01?"—"
      :`${dif>0?"▲":"▼"} ${numf(Math.abs(dif))}`);
    // no reflexo, a acurácia da verba-base é a chave de leitura: base ruim => erro
    // herdado (o reflexo multiplica o principal); base certa => erro do reflexo.
    // reflexo sem par no PJC (só IA / só PJC): não há o que ler com a acurácia da base, e o
    // número ao lado de "—" parecia a nota do próprio reflexo (Raíra, 16/10/2026)
    const cb=!reflexo?"":(v.status!=="coincide")?`<td class="sub" style="text-align:right" title="reflexo sem par no PJC">—</td>`:(v.acuracia_base==null
      ? `<td class="sub" style="text-align:right" title="${esc(v.verba_base||"verba-base")}: sem par no PJC — não dá p/ separar herdado de próprio">—</td>`
      : `<td style="text-align:right;color:${corAcc(v.acuracia_base)}" title="${esc(v.verba_base||"")} bate ${v.acuracia_base}% neste caso">${v.acuracia_base}%</td>`);
    return `<tr><td style="white-space:nowrap;color:var(--cinza)">${cod}</td><td>${nome}</td>
      <td>${brl(v.total_ia)}</td><td>${brl(v.total_pjc)}</td>
      <td class="sub" title="${dif!=null&&dif>0?"o LIFT calculou a mais":(dif!=null&&dif<0?"o LIFT calculou a menos":"")}">${dtxt}</td>
      <td style="font-weight:600;color:${corAcc(v.acuracia)}" title="${rotAcc(v.acuracia)}">${v.acuracia!=null?v.acuracia+"%":"—"}</td>${cb}
      ${fatorCell(v)}<td><span class="badge ${k}">${t}</span></td></tr>`;}).join("");
  const sp=caso().sem_pjc;
  const tia=vs.reduce((s,v)=>s+(v.total_ia||0),0), tpjc=sp?null:vs.reduce((s,v)=>s+(v.total_pjc||0),0);
  // acurácia do subtotal = erro em MÓDULO da camada (não o líquido do subtotal)
  const accSub=reflexo?(cm.reflexo||{}).acc
    :(()=>{const p=cm.principal||{},r=cm.rescisoria||{};const den=(p.den||0)+(r.den||0);
           return den?100*(1-((p.dif_abs||0)+(r.dif_abs||0))/den):null;})();
  const nota=reflexo
    ? `<div class="sub" style="margin:0 0 6px;max-width:900px">Reflexos calculados em código sobre cada verba-base. A coluna <b>Acur. base</b> traz a acurácia da verba-base <b>neste caso</b> — sem ela o número do reflexo engana: o reflexo multiplica o principal, então erro de base aparece de novo no 13º, nas férias, no aviso e no DSR (1 erro contado 5 vezes).</div>`
    : "";
  return `<h3 style="margin:18px 0 6px">${titulo}</h3>${nota}
    <table><thead><tr><th>Código</th><th>Verba (nome na IA)</th><th>Valor IA</th><th>Valor PJC</th><th>Δ</th><th>Acurácia</th>${reflexo?'<th style="text-align:right" title="acurácia da verba-base neste caso">Acur. base</th>':""}<th style="text-align:right" title="fator de correção monetária aplicado de cada lado (IA / referência). Vermelho = divergem mais de 2%, ou seja índice ou data-base diferente">Fator índice</th><th>Status</th></tr></thead>
      <tbody>${linhas}</tbody>
      <tfoot><tr style="font-weight:700"><td></td><td>Subtotal</td><td>${brl(tia)}</td><td>${brl(tpjc)}</td>
        <td class="sub">${sp?"—":(tia-tpjc>0?"▲ ":"▼ ")+numf(Math.abs(tia-tpjc))}</td><td style="color:${corAcc(accSub)}" title="acurácia da camada (${rotAcc(accSub)}): erro somado em módulo ÷ valor do PJC de cada verba, não cancela">${accTxt(accSub)}</td>${reflexo?"<td></td>":""}<td></td><td></td></tr></tfoot></table>${LEGENDA_ACC}`;
}
// ---- acurácia por camada + GLOBAL (do caso) ----
// A assertividade compara TOTAIS e por isso cancela erro (verba 40% acima anula
// verba 40% abaixo). A acurácia global soma o erro em MÓDULO verba a verba, nas
// três camadas, contando verba só-IA/só-PJC como erro cheio. Fica ≤ a
// assertividade, salvo quando alguma verba do PJC é negativa.

const CAMADAS=[["principal","Principais (mensais · P10a)","var(--salmao)"],
               ["rescisoria","Rescisórias / valor fixo (P10b)","#2563C9"],
               ["reflexo","Reflexos (13º, férias, aviso, DSR)","#C98A00"]];
// As duas colunas de % respondem perguntas diferentes, e é a diferença entre elas
// que explica o caso: "acurácia da camada" conta verba perdida/extra como erro
// cheio (mede escopo + valor juntos); "valor quando casa" olha só as verbas que os
// dois lados têm (mede valor puro). Uma alta e a outra baixa = problema de escopo.
const LEG_CAMADAS=`<div class="sub" style="margin:6px 0 10px;max-width:940px;border-left:2px solid var(--salmao);padding-left:10px">
  <b>As duas colunas de % respondem perguntas diferentes:</b>
  <div style="margin-top:6px"><b>Acurácia da camada:</b> “de todo o dinheiro desta camada, quanto está no lugar certo?” Compara verba por verba e soma todos os erros, sem deixar um anular o outro. Verba que só um dos dois lados tem conta pelo valor inteiro.</div>
  <div style="margin-top:5px"><b>Valor quando casa:</b> “quando os dois lados têm a mesma verba, o valor bate?” Ignora verba faltando e verba sobrando (é a mesma medida da aba “Acurácia por verba”).</div>
  <div style="margin-top:6px">Se a segunda está bem acima da primeira, a <b>conta</b> está razoável e o problema é a <b>lista de verbas</b>. Se as duas estão baixas, o problema é a conta mesmo.</div></div>`;
function blocoCamadas(){

    const pesoIA=g.ia?Math.round(100*e.ia/g.ia):null;
    const medV=_mediana(e.accs||[]);

    return `<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cor};margin-right:7px"></span>${rot}</td>

  const canc=(g.acc!=null&&c.quadro.assertividade!=null)?Math.round((c.quadro.assertividade-g.acc)*10)/10:null;
  const medG=_mediana(g.accs||[]);
  const escopo=(medG!=null&&g.acc!=null)?Math.round((medG-g.acc)*10)/10:null;
  return `<h3 style="margin:20px 0 6px">Acurácia global e por camada</h3>
    ${LEG_CAMADAS}
    <table><thead><tr><th>Camada</th><th style="text-align:right" title="verbas que casaram com o PJC / total de verbas da camada">Verbas c/ par</th><th style="text-align:right">IA</th><th style="text-align:right">PJC</th>
      <th style="text-align:right" title="Σ|IA−PJC| ÷ Σ |PJC|, todas as verbas da camada (verba só-IA = erro cheio; verba só-PJC entra no denominador)">Acurácia da camada</th>
      <th style="text-align:right" title="mediana da acurácia das verbas que os dois lados têm — mede só o valor">Valor quando casa</th>
      <th style="text-align:right" title="reflexos cuja verba-base bate ≥95% — o que mede o reflexo em si, sem o erro herdado da base">Reflexo c/ base certa</th></tr></thead>
      <tbody>${CAMADAS.map(linha).join("")}</tbody>
      <tfoot><tr style="font-weight:700"><td>GLOBAL (todas as camadas)</td><td style="text-align:right">${g.n_par} de ${g.n||0}</td>

// ASSERTIVIDADE de uma rodada contra a referência, na definição do projeto:
// 1 − |IA − PJC| ÷ PJC (o `assert_geral` do gerar_telas), a mesma régua do
// card de assertividade do Placar.
// Denominador é o PJC, a referência, para que o erro do Fast Track seja medido
// contra o gabarito. A medida não tem piso: um caso que calcula 20× resulta em
// assertividade de −1800%. Por isso toda leitura agregada deve se basear na
// mediana, não na média.
const asrtRodada=(ia,pjc)=>{
  if(ia==null||pjc==null)return null;   // sem âncora continua "—", nunca 0 (D8)
  const num=Math.abs(ia-pjc), den=Math.abs(pjc);
  return den?100*(1-num/den):(num?0:100);
};

const ancoraRodada=c=>{
  const q=c.quadro||{};
  if(q.total_pjc_base!=null)return q.total_pjc_base;
  // Sem o campo (JSON de um render anterior), soma direto as verbas não-reflexo
  // do gabarito — mesmo resultado, e a tela não fica errada esperando render.
  let s=null;
  (c.verbas||[]).forEach(v=>{ if(!v.is_reflexo&&v.total_pjc!=null)s=(s||0)+v.total_pjc; });
  return s!=null?s:q.total_pjc;
};
// Faixa compacta no RESUMO, quando o caso foi reprocessado: assertividade da
// rodada anterior para a atual e as três maiores mudanças de verba.
// Vive no Resumo porque é ali que a pergunta nasce — olhando o quadro e vendo o
// número ruim. Mandar procurar noutra aba é onde a investigação morre.
function blocoRodadas(){
  const c=caso(), rod=(c.rodadas||[]);
  if(rod.length<2)return"";
  // âncora SEM reflexos — ver `ancoraRodada`
  const pjc=ancoraRodada(c);
  const A=rod[rod.length-2], B=rod[rod.length-1];
  const aA=asrtRodada(A.total_lift,pjc), aB=asrtRodada(B.total_lift,pjc);
  const um=v=>numf(Math.round(v*10)/10);
  const g=(aA!=null&&aB!=null)?aB-aA:null;
  const cor=g==null?"var(--cinza)":g>0.05?"var(--ok)":g<-0.05?"var(--ruim)":"var(--cinza)";
  const kv=v=>v.cod||("id:"+v.id);
  const mA=new Map((A.verbas||[]).map(v=>[kv(v),v])), mB=new Map((B.verbas||[]).map(v=>[kv(v),v]));
  const its=[...new Set([...mA.keys(),...mB.keys()])].map(k=>{
    const a=mA.get(k), b=mB.get(k), ta=a?a.total:null, tb=b?b.total:null, dv=(tb||0)-(ta||0);
    return {cod:(b||a).cod||"sem código", nome:(b||a).nome, dv,
            st:!a?"nova":!b?"sumiu":(Math.abs(dv)<=1?"igual":"mudou")};
  }).filter(i=>i.st!=="igual").sort((x,y)=>Math.abs(y.dv)-Math.abs(x.dv)).slice(0,3);
  const chips=its.map(i=>{
    const c2=i.st==="sumiu"?"var(--ruim)":i.st==="nova"?"var(--ok)":(i.dv>0?"var(--ok)":"var(--ruim)");
    const txt=i.st==="sumiu"?"sumiu":i.st==="nova"?"nova":(i.dv>0?"▲ ":"▼ ")+brl(Math.abs(i.dv));
    return `<span style="white-space:nowrap" title="${esc(i.nome||"")}"><b style="color:${c2}">${
      esc(i.cod)}</b> <span class="sub">${txt}</span></span>`;}).join(' <span class="sub">·</span> ');
  return `<div class="obs" style="border-left-color:${cor};margin-bottom:14px">
    <h3>caso reprocessado — ${rod.length}ª rodada, em ${esc(B.quando.slice(0,10).split("-").reverse().join("/"))}</h3>
    <div>assertividade <b>${aA==null?"—":um(aA)+"%"} → ${aB==null?"—":um(aB)+"%"}</b>
      ${g==null?"":`<b style="color:${cor}">(${g>0?"+":"−"}${um(Math.abs(g))} p.p.)</b>`}
      ${(A.safra&&B.safra&&A.safra!==B.safra)?`<span class="sub"> · safra ${esc(A.safra)} → ${esc(B.safra)}</span>`:""}</div>
    ${its.length?`<div style="margin-top:7px">${chips}</div>`:
      '<div class="sub" style="margin-top:7px">nenhuma verba mudou de valor entre as duas rodadas</div>'}
    <div style="margin-top:8px"><span onclick="ir('rodadas')"
      style="cursor:pointer;color:var(--salmao);font-weight:600">ver todas as rodadas e o diff completo ↗</span></div></div>`;
}
// ---- sub-aba "Rodadas": o histórico de reprocessamentos DESTE caso ---------
// Caso reprocessado é o MESMO gabarito avaliado duas vezes: a única leitura que
// separa "o FT melhorou" de "a amostra mudou". Vive aqui, e não só no bloco
// pareado da tela de versões, porque o pareado exige TROCA DE SAFRA — e
// reprocessamento sem mudança de prompt (bug corrigido, re-extração, insumo
// novo) não aparece lá e mesmo assim move o número.
// Compara `total_lift` (principal + rescisórias, SEM reflexos) contra o total da
// referência, igual ao bloco pareado. Não é o número do card: é a definição que
// se mantém idêntica entre rodadas, que é o que uma comparação exige.
function telaRodadas(){
  const c=caso(), rod=(c.rodadas||[]);
  const pjc=ancoraRodada(c);
  const cab=`<h2>Rodadas do caso</h2>
    <div class="sub" style="margin-bottom:14px">${CNJ} · uma linha por execução do cálculo final (P10a).

  const main=document.getElementById("main");
  if(rod.length<2){
    main.innerHTML=cab+`<div class="obs"><h3>${rod.length?"rodada única":"sem rodada registrada"}</h3>${
      rod.length
        ? `Rodou uma vez só, em <b>${esc(rod[0].quando.replace("T"," "))}</b>${
            rod[0].safra?` (safra <b>${esc(rod[0].safra)}</b>)`:""}. Não há antes e depois para comparar.`
        : `Não há linha de P10a para este processo no recorte atual.`}</div>`;
    return;
  }
  const um=v=>numf(Math.round(v*10)/10);
  const linhas=rod.map((r,i)=>{
    const ant=i?rod[i-1]:null;
    const d=asrtRodada(r.total_lift,pjc), dA=ant?asrtRodada(ant.total_lift,pjc):null;
    const gan=(d!=null&&dA!=null)?d-dA:null;              // >0 = assertividade subiu
    const dv=(ant&&r.total_lift!=null&&ant.total_lift!=null)?r.total_lift-ant.total_lift:null;
    const cor=gan==null?"var(--neutro)":gan>0.05?"var(--ok)":gan<-0.05?"var(--ruim)":"var(--neutro)";
    const v=r.versoes||{};
    return `<tr>
      <td style="white-space:nowrap"><b>${i+1}ª</b></td>
      <td style="white-space:nowrap">${esc(r.quando.replace("T"," "))}</td>
      <td>${r.safra?esc(r.safra):'<span class="sub">—</span>'}</td>
      <td class="sub" style="font-size:11px;white-space:nowrap">${
        ["P9a","P9b","P10a","P10b"].map(k=>v[k]==null?`${k} —`:`${k} v${v[k]}`).join(" · ")}</td>
      <td style="text-align:right">${brl(r.total_lift)}</td>
      <td style="text-align:right">${dv==null?"—":(dv>0?"▲ ":"▼ ")+brl(Math.abs(dv))}</td>
      <td style="text-align:right;font-weight:700;color:${corAcc(d)}">${d==null?"—":um(d)+"%"}</td>
      <td style="text-align:right;color:${cor};font-weight:600">${
        gan==null?"—":(gan>0?"+":"−")+um(Math.abs(gan))+" p.p."}</td></tr>`;
  }).join("");
  const aP=asrtRodada(rod[0].total_lift,pjc), aU=asrtRodada(rod[rod.length-1].total_lift,pjc);
  const veredito=(aP==null||aU==null)
    ? `<div class="obs"><h3>sem referência para ancorar</h3>Dá para ver o valor mudar entre rodadas,
       mas não para dizer se mudou <b>na direção do certo</b>: este caso não tem cálculo de
       referência lido.</div>`
    : (()=>{const g=aU-aP;
        const [cor,tit]=g>0.05?["var(--ok)","assertividade subiu"]
                       :g<-0.05?["var(--ruim)","assertividade caiu"]
                               :["var(--neutro)","não moveu o número"];
        return `<div class="obs" style="border-left-color:${cor}">
          <h3>da 1ª à ${rod.length}ª rodada: ${tit}</h3>
          assertividade <b>${um(aP)}% → ${um(aU)}%</b>
          (${g>0?"+":"−"}${um(Math.abs(g))} p.p.) · referência ${brl(pjc)}</div>`;})();
  // Diff VERBA A VERBA entre rodadas consecutivas. O total diz QUE caiu; isto diz
  // SE foi verba que sumiu ou verba que encolheu — causas diferentes, que se
  // investigam em lugares diferentes (escopo do P2/P4 x quantificação do P9).
  // A chave é o código do glossário: `id_verba` é posicional (verba_01...) e a
  // mesma posição pode ser outra verba na rodada seguinte.
  const kv=v=>v.cod||("id:"+v.id);
  const rotV=v=>v.nome?`<b>${esc(v.cod)}</b> · ${esc(v.nome)}`:(v.cod?`<b>${esc(v.cod)}</b>`:`<span class="sub">sem código (${esc(String(v.id))})</span>`);
  const ESTADO={sumiu:["var(--ruim)","sumiu"],nova:["var(--ok)","nova"],
                subiu:["var(--ok)","subiu"],caiu:["var(--ruim)","caiu"],igual:["var(--neutro)","igual"]};
  const blocoDiff=rod.slice(1).map((B,j)=>{
    const A=rod[j], mA=new Map((A.verbas||[]).map(v=>[kv(v),v])), mB=new Map((B.verbas||[]).map(v=>[kv(v),v]));
    const ks=[...new Set([...mA.keys(),...mB.keys()])];
    if(!ks.length)return `<details style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:7px">
      <summary style="cursor:pointer;list-style:none"><b style="font-family:Sora">${j+1}ª → ${j+2}ª rodada</b>
      <span class="sub"> · nenhuma verba registrada nas duas rodadas</span></summary></details>`;
    const its=ks.map(k=>{const a=mA.get(k),b=mB.get(k);
      const ta=a?a.total:null, tb=b?b.total:null, dv=(tb||0)-(ta||0);
      const st=!a?"nova":!b?"sumiu":Math.abs(dv)<=1?"igual":(dv>0?"subiu":"caiu");
      return {rot:rotV(b||a),cam:(b||a).camada,ta,tb,dv,st};
    }).sort((x,y)=>Math.abs(y.dv)-Math.abs(x.dv));
    const n=k=>its.filter(i=>i.st===k).length;
    const tot=its.reduce((s,i)=>s+i.dv,0);
    const corpo=its.map(i=>{const [cor,rot]=ESTADO[i.st];
      return `<tr><td>${i.rot}</td>
        <td class="sub" style="font-size:11px">${i.cam==="rescisoria"?"rescisória":"mensal"}</td>
        <td style="text-align:right">${i.ta==null?'<span class="sub">—</span>':brl(i.ta)}</td>
        <td style="text-align:right">${i.tb==null?'<span class="sub">—</span>':brl(i.tb)}</td>
        <td style="text-align:right">${i.st==="nova"||i.st==="sumiu"?"—":(i.dv>0?"▲ ":"▼ ")+brl(Math.abs(i.dv))}</td>
        <td style="text-align:right;color:${cor};font-weight:600">${rot}</td></tr>`;}).join("");
    return `<details style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:7px" ${j===rod.length-2?"open":""}>
      <summary style="cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b style="font-family:Sora">${j+1}ª → ${j+2}ª rodada</b>
        ${n("sumiu")?`<span class="sub" style="color:var(--ruim)">${n("sumiu")} sumiu</span>`:""}
        ${n("nova")?`<span class="sub" style="color:var(--ok)">${n("nova")} nova</span>`:""}
        ${n("caiu")+n("subiu")?`<span class="sub">${n("caiu")+n("subiu")} mudou de valor</span>`:""}
        ${n("igual")?`<span class="sub">${n("igual")} igual</span>`:""}
        <span class="sub" style="margin-left:auto;font-weight:700">${tot>0?"▲ ":"▼ "}${brl(Math.abs(tot))}</span>
      </summary>
      <div style="overflow-x:auto"><table style="font-size:12px;margin-top:6px"><thead><tr>
        <th>Verba</th><th>Camada</th><th style="text-align:right">Antes</th>
        <th style="text-align:right">Depois</th><th style="text-align:right">Δ</th>
        <th style="text-align:right">O que houve</th></tr></thead><tbody>${corpo}</tbody></table></div>
    </details>`;}).join("");
  main.innerHTML=cab+veredito+
    `<div style="overflow-x:auto"><table style="font-size:12px;margin-top:12px"><thead><tr>
      <th>#</th><th>Quando</th><th>Safra</th><th>Versões de prompt</th>
      <th style="text-align:right">Total LIFT</th><th style="text-align:right">Δ R$ vs anterior</th>
      <th style="text-align:right" title="1 − |LIFT − referência| ÷ referência (sem reflexos). Pode passar de −100% quando o LIFT calcula acima da referência.">Assertividade</th>
      <th style="text-align:right">Δ p.p.</th></tr></thead><tbody>${linhas}</tbody></table></div>
    ${LEGENDA_ACC}
    <h3 style="margin:20px 0 8px">O que mudou, verba a verba</h3>
    <div class="sub" style="margin-bottom:8px">Uma verba que <b>sumiu</b> é problema de escopo
    (o P2/P4 deixou de identificar); uma que <b>caiu</b> é de quantificação (o P9 apurou menos).
    Ordenado pelo tamanho da mudança em reais.</div>
    ${blocoDiff}
    <div class="obs" style="margin-top:14px"><h3>como ler</h3>
      <b>Total LIFT</b> é principal + rescisórias, <b>sem reflexos</b> — os reflexos são calculados
      em código e não têm versão de prompt. A referência usada aqui (${brl(pjc)}) também é
      <b>sem reflexos</b>, então os dois lados batem: a assertividade desta tela é a do subtotal
      <b>Verbas</b> do Quadro geral, não a do <b>Total geral</b>, que inclui reflexos dos dois
      lados.<br><br>
      Só a camada <b>nominal</b> volta no histórico. As tabelas consolidadas (corrigido e pós-juros)
      guardam apenas a safra mais recente de cada processo, então <b>não existe</b> a camada
      corrigida das rodadas antigas — e é por isso que a <b>acurácia global</b> de antes não é
      reconstruível, só a assertividade.</div>`;
}

function verVerba(i){
  _modo("caso");
  ["resumo","quadro","hist"].forEach(x=>document.getElementById("nv-"+x).classList.remove("on"));
  document.querySelectorAll(".vitem").forEach(e=>e.classList.toggle("sel",+e.dataset.i===i));
  const v=caso().verbas[i];const[bk,bt]=badgeDe(v);vAtual=v;
  let tabela="";
  if(v.competencias.length){
    // valores e Δ ficam NEUTROS (cor é só da acurácia). A seta dá a direção; o
    // sinal de "quão ruim" da competência vive na coluna Acur. do grupo Valor.
    const dCel=d=>d==null?'<td class="vazio">—</td>'
      :(Math.abs(d)<0.01?'<td class="vazio">—</td>'
      :`<td class="sub">${d>0?"▲":"▼"} ${numf(Math.abs(d))}</td>`);
    const par=(ia,pj,fmt)=>{
      const d=(ia!=null&&pj!=null)?ia-pj:null;
      return `<td class="grp">${fmt(ia)}</td><td class="${(ia==null||pj==null)?"vazio":""}">${fmt(pj)}</td>`+dCel(d);};
    // acurácia da competência: 1 − |Δ| ÷ PJC (mesma conta da verba). Sem piso,
    // igual às outras: o mês em que o LIFT calculou o dobro dá 0%, o triplo dá
    // −100%. Denominador zero segue a regra D4.
    const accComp=(ia,pj)=>{if(ia==null||pj==null)return null;
      const num=Math.abs(ia-pj), den=Math.abs(pj);
      return den?Math.round(1000*(1-num/den))/10:(num?0:100);};
    const linhas=v.competencias.map(c=>{
      const prin=c.pjc.find(x=>x.rotulo===v.rotulo_principal)||c.pjc[0]||{};
      const fer=c.ferias_pjc>0?` <span class="fer">${c.ferias_pjc}d fér.</span>`:"";
      // Súmula 340: base da IA vem separada em fixa+variável (base_calculo_bruta é nulo)
      const baseCells=(c.ia.s340&&(c.ia.base_fixa!=null||c.ia.base_variavel!=null))
        ? `<td class="grp">Fixa ${numf(c.ia.base_fixa)}<br>Var ${numf(c.ia.base_variavel)}</td><td>${numf(prin.base)}</td><td class="vazio">—</td>`
        : par(c.ia.base,prin.base,numf);
      // Deduzido = o que já foi pago na folha e é abatido do devido. O "Valor" das
      // duas colunas já é líquido (IA: valor_mensal_calculado − valores_compensados;
      // PJC: Devido − Pago), então a dedução precisa de coluna própria — sem ela um
      // Δ de valor não distingue "apurou diferente" de "não deduziu o pago".
      // Ninguém deduziu nada no mês: fica apagado, não verde (0=0 não é acerto).
      const dIA=c.ia.compensado, dPJC=prin.pago;
      const tip=`title="Bruto IA ${brl(c.ia.valor_bruto)} · Bruto PJC ${brl(prin.valor_bruto)}"`;
      const dedCells=(!dIA&&!dPJC)
        ? `<td class="grp vazio" ${tip}>—</td><td class="vazio" ${tip}>—</td><td class="vazio">—</td>`
        : `<td class="grp" ${tip}>${brl(dIA||0)}</td><td ${tip}>${brl(dPJC||0)}</td>`+dCel((dIA||0)-(dPJC||0));
      // DIAS: conceitos diferentes dos dois lados, então NÃO é comparação com
      // Δ vermelho. IA = dias trabalhados efetivos do P8 (úteis − férias/feriado/
      // afastamento); referência = dias corridos do período − férias, derivado
      // pelo app (o PJC não traz "dias" nas verbas de hora, traz horas).
      const k8=c.cal_p8||{};
      const tipDias=k8.dias!=null
        ? `title="P8: ${k8.total_mes} dias no mês · ${k8.uteis} úteis · −${k8.ferias||0} férias · −${k8.feriados||0} feriado · −${k8.afast||0} afastamento = ${k8.dias} trabalhados${k8.horas_contratuais!=null?` · ${k8.horas_contratuais}h contratuais`:""}"`
        : 'title="sem calendário do P8 nesta competência"';
      const diasCells=`<td class="grp" ${tipDias}>${numf(c.ia.dias)}${c.ia.dias_fonte==="P8"?' <span class="sub" style="font-size:9px">P8</span>':""}</td>`
        +`<td class="sub" title="dias corridos do período − férias (derivado pelo app; o PJC não traz dias nas verbas de hora)">${numf(c.dias_pjc)}</td>`
        +`<td class="sub">${(c.ia.dias!=null&&c.dias_pjc!=null)?numf(c.ia.dias-c.dias_pjc):"—"}</td>`;
      // ÍNDICE de correção monetária aplicado na competência, dos dois lados
      const iI=c.ia.indice, iP=prin.indice;
      const f4=x=>x==null?"—":x.toFixed(4).replace(".",",");
      const dI=(iI!=null&&iP!=null)?iI-iP:null;
      // índice: o único destaque que sobrevive fora da acurácia, porque acima de
      // 2% ele aponta índice/data-base diferente, que é outra causa (não valor).
      const divI=dI!=null&&Math.abs(dI)/Math.max(iI,iP)>0.02;
      const indCells=`<td class="grp">${f4(iI)}</td><td class="${dI==null?"vazio":""}">${f4(iP)}</td>`
        +`<td class="${dI==null?"vazio":"sub"}" style="${divI?"color:var(--acc-perto);font-weight:600":""}" title="diferença de fator de correção: acima de 2% é índice ou data-base diferente, não conta errada">${dI!=null?(dI>0?"+":"")+dI.toFixed(4).replace(".",","):"—"}</td>`;
      const aC=accComp(c.ia.valor,prin.valor);
      return `<tr><td>${mes(c.competencia)}${fer}</td>
        ${baseCells}
        ${diasCells}
        ${par(c.ia.horas,prin.horas,numf)}
        ${dedCells}
        ${par(c.ia.valor,prin.valor,brl)}
        <td style="font-weight:600;color:${corAcc(aC)}" title="${rotAcc(aC)}">${aC!=null?accTxt(aC):"—"}</td>
        ${indCells}

const PREM_ESTEIRA=/*__PREMISSAS_ESTEIRA__*/[];

PREM_ESTEIRA.forEach(it=>{const m=/^(\d{1,2}\.\d)\s*(.*)$/.exec(it.secao||""); if(!m)return;
  const s=PREM_SECAO[m[1]]=PREM_SECAO[m[1]]||{nome:m[2],itens:[]}; s.itens.push(it); PREM_ITEM[it.id]=it;});
const PREM_SIT={enderecada:["endereçada","var(--ok)"],parcial:["parcial","var(--acc-perto)"],nao_enderecada:["não endereçada","var(--ruim)"],

// seções e itens que a regra citada pelo agente menciona; só conta número que existe no manual
function _premCitadas(p){
  const t=String(p.regra||"");
  if(!/premissa/i.test(t)&&!/^\s*\d{1,2}\.\d/.test(t))return {secoes:[],itens:[]};
  const secoes=new Set(), itens=new Set();
  t.replace(/\b(\d{1,2}\.\d)(?:-([a-z]{1,2}))?\b/g,(m,s,i)=>{
    if(!PREM_SECAO[s])return m; secoes.add(s); if(i&&PREM_ITEM[s+"-"+i])itens.add(s+"-"+i); return m;});
  return {secoes:[...secoes],itens:[...itens]};
}

      return cab+_tab(porItem[i]);}).join("");
    const cats=Object.keys(AG_CAT).filter(k=>e.cat[k]).map(k=>`${_agTag(k,true)} ${e.cat[k]}`).join(" ");
    return `<details style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:7px">
      <summary style="cursor:pointer;list-style:none">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

          <span style="min-width:110px;text-align:right">▲ <b>${brlK(e.mais)}</b></span>
          <span style="min-width:110px;text-align:right" class="sub">▼ ${brlK(e.menos)}</span>
          <b style="font-family:Sora;min-width:120px;text-align:right">${e.ps.length} probl. · ${e.casos.size} casos</b></div>
        <div style="margin:5px 0 0 52px;font-size:11px;display:flex;gap:14px;flex-wrap:wrap"><span>${cats}</span><span class="sub">esteira: ${sitSecao(e.s)}</span></div>

  document.getElementById("main").innerHTML=`<h2>Premissas do manual</h2>

// O que interessa medir é o que vai pelo automatizado: caso não-apto vai pro
// humano/Full, então o erro dele não é dívida do FT. Não-apto continua visível
// nas seções que falam de APTIDÃO (funil, categorias, tipo de cálculo, problemas),
// que precisam dele por definição — essas ignoram este seletor e dizem isso.
let soAptos=true;
const casosEscopo=()=>soAptos?casosFiltrados().filter(c=>c.apto):casosFiltrados();
const _RENDER={placar:()=>telaPlacar(),verbas:()=>telaVerbas(),consol:()=>telaConsol(),naocalc:()=>telaNaoCalc(),problemas:()=>telaProblemas(),premissas:()=>telaPremissas(),

const _media=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const _mediana=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
// ---- agregação das camadas (soma o erro em módulo através dos casos) ----------
// Duas leituras por camada, que respondem perguntas diferentes:
//  - `acc` POOL = Σ|IA−PJC| ÷ Σ|PJC| de todos os casos: ponderada por R$, é o
//    quanto do dinheiro o FT acerta (um caso grande pesa mais, como na vida).
//    Sem piso, como as demais: caso que calcula acima do dobro da referência
//    puxa a camada para o negativo.
//  - `medCaso` / `medVerba` = mediana por caso / por verba: o caso típico, imune
//    a um outlier gigante. As duas juntas evitam a leitura errada de qualquer uma.
function agregaCamadas(cs){
  const K=["principal","rescisoria","reflexo","global"], out={};
  K.forEach(k=>out[k]={dif:0,den:0,ia:0,pjc:0,n:0,nPar:0,nCasos:0,accs:[],accsCaso:[],baseOk:[]});
  cs.forEach(c=>{const cm=c.camadas; if(!cm)return;
    K.forEach(k=>{const e=cm[k], o=out[k]; if(!e||!e.n)return;
      o.dif+=e.dif_abs||0; o.den+=e.den||0; o.ia+=e.ia||0; o.pjc+=e.pjc||0;
      o.n+=e.n||0; o.nPar+=e.n_par||0; o.nCasos++;
      (e.accs||[]).forEach(a=>o.accs.push(a));
      (e.accs_base_ok||[]).forEach(a=>o.baseOk.push(a));
      if(e.acc!=null)o.accsCaso.push(e.acc);});});
  K.forEach(k=>{const o=out[k];
    o.acc=o.den?100*(1-o.dif/o.den):null;
    o.medCaso=_mediana(o.accsCaso); o.medVerba=_mediana(o.accs); o.medBaseOk=_mediana(o.baseOk);});
  return out;
}
// ---- agregação dos dados cadastrais (por campo) -------------------------------
// Divergência de admissão/demissão/período não é erro de cálculo: é insumo errado.
// Agregado por campo mostra se é caso isolado ou padrão do extrator (P1).
function agregaCadastro(cs){
  const campos={}; let comCad=0, comDiv=0, comGrave=0, comEsc=0;
  cs.forEach(c=>{
    const cad=c.cadastro; if(!cad||!cad.n_comparados)return;
    comCad++; if(cad.n_diverge)comDiv++; if((cad.graves||[]).length)comGrave++; if(cad.n_escopo)comEsc++;
    (cad.linhas||[]).forEach(l=>{
      const e=campos[l.chave]||(campos[l.chave]={campo:l.campo,bate:0,parcial:0,mais:0,menos:0,refa:0,diverge:0,sem:0,casos:[]});
      if(l.status==="bate")e.bate++;
      else if(l.status==="parcial"){e.parcial++;e.casos.push({cnj:c.cnj,l,tipo:"parcial"});}
      else if(l.status==="ref_atualizada")e.refa++;
      else if(l.status==="escopo_maior"){e.mais++;e.casos.push({cnj:c.cnj,l,tipo:"escopo"});}
      else if(l.status==="escopo_menor"){e.menos++;e.casos.push({cnj:c.cnj,l,tipo:"escopo"});}
      else if(l.status==="diverge"){e.diverge++;e.casos.push({cnj:c.cnj,l,tipo:"diverge"});}
      else e.sem++;});});
  return {campos,comCad,comDiv,comGrave,comEsc};
}

    <tr style="font-weight:700"><td>Total</td><td style="text-align:right">45.000</td><td style="text-align:right">40.000</td><td style="text-align:right">25.000</td><td style="text-align:right">40.000</td><td></td></tr>
  </tbody></table>
  <div style="margin-top:8px"><b>② Assertividade = 87,5%.</b> Só compara 45.000 com 40.000: a diferença é de R$ 5 mil sobre os R$ 40 mil da referência. Parece ótimo, mas os R$ 10 mil a mais da hora extra <b>anularam</b> os R$ 10 mil a menos da insalubridade.</div>
  <div style="margin-top:5px"><b>① Acurácia global = 37,5%.</b> Soma os erros de verdade (R$ 25 mil) e divide pelo <b>valor da referência</b> (R$ 40 mil): 25 ÷ 40 = 62,5% de erro, logo 37,5% no lugar certo. Quase dois terços do dinheiro estão errados, e era isso que o total escondia.</div>
  <div style="margin-top:5px" class="sub"><b>Por que o denominador é o valor da referência</b> (R$ 40 mil) e não o maior lado de cada verba: o erro do Fast Track se mede contra o gabarito. Dividir pelo maior lado colocava o próprio erro no denominador e dava desconto justamente a quem erra mais — uma verba calculada em 20× a referência tirava 95% de acerto. Duas consequências, as duas aceitas de propósito: o dano moral, que a referência não tem, entra com R$ 5 mil de erro e <b>nada</b> no denominador; e uma verba calculada acima do dobro passa de 100% de erro sozinha, então a medida <b>não tem piso</b> e pode ficar negativa. É por isso que todo número agregado do painel é <b>mediana</b>, nunca média. É exatamente a conta da coluna <b>“Acurácia”</b> de cada verba nas tabelas do caso, só somada.</div>
  <div style="margin-top:5px"><b>③ Valor quando casa = 50%.</b> Olha só as duas verbas que os dois lados têm: a hora extra erra R$ 10 mil sobre os R$ 20 mil da referência (50%) e a insalubridade erra os mesmos R$ 10 mil sobre os mesmos R$ 20 mil (50%) — uma para cima, outra para baixo, com o mesmo tamanho relativo. O dano moral, que só a IA tem, fica de fora daqui, e é justamente ele que separa ③ de ①.</div>
  <div style="margin-top:7px" class="sub">Neste exemplo: <b>②</b> muito acima de <b>①</b> avisa que há erro se anulando <b>ou</b> verba de um lado só. Quem separa os dois é o <b>índice de compensação</b>, que aqui dá <b>80%</b> — o erro líquido é R$ 5 mil sobre R$ 25 mil de erro bruto, então quatro quintos do erro somem no total. Os 12,5 pontos entre <b>③</b> (50%) e <b>①</b> (37,5%) são o dano moral: escopo, não conta errada.</div>
</details>`;
// ============================================================================
// Telas agregadas. Uma tela = uma pergunta + UMA população, dita no topo.
// O antigo "Controle Geral" respondia quatro perguntas na mesma rolagem, com
// quatro populações diferentes (todos × escopo × confiáveis × FT) — foi assim
// que o mesmo "aptos" apareceu com três valores na mesma tela.
//   Placar            → quanto o cálculo acerta?        (aptos · ref < 200k)
//   Onde o erro nasce → de que natureza é o erro?       (mesma população)
//   Elegibilidade     → quem entra no automatizado?     (todos do período)
//   Confiança do dado → dá para acreditar na medição?   (todos do período)
// ============================================================================
const LIMITE_FT=200000, TIPO_RR="Cálculo de Risco Real";
// "Apto valor" (Raíra, 15/10): apto com o valor calculado pela IA entre R$ 50 mil e R$ 200 mil. Usa o valor
// da IA, e não o da referência, porque é o que se conhece em produção (mesmo gate da matriz dos R$ 200k).
const APTO_VALOR_MIN=50000, APTO_VALOR_MAX=200000;
const aptoValor=c=>!!(c&&c.apto&&c.quadro&&c.quadro.total_ia!=null&&c.quadro.total_ia>=APTO_VALOR_MIN&&c.quadro.total_ia<=APTO_VALOR_MAX);
// % dos casos com assertividade de 80% ou mais (a meta), ao lado de cada mediana
const _pct80=xs=>{const v=xs.filter(x=>x!=null);return v.length?Math.round(100*v.filter(x=>x>=80).length/v.length)+"%":"—";};
const _meta80=xs=>" · <b>"+_pct80(xs)+" com ≥ 80%</b>";
const _tile=(n,l,d,hero)=>`<div class="tile ${hero?"hero":"plain"}"><div class="n">${n}</div><div class="l">${l}</div>${d?`<div class="d">${d}</div>`:""}</div>`;
const _cab=(t,q)=>`<div class="seccab"><h3>${t}</h3><span class="q">${q}</span></div><div class="sechr"></div>`;
const PER_PRESETS=[["7 dias",7],["15 dias",15],["30 dias",30],["90 dias",90],["Tudo",null]];
// barra de período única, igual em todas as abas (o recorte tem que ser o mesmo
// quando se pula de uma tela para a outra, senão os números deixam de conversar)
function barraPeriodo(){
  return `<div class="an-fil"><span class="fl">Período</span>${PER_PRESETS.map(([lb,n])=>
      `<button class="${anPeriodo===lb?"on":""}" onclick="anSetPeriodo(${n},'${lb}')">${lb}</button>`).join("")}
    <span style="width:10px"></span>
    <input type="date" id="fDe" value="${fDe}" onchange="aplicaFiltro()">
    <span class="sub" style="font-size:11.5px">até</span>
    <input type="date" id="fAte" value="${fAte}" onchange="aplicaFiltro()">
    <button class="btn-dl" style="margin:0" onclick="limpaFiltro()">limpar</button>
    </div>`;
}
// população do PLACAR e do ONDE O ERRO NASCE: aptos, referência lida e abaixo do
// teto do FT. As duas telas partilham isto de propósito — a segunda é a primeira
// aberta por natureza de erro, então tem de somar o mesmo dinheiro.
const baseFT=()=>casosEscopo().filter(comPJC).filter(c=>c.apto&&c.quadro.total_pjc!=null&&c.quadro.total_pjc<LIMITE_FT);

// ---------------------------------------------------------------- RODADA -----
// Cópia de 18/10 (Raíra): uma tela com o número da rodada, a direção do erro, o score de confiança
// e os não aptos por motivo. Saíram evolução semanal, distribuição, jornada, camadas, "Onde o erro
// nasce", "Acurácia por verba", Elegibilidade, Confiança do dado e Versões de prompt (o agente já
// classifica o erro caso a caso). A página de antes está em antes_redesenho_1810/.
// direção do total do caso: a mais / a menos que a referência, com ±5% contando como dentro
const _dirCaso=c=>{const q=c.quadro||{},ia=q.total_ia,pj=q.total_pjc;
  if(ia==null||pj==null||pj<=0)return null; const r=(ia-pj)/pj; return r>0.05?"mais":r<-0.05?"menos":"ok";};
const DIRECOES=[["","Todas"],["mais","▲ A mais (> 5%)"],["menos","▼ A menos (> 5%)"],["ok","Dentro de ± 5%"]];
const GRUPOS_CASO=[["todos","Todos"],["aptos","Aptos"],["apto_valor","Apto valor (IA R$ 50–200 mil)"],["naoapto","Não aptos"]];
const _noGrupo=(c,g)=>g==="aptos"?!!c.apto:g==="apto_valor"?aptoValor(c):g==="naoapto"?!c.apto:true;
const _probsDe=cs=>{const out=[];cs.forEach(c=>(((c.agente||{}).problemas)||[]).forEach(p=>out.push({...p,cnj:c.cnj})));return out;};
const _selF=(lab,val,opts,on)=>`<div><div class="sub">${lab}</div><select onchange="${on}" style="padding:8px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--surface);color:var(--text)">${
  opts.map(([k,l])=>`<option value="${k}"${val===k?" selected":""}>${l}</option>`).join("")}</select></div>`;
function telaPlacar(){
  const todos=casosFiltrados(), ap=todos.filter(c=>c.apto), nAp=ap.length;
  const refTodos=todos.filter(comPJC), apRef=ap.filter(comPJC), apValRef=apRef.filter(aptoValor);
  const _asA=a=>a.map(c=>c.quadro.assertividade);
  // faixa sem nenhum apto com referência (hoje, "a calcular") não ganha linha vazia
  const FAIXAS=CONF_FAIXAS.filter(([k])=>apRef.some(c=>(c.confianca||{}).faixa===k));
  const _dsPer=todos.map(c=>c.data_processamento).filter(Boolean).sort();
  const _dmy=d=>d?d.slice(8,10)+"/"+d.slice(5,7):"—";
  const perTxt=_dsPer.length?`<b>${todos.length}</b> casos com a última execução de <b>${_dmy(_dsPer[0])}</b> a <b>${_dmy(_dsPer[_dsPer.length-1])}</b> · <b>${nAp}</b> aptos · <b>${todos.filter(c=>c.agente).length}</b> com análise do agente`:"nenhum caso";
  const _rgRow=(nome,desc,xs,principal)=>{const v=xs.filter(x=>x!=null), n=v.length, k=v.filter(x=>x>=80).length, med=_mediana(v);
    return `<tr class="${principal?"rg-princ":""}"><td><div class="rg-nome">${nome}</div>${desc?`<div class="rg-desc">${desc}</div>`:""}</td>
      <td class="rg-num rg-n">${n}</td>
      <td class="rg-num"><span class="rg-meta">${n?Math.round(100*k/n)+"%":"—"}</span></td>
      <td class="rg-num"><span class="rg-med" style="color:${corAcc(med)}">${accTxt(med)}</span></td></tr>`;};
  const _rgCab=`<thead><tr><th></th><th class="rg-num">Casos</th><th class="rg-num">Na meta</th><th class="rg-num">Mediana</th></tr></thead>`;
  // ---- funil: entrou → apto → apto valor → apto valor com confiança alta (Raíra, 18/10) ----
  const apV=ap.filter(aptoValor), apVA=apV.filter(c=>(c.confianca||{}).faixa==="alta");
  // entrada da esteira (29/10): CNJs que rodaram e onde pararam; só sem filtro de período/faixa, porque vale para o painel inteiro
  const E=(!fDe&&!fAte&&!fScore&&D.entrada)?D.entrada:null, base=E?E.rodaram:(todos.length||1);
  const _fs=(n,rot,desc,ant)=>`<div class="fstep"><div class="fbar-wrap">
      <div class="fbar-track"><div class="fbar-fill" style="width:${Math.max(4,Math.round(100*n/base))}%">${n}</div></div>
      <div class="fbar-meta" style="width:340px"><b style="color:var(--text)">${rot}</b>${ant!=null?` · ${ant?Math.round(100*n/ant):0}% do anterior`:""}${desc?`<div style="font-size:11px">${desc}</div>`:""}</div></div></div>`;
  // 30/10: o painel só tem processo com PJC (inclusive execução com erro); quem terminou sem PJC fica na lista de pendentes
  const _nf=f=>todos.filter(f).length, nPend=(D.pendentes_pjc||[]).length;
  const entrada=E?_fs(E.rodaram,"Rodaram na esteira",`CNJs com execução desde ${_dmy(E.desde)} (até ${_dmy(E.ate.slice(0,10))}) · terminaram ${E.finalizados} · pararam em erro ${E.n_erros} (${Object.entries(E.erros).map(([k,v])=>esc(k)+" "+v).join(" · ")})${E.andamento?` · em andamento ${E.andamento}`:""}`,null):"";
  const descPJC=E?`na régua ${_nf(comPJC)} · execução com erro ${_nf(c=>c.fora_regua==="nao_calculado")} · gabarito a corrigir ${_nf(c=>c.fora_regua==="gabarito_a_corrigir")} · extração não confiável ${_nf(c=>!c.sem_pjc&&!c.fora_regua&&!c.extracao_confiavel)}<br><b>sem PJC: ${nPend}</b> (fora do painel e do funil; lista de pendentes de PJC)`:"";
  const DEG=[[E?"Com PJC (no painel)":"Casos que entraram",descPJC,todos],["Aptos",ap],["Apto valor","IA entre R$ 50 mil e R$ 200 mil",apV],["Apto valor com confiança alta","",apVA]]
    .map(x=>x.length===2?[x[0],"",x[1]]:x);
  const funil=entrada+DEG.map(([rot,desc,cs],i)=>{
    const w=Math.max(4,Math.round(100*cs.length/base)), ant=i?DEG[i-1][2].length:(E?E.rodaram:null);
    const A=_asA(cs.filter(comPJC)).filter(x=>x!=null), med=_mediana(A), k=A.filter(x=>x>=80).length;
    return `<div class="fstep"><div class="fbar-wrap">
      <div class="fbar-track"><div class="fbar-fill" style="width:${w}%">${cs.length}</div></div>
      <div class="fbar-meta" style="width:340px"><b style="color:var(--text)">${rot}</b>${ant!=null?` · ${ant?Math.round(100*cs.length/ant):0}% do anterior`:""}${desc?`<span style="font-size:11px"> · ${desc}</span>`:""}
        <div style="font-size:11px">${A.length?`na meta <b>${Math.round(100*k/A.length)}%</b> · mediana <b style="color:${corAcc(med)}">${accTxt(med)}</b> · ${A.length} com referência lida`:"sem referência lida"}</div></div></div></div>`;}).join("");
  const rgTab=`<table class="rg-tab">${_rgCab}<tbody>
    ${_rgRow("Aptos",apRef.length<nAp?`${nAp-apRef.length} aptos com referência não confiável ficam fora`:"régua de produção",_asA(apRef),true)}
    ${_rgRow("Apto valor","IA entre R$ 50 mil e R$ 200 mil",_asA(apValRef),false)}
    ${_rgRow("Todos com referência","aptos e não aptos",_asA(refTodos),false)}
  </tbody></table>`;
  const _rgScore=base=>`<table class="rg-tab">${_rgCab}<tbody>
    ${FAIXAS.map(([k,rot,ic])=>_rgRow(`${rot} <span class="rg-desc">${ic}</span>`,"",_asA(base.filter(c=>(c.confianca||{}).faixa===k)),false)).join("")}
  </tbody></table>`;
  const rgScore=_rgScore(apRef), rgScoreValor=_rgScore(apValRef);
  // ---- direção: sobrecálculo primeiro --------------------------------------
  const _dirLinha=(nome,cs)=>{const g={mais:[],ok:[],menos:[]}; cs.forEach(c=>{const d=_dirCaso(c); if(d)g[d].push(c);});
    const rs=arr=>arr.reduce((s,c)=>s+Math.abs(c.quadro.total_ia-c.quadro.total_pjc),0);
    const n=g.mais.length+g.ok.length+g.menos.length, pc=x=>n?Math.round(100*x/n)+"%":"—";
    return `<tr><td><div class="rg-nome">${nome}</div></td>
      <td class="rg-num"><b>${g.mais.length}</b> <span class="sub">${pc(g.mais.length)} · ${brlK(rs(g.mais))}</span></td>
      <td class="rg-num">${g.ok.length} <span class="sub">${pc(g.ok.length)}</span></td>
      <td class="rg-num">${g.menos.length} <span class="sub">${pc(g.menos.length)} · ${brlK(rs(g.menos))}</span></td></tr>`;};
  const dirTab=`<table class="rg-tab"><thead><tr><th></th><th class="rg-num">▲ A mais</th><th class="rg-num">Dentro de ± 5%</th><th class="rg-num">▼ A menos</th></tr></thead><tbody>
    ${_dirLinha("Aptos",apRef)}${_dirLinha("Apto valor",apValRef)}
    ${FAIXAS.map(([k,rot])=>_dirLinha(`Aptos · score ${rot.toLowerCase()}`,apRef.filter(c=>(c.confianca||{}).faixa===k))).join("")}
    ${FAIXAS.map(([k,rot])=>_dirLinha(`Apto valor · score ${rot.toLowerCase()}`,apValRef.filter(c=>(c.confianca||{}).faixa===k))).join("")}</tbody></table>`;
  // ---- score de confiança: a faixa prevê o acerto? Mesma população das tabelas de cima (todos os aptos
  // com referência lida). Antes usava só os de referência < R$ 200 mil (herança do Placar) e o n de cada
  // faixa não batia com o resto da tela (Raíra, 19/10).
  const confGr=FAIXAS.map(([k,rot])=>{
    const cs2=apRef.filter(c=>(c.confianca||{}).faixa===k&&c.quadro.assertividade!=null);
    const A=cs2.map(c=>c.quadro.assertividade), fxC=[0,0,0,0];
    A.forEach(a=>fxC[a>=95?0:a>=80?1:a>=50?2:3]++);
    const dif=cs2.map(c=>(c.quadro.total_ia||0)-(c.quadro.total_pjc||0));
    return {k,rot,n:A.length,fx:fxC,mediana:_mediana(A),nMeta:fxC[0]+fxC[1],
            pct80:A.length?Math.round(100*(fxC[0]+fxC[1])/A.length):0,
            sobre:dif.filter(d=>d>0).reduce((s,d)=>s+d,0),sub:-dif.filter(d=>d<0).reduce((s,d)=>s+d,0)};});
  // sem nenhum apto na alta (ou sem score), confGr[0] não é a alta ou não existe: a tela inteira quebrava
  const cAlta=confGr.find(x=>x.k==="alta")||{n:0,nMeta:0,sobre:0,pct80:0}, cTot=confGr.reduce((s,e)=>({n:s.n+e.n,nMeta:s.nMeta+e.nMeta,sobre:s.sobre+e.sobre}),{n:0,nMeta:0,sobre:0});
  const pctTot=cTot.n?Math.round(100*cTot.nMeta/cTot.n):0;
  const sobreFora=cTot.sobre?Math.round(100*(cTot.sobre-cAlta.sobre)/cTot.sobre):0;
  // ---- não aptos por motivo --------------------------------------------------
  const grp={}; todos.filter(c=>!c.apto).forEach(c=>{const k=c.categoria_inaptidao||"Motivo não classificado";grp[k]=(grp[k]||0)+1;});
  const dord=Object.entries(grp).sort((a,b)=>b[1]-a[1]), dmax=Math.max.apply(null,dord.map(d=>d[1]).concat(1));
  const naoAptos=dord.length?dord.map(([k,n])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px"><div style="width:230px;font-size:12px">${esc(k)}</div><div style="flex:1;height:18px;background:var(--card);border-radius:6px;overflow:hidden"><div style="width:${100*n/dmax}%;height:100%;background:var(--neutro);border-radius:6px"></div></div><div style="width:34px;text-align:right;font-family:Sora;font-weight:600;font-size:12px">${n}</div></div>`).join(""):'<div class="sub">Nenhum caso não apto.</div>';
  document.getElementById("main").innerHTML=`<h2>Rodada</h2>
    ${barraPeriodo()}
    <div class="rg-per">${perTxt}</div>
    ${_cab("Funil","quantos casos chegam até a compra?")}
    <div class="panel" style="margin-top:0">${funil}</div>
    <div class="rg-grid">
      <div class="rg-bloco"><h4>Assertividade por recorte</h4>${rgTab}</div>
      <div class="rg-bloco"><h4>Aptos por faixa do score de confiança</h4>${rgScore}</div>
      <div class="rg-bloco"></div>
      <div class="rg-bloco"><h4>Apto valor por faixa do score de confiança</h4>${rgScoreValor}</div>
    </div>
    <div class="rg-nota"><b>Na meta</b> = assertividade de 80% ou mais (a IA no máximo 20% acima ou abaixo do real). <b>Mediana</b> = o caso do meio da fila.</div>
    ${LEGENDA_ACC}
    ${_cab("Direção","a IA erra mais para cima ou para baixo?")}
    <div class="sub" style="margin-bottom:8px;max-width:940px">Aptos com referência lida, pelo total do caso. Em R$, a soma da diferença dos casos de cada lado.</div>
    ${dirTab}
    ${_cab("Score de confiança","a nota dada antes do gabarito prevê o acerto?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">Nota calculada <b>só com o lado LIFT</b>, como em produção. Aqui: os mesmos <b>${apRef.length}</b> aptos com referência lida das tabelas acima.
      <b>Travas</b> (derrubam para baixa sozinhas): verba sem código no glossário, reflexo acima do teto possível (13º &gt; 1/12, férias + 1/3 &gt; 1/9 da base), hora extra duplicada.
      <b>Fatores de risco</b> (+1 cada): gratificação de função, comissões, Súmula 340, competências sem salário (≥ 10%; ≥ 50% conta +2), ficha de registro sem férias em 12+ meses calculados (com hora extra ou intervalo), afastamento integral em 6+ meses.</div>
    <div class="tiles" style="margin-bottom:12px">
      ${_tile(cTot.n?Math.round(100*cAlta.n/cTot.n)+"%":"—","Casos que seguiriam automáticos","só a faixa <b>alta</b>: "+cAlta.n+" de "+cTot.n,true)}
      ${_tile(cAlta.n?cAlta.pct80+"%":"—","Na meta (≥ 80%) dentro da alta","contra <b>"+pctTot+"%</b> em todos os "+cTot.n+" casos",true)}
      ${_tile(cTot.sobre?sobreFora+"%":"—","Do sobrecálculo que fica fora","as outras faixas vão para o calculista: "+brlK(cTot.sobre-cAlta.sobre)+" de "+brlK(cTot.sobre)+" calculados a mais",true)}
    </div>
    <div class="panel" style="margin-top:0">${_anConf(confGr)}${LEGENDA_ACC}</div>
    ${_cab("Não aptos","por que o caso não segue pelo automático?")}
    <div class="panel" style="margin-top:0">${naoAptos}</div>`;
}

// ------------------------------------------------- PROBLEMAS DO AGENTE -------
// No lugar de "Onde o erro nasce" e "Acurácia por verba" (cópia, 18/10): o agente já classifica cada

const FAM_VERBA=[
