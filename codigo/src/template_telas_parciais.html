    <div class="sub" style="margin-bottom:10px;max-width:940px">Acurácia de cada verba entre os casos. Traço fino: do pior ao melhor caso · traço grosso: a metade do meio · <b>bolinha: mediana</b> · pontinhos: os casos · tracejado: meta de 80%. Só verbas que a IA calculou e casaram com a referência. Clique numa verba para ver os casos.</div>
    <div style="display:flex;gap:10px;align-items:end;margin:0 0 10px;flex-wrap:wrap">
      ${_selF("Casos",verbaGrupo,GRUPOS_CASO,"verbaGrupo=this.value;telaVerbas()")}
      ${_selF("Natureza",verbaTipo,[["todas","Todas"],...TIPOS_VERBA.map(([k,r])=>[k,r])],"verbaTipo=this.value;telaVerbas()")}
      ${_selF("Reflexos",verbaRefl,REFL_MODOS,"verbaRefl=this.value;telaVerbas()")}
      ${_selF("Mínimo de casos",String(verbaMin),[["1","1"],["3","3"],["5","5"],["10","10"]],"verbaMin=+this.value;telaVerbas()")}
      ${_selF("Ordem",verbaOrd,[["med","Mediana (melhor primeiro)"],["pior","Mediana (pior primeiro)"],["n","Mais casos primeiro"],["mais","R$ a mais primeiro"]],"verbaOrd=this.value;telaVerbas()")}
      <div><div class="sub">Buscar verba (nome ou código)</div><input value="${esc(verbaBusca)}" placeholder="ex.: horas extras, BT089…" onchange="verbaBusca=this.value;telaVerbas()"
        style="padding:8px 10px;border:1px solid var(--linha);border-radius:8px;min-width:220px;background:var(--surface);color:var(--text)"></div>
      <label class="sub" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding-bottom:8px">
        <input type="checkbox" ${verbaSemDM?"checked":""} onchange="verbaSemDM=this.checked;telaVerbas()"> sem dano moral (BT052)</label>
    </div>
    <div class="an-fil" style="margin-bottom:6px"><span class="fl">Categorias</span>${chips}${verbaFams.length?`<button onclick="verbaFams=[];telaVerbas()">limpar</button>`:""}</div>
    ${LEGENDA_ACC}
    ${secoes||'<p class="sub">Nenhuma verba com esse filtro.</p>'}`;
}

// ---------------------------------------------------- VERBA CONSOLIDADA ------
// Pedido da Raíra (29/10): a aba Verbas casa cada verba da IA com UMA linha do PJC (regra de 16/10), mas
// o PJC fatia a mesma verba (período "até/após", adicional × hora cheia da Súmula 85, 50/75/100% da
// convenção) e a fatia que sobra vira "só PJC" — a acurácia cai por pareamento (0010011-13: 0% por verba,
// 99,7% somando). Aqui cada linha do PJC ganha um código e, em cada caso, soma-se tudo o que tem o mesmo
// código dos dois lados. O código continua separado (além da 8ª × 7ª/8ª × além da 6ª × domingos e
// feriados × 384 × intervalo): não junta famílias.
//   · linha de jornada: o código sai do nome (7ª → BT081, 6ª → BT001, 8ª/44ª/semanal → BT089 …);
//   · hora extra sem tipo no nome ("HORAS EXTRAS 50%"): fica com a hora extra comum que a IA deferiu no
//     caso, se ela deferiu uma só ("atribuída"); se deferiu 7ª/8ª e além da 8ª, vira "sem tipo no PJC";
//   · outras verbas: a linha casada fica com o código da verba da IA; a só PJC, com o código do de-para.
// Reflexo: tipo de reflexo × código da verba-base, pelas mesmas regras.
const _nrm=s=>String(s||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const _HE_RX=/hora.*extra|extra.*hora|\bh\.? ?e\.?\b|sobrejornada/;
const _HE_COMUNS=["BT001","BT081","BT089"];
const CONSOL_NOMES={BT089:"Horas extras além da 8ª",BT081:"Horas extras 7ª e 8ª",BT001:"Horas extras além da 6ª",
  BT011:"Domingos e feriados",BT003:"Intervalo do art. 384",BT004:"Intervalo interjornada",BT007:"Intervalo intrajornada",
  BT087:"Horas in itinere",BT002:"Sobreaviso",HE_AMB:"Horas extras somadas (PJC sem tipo, IA com mais de um tipo)"};
// código de jornada pelo nome; "HE" = hora extra sem tipo; null = não é verba de jornada
function _codJornada(nome){
  const n=_nrm(nome);
  if(/interjornada|entrejornada/.test(n))return "BT004";
  if(/\b384\b/.test(n))return "BT003";
  if(/interval|intrajornada/.test(n))return "BT007";
  if(/itinere/.test(n))return "BT087";
  if(/sobreaviso/.test(n))return "BT002";
  if(!_HE_RX.test(n))return null;
  if(/doming|feriad|repouso trabalhad|em dobro/.test(n))return "BT011";
  const s7=/\b7a\b|setima/.test(n), s6=/\b6a\b|sexta hora/.test(n), s8=/\b8a\b|oitava|\b4[04] ?(a|h)\b|semanal|\b33 ?h|\b36 ?h/.test(n);
  if(s7)return "BT081";
  if(s6&&!s8)return "BT001";
  if(s8&&!s6)return "BT089";
  return "HE";
}
const _semFatia=s=>_nrm(s).replace(/\(\+\d+ (fatia|linha).*$/,"").replace(/\s+[-–]\s+.*$/,"").trim();
const _tipoRefl=p=>{const n=_nrm(p);return /^(13|decimo)/.test(n)?"13º Salário":/ferias/.test(n)?"Férias + 1/3"
  :/aviso/.test(n)?"Aviso Prévio":/fgts/.test(n)?"FGTS":/repouso|\bdsr\b|\brsr\b/.test(n)?"DSR":"Outros reflexos";};
const _partesRefl=nome=>{const m=/^(.*?) sobre (.*)$/i.exec(nome||"");return m?[m[1],m[2]]:null;};
let consolGrupo="aptos", consolSec="todas", consolMin=3, consolOrd="med", consolBusca="", consolSemDM=true,
    consolEstrito=false, consolRefl="proprio";
function agregaConsol(){
  const cs=casosFiltrados().filter(comPJC).filter(c=>_noGrupo(c,consolGrupo));
  const g={};
  cs.forEach(c=>{
    const vs=c.verbas||[];
    // código de cada verba principal da IA; as horas extras comuns que a IA deferiu decidem a linha sem tipo
    const codIA=v=>{const k=_codVerba(v)||v.codigo; if(k)return k; const j=_codJornada(v.nome_ia); return j&&j!=="HE"?j:null;};
    const heIA=new Set(vs.filter(v=>!v.is_reflexo&&v.nome_ia&&v.total_ia).map(codIA).filter(k=>_HE_COMUNS.includes(k)));
    // com um tipo só de hora extra comum na IA, a linha sem tipo é dele (não é dúvida); sem nenhum, vai
    // para a além da 8ª e fica marcada; com mais de um, a hora extra comum do caso inteiro vira HE_AMB
    const resolveHE=k=>k!=="HE"?{k,atrib:false}:(heIA.size===1?{k:[...heIA][0],atrib:false}:heIA.size===0?{k:"BT089",atrib:true}:{k:"HE_AMB",atrib:true});
    const baseIA={}; vs.forEach(v=>{if(!v.is_reflexo&&v.nome_ia)baseIA[v.nome_ia]=v;});
    const chaveBase=(nomeBase,vb)=>{
      if(vb){const k=codIA(vb);if(k)return {k,atrib:false};}
      const j=_codJornada(nomeBase); if(j)return resolveHE(j);
      return {k:"nome:"+_semFatia(nomeBase),atrib:false};};
    const acc={};
    const add=(sec,refl,cod,lado,val,nome,atrib)=>{
      if(!val)return;
      const key=sec+"|"+(refl||"")+"|"+cod;
      const e=acc[key]||(acc[key]={sec,refl,cod,ia:0,pjc:0,lIA:[],lPJ:[],atrib:false,nomes:{}});
      e[lado==="ia"?"ia":"pjc"]+=val; (lado==="ia"?e.lIA:e.lPJ).push(nome); if(atrib)e.atrib=true;
      if(lado==="ia")e.nomes[nome]=(e.nomes[nome]||0)+1;};
    vs.forEach(v=>{
      if(v.is_reflexo){
        const pi=_partesRefl(v.nome_ia), pp=_partesRefl(v.nome_pjc);
        if(pi&&v.total_ia){const b=chaveBase(pi[1],baseIA[pi[1]]);add("reflexo",_tipoRefl(pi[0]),b.k,"ia",v.total_ia,v.nome_ia,b.atrib);}
        if(pp&&v.total_pjc){
          // linha casada de verba-base que não é de jornada: segue a base da IA; senão, regras do nome
          const vb=pi&&!_codJornada(pp[1])?baseIA[pi[1]]:null;
          const b=chaveBase(pp[1],vb);add("reflexo",_tipoRefl(pp[0]),b.k,"pjc",v.total_pjc,v.nome_pjc,b.atrib);}
        return;}
      if(v.nome_ia&&v.total_ia){const k=codIA(v)||"nome:"+_semFatia(v.nome_ia);
        const r=k==="nome:"+_semFatia(v.nome_ia)&&_codJornada(v.nome_ia)==="HE"?resolveHE("HE"):{k,atrib:false};
        add("principal",null,r.k,"ia",v.total_ia,v.nome_ia,r.atrib);}
      if(v.nome_pjc&&v.total_pjc){
        const j=_codJornada(v.nome_pjc);
        let r;
        if(j)r=resolveHE(j);
        else if(v.status==="coincide"&&v.nome_ia)r={k:codIA(v)||"nome:"+_semFatia(v.nome_ia),atrib:false};
        else r={k:v.codigo_depara||"nome:"+_semFatia(v.nome_pjc),atrib:false};
        add("principal",null,r.k,"pjc",v.total_pjc,v.nome_pjc,r.atrib);}
    });
    // caso ambíguo (PJC sem tipo, IA com mais de um tipo de hora extra comum): junta os dois lados numa
    // linha só, em vez de deixar as linhas do PJC sem par e as da IA "só IA"
    Object.values(acc).filter(e=>e.cod==="HE_AMB").forEach(amb=>{
      Object.keys(acc).forEach(k=>{const e=acc[k];
        if(e===amb||e.sec!==amb.sec||e.refl!==amb.refl||!_HE_COMUNS.includes(e.cod))return;
        amb.ia+=e.ia;amb.pjc+=e.pjc;amb.lIA.push(...e.lIA);amb.lPJ.push(...e.lPJ);
        Object.entries(e.nomes).forEach(([n,q])=>amb.nomes[n]=(amb.nomes[n]||0)+q);delete acc[k];});});
    // base consolidada do caso, para o erro próprio do reflexo
    const baseCons=cod=>acc["principal||"+cod];
    Object.values(acc).forEach(e=>{
      if(consolSemDM&&e.cod==="BT052")return;
      const k=e.sec+"|"+(e.refl||"")+"|"+e.cod;
      const G=g[k]||(g[k]={sec:e.sec,refl:e.refl,codigo:e.cod,labels:{},casos:[],soIA:[],soPJ:[]});
      Object.entries(e.nomes).forEach(([n,q])=>G.labels[n]=(G.labels[n]||0)+q);
      const o={cnj:c.cnj,data:c.data_processamento,c,ia:e.ia,pjc:e.pjc,lIA:e.lIA,lPJ:e.lPJ,atrib:e.atrib};
      if(!e.ia){G.soPJ.push(o);return;} if(!e.pjc){G.soIA.push(o);return;}
      o.acuracia=Math.round(1000*(1-Math.abs(e.ia-e.pjc)/Math.abs(e.pjc)))/10;
      o.proprio=null;
      if(e.sec==="reflexo"){const b=baseCons(e.cod);
        if(b&&b.ia&&b.pjc){const rb=b.ia/b.pjc;o.proprio=Math.round(1000*(1-Math.abs((e.ia/e.pjc)/rb-1)))/10;}}
      o.val=e.sec==="reflexo"&&consolRefl==="proprio"?o.proprio:o.acuracia;
      if(o.val==null||(consolEstrito&&o.atrib))return;
      G.casos.push(o);
    });
  });
  return Object.values(g).filter(e=>e.casos.length).map(e=>{
    const cod=e.codigo, top=Object.entries(e.labels).sort((a,b)=>b[1]-a[1])[0];
    const nome=CONSOL_NOMES[cod]||(top?top[0]:cod.replace(/^nome:/,""));
    let label=/^BT\d+$/.test(cod)?cod+" · "+nome:nome; if(e.refl)label=e.refl+" sobre "+label;
    const s=e.casos.map(o=>o.val).sort((a,b)=>a-b);
    const mais=e.casos.filter(o=>o.ia>o.pjc&&!prox(o.ia,o.pjc)), menos=e.casos.filter(o=>o.ia<o.pjc&&!prox(o.ia,o.pjc));
    return {...e,label,fam:_grupoDe(FAM_VERBA,nome,"Outras verbas"),n:s.length,s,
      med:_quantil(s,.5),p25:_quantil(s,.25),p75:_quantil(s,.75),pct80:Math.round(100*s.filter(x=>x>=80).length/s.length),
      nAtrib:e.casos.filter(o=>o.atrib).length,nSomado:e.casos.filter(o=>o.lPJ.length>1||o.lIA.length>1).length,
      nMais:mais.length,nMenos:menos.length,rsMais:mais.reduce((t,o)=>t+o.ia-o.pjc,0),rsMenos:menos.reduce((t,o)=>t+o.pjc-o.ia,0)};
  });
}
function irConsol(){ _modo("consol"); telaConsol(); }
function telaConsol(){
  const todas=agregaConsol(), q=_semAcento(consolBusca);
  const vis=todas.filter(a=>a.n>=consolMin&&(consolSec==="todas"||a.sec===consolSec)&&(!q||_semAcento(a.label).includes(q)));
  const ORD={med:(a,b)=>b.med-a.med,pior:(a,b)=>a.med-b.med,n:(a,b)=>b.n-a.n,mais:(a,b)=>b.rsMais-a.rsMais};
  const COLS="minmax(220px,1fr) 52px 300px 62px 60px 190px";
  const lista=xs=>esc(xs.join(" + "));
  const linha=(a,cor)=>{
    const rf=a.sec==="reflexo";
    const casos=a.casos.slice().sort((x,y)=>y.val-x.val).map(o=>`<tr onclick="trocaCnj('${o.cnj}')" style="cursor:pointer">
        <td>${o.data||"—"}</td><td style="white-space:nowrap">${o.cnj}</td><td style="text-align:left;font-size:11.5px">${aptidaoCell(o.c)}</td>
        <td style="text-align:right" title="${lista(o.lIA)}">${brl(o.ia)}${o.lIA.length>1?` <span class="sub">(${o.lIA.length})</span>`:""}</td>
        <td style="text-align:right" title="${lista(o.lPJ)}">${brl(o.pjc)}${o.lPJ.length>1?` <span class="sub">(${o.lPJ.length})</span>`:""}</td>
        <td style="text-align:right;${rf?"":"font-weight:700;"}color:${corAcc(o.acuracia)}">${accTxt(o.acuracia)}</td>
        ${rf?`<td style="text-align:right;font-weight:700;color:${corAcc(o.proprio)}" title="erro próprio: proporção reflexo ÷ base consolidada na IA contra a do PJC">${accTxt(o.proprio)}</td>`:""}
        <td style="text-align:center">${prox(o.ia,o.pjc)?'<span class="sub">≈</span>':(o.ia>o.pjc?"▲":"▼")}</td>
        <td style="font-size:11px;max-width:420px" class="sub">${o.atrib?'<b title="hora extra sem tipo no PJC num caso em que a IA não deferiu hora extra comum ou deferiu mais de um tipo">atribuída</b> · ':""}PJC: ${lista(o.lPJ)}</td></tr>`).join("");
    const so=(a.soIA.length||a.soPJ.length)?`<div class="sub" style="font-size:11.5px;margin:4px 0">Só de um lado (fora da mediana): só IA em ${a.soIA.length} caso(s)${a.soIA.length?" — "+a.soIA.slice(0,8).map(o=>`<a href="#" onclick="trocaCnj('${o.cnj}');return false">${o.cnj}</a>`).join(", "):""}; só PJC em ${a.soPJ.length}${a.soPJ.length?" — "+a.soPJ.slice(0,8).map(o=>`<a href="#" onclick="trocaCnj('${o.cnj}');return false">${o.cnj}</a>`).join(", "):""}.</div>`:"";
    return `<details style="border-bottom:1px solid var(--linha);padding:3px 0">
      <summary style="cursor:pointer;list-style:none;display:grid;grid-template-columns:${COLS};gap:12px;align-items:center">
        <span style="font-size:12.5px">${esc(a.label)}${a.nSomado?` <span class="sub" style="font-size:11px" title="casos com mais de uma linha somada num dos lados">· ${a.nSomado} somado${a.nSomado>1?"s":""}</span>`:""}${a.nAtrib?` <span class="sub" style="font-size:11px" title="casos com linha do PJC atribuída pela hora extra da IA">· ${a.nAtrib} atrib.</span>`:""}</span>
        <span class="sub" style="text-align:right;font-size:11.5px">${a.n} caso${a.n>1?"s":""}</span>
        ${_faixaSVG(a,cor)}
        <b style="text-align:right;color:${corAcc(a.med)}">${accTxt(a.med)}</b>
        <span class="sub" style="text-align:right;font-size:11.5px" title="casos com acurácia ≥ 80%">${a.pct80}% ≥80</span>
        <span style="text-align:right;font-size:11.5px;white-space:nowrap">▲ ${a.nMais}${a.rsMais?` <span class="sub">${brlK(a.rsMais)}</span>`:""} · ▼ ${a.nMenos}${a.rsMenos?` <span class="sub">${brlK(a.rsMenos)}</span>`:""}</span>
      </summary>${so}
      <div style="margin:6px 0 10px;overflow-x:auto"><table style="font-size:12px"><thead><tr><th>Data</th><th>CNJ</th><th>Aptidão</th><th style="text-align:right">IA · somado</th><th style="text-align:right">Referência · somado</th><th style="text-align:right">${rf?"Como está":"Acurácia"}</th>${rf?'<th style="text-align:right">Próprio</th>':""}<th></th><th style="text-align:left">Linhas do PJC somadas</th></tr></thead><tbody>${casos}</tbody></table></div>
    </details>`;};
  const SECS=[["principal","Principais e rescisórias","var(--salmao)"],["reflexo","Reflexos (13º, férias, aviso, DSR)","#C98A00"]];
  const secoes=SECS.filter(([t])=>consolSec==="todas"||consolSec===t).map(([t,titulo,cor])=>{
    const vs=vis.filter(a=>a.sec===t).sort(ORD[consolOrd]); if(!vs.length)return "";
    const pool=vs.reduce((s,a)=>s.concat(a.s),[]).sort((a,b)=>a-b);
    return `<div style="margin:20px 0 6px;padding:8px 12px;border-left:4px solid ${cor};background:var(--salmao-claro);border-radius:0 9px 9px 0">
        <b style="font-family:Sora">${titulo}</b> <span class="sub" style="font-size:12px">· ${vs.length} verbas · ${pool.length} comparações · mediana <b style="color:${corAcc(_quantil(pool,.5))}">${accTxt(_quantil(pool,.5))}</b></span>
        ${t==="reflexo"?`<div class="sub" style="font-size:11.5px;margin-top:3px">${consolRefl==="proprio"
          ?"<b>Erro próprio do reflexo</b>: proporção do reflexo sobre a verba-base consolidada, na IA contra a do PJC. Fica fora o caso sem a base consolidada dos dois lados."
          :"<b>Como está</b>: o reflexo somado contra o PJC somado, carregando o erro da verba-base."}</div>`:""}</div>
      <div style="display:grid;grid-template-columns:${COLS};gap:12px;font-size:10px;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em;padding:2px 0">
        <span>Verba (código)</span><span style="text-align:right">Casos</span>${_eixoSVG()}<span style="text-align:right">Mediana</span><span style="text-align:right">Na meta</span><span style="text-align:right">Direção</span></div>
      ${vs.map(a=>linha(a,cor)).join("")}`;}).join("");
  document.getElementById("main").innerHTML=`<h2>Verba consolidada</h2>
    ${barraPeriodo()}
    <div class="sub" style="margin-bottom:10px;max-width:940px">Mesma régua da aba Verbas, mas sem depender de qual linha do PJC casou com qual verba da IA. Em cada caso, cada linha do PJC ganha o código da verba e <b>soma-se tudo o que tem o mesmo código dos dois lados</b> — as fatias de período, o adicional separado da hora cheia e os percentuais da convenção entram juntos. Os códigos continuam separados: além da 8ª, 7ª e 8ª, além da 6ª, domingos e feriados, art. 384 e intervalo não se misturam. Hora extra sem tipo no nome do PJC fica com a hora extra comum que a IA deferiu no caso; quando a IA não deferiu nenhuma, vai para a além da 8ª, e quando deferiu mais de um tipo, as horas extras comuns do caso são somadas numa linha só — nos dois casos a comparação fica marcada como <b>atribuída</b>. Verba só de um lado fica fora da mediana e aparece contada ao abrir a linha.</div>
    <div style="display:flex;gap:10px;align-items:end;margin:0 0 10px;flex-wrap:wrap">
      ${_selF("Casos",consolGrupo,GRUPOS_CASO,"consolGrupo=this.value;telaConsol()")}
      ${_selF("Natureza",consolSec,[["todas","Todas"],["principal","Principais e rescisórias"],["reflexo","Reflexos"]],"consolSec=this.value;telaConsol()")}
      ${_selF("Reflexos",consolRefl,REFL_MODOS,"consolRefl=this.value;telaConsol()")}
      ${_selF("Mínimo de casos",String(consolMin),[["1","1"],["3","3"],["5","5"],["10","10"]],"consolMin=+this.value;telaConsol()")}
      ${_selF("Ordem",consolOrd,[["med","Mediana (melhor primeiro)"],["pior","Mediana (pior primeiro)"],["n","Mais casos primeiro"],["mais","R$ a mais primeiro"]],"consolOrd=this.value;telaConsol()")}
      <div><div class="sub">Buscar verba (nome ou código)</div><input value="${esc(consolBusca)}" placeholder="ex.: horas extras, BT089…" onchange="consolBusca=this.value;telaConsol()"
        style="padding:8px 10px;border:1px solid var(--linha);border-radius:8px;min-width:220px;background:var(--surface);color:var(--text)"></div>
      <label class="sub" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding-bottom:8px">
        <input type="checkbox" ${consolSemDM?"checked":""} onchange="consolSemDM=this.checked;telaConsol()"> sem dano moral (BT052)</label>
      <label class="sub" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding-bottom:8px" title="tira da conta as comparações marcadas como atribuídas: hora extra sem tipo no PJC num caso em que a IA não deferiu hora extra comum ou deferiu mais de um tipo">
        <input type="checkbox" ${consolEstrito?"checked":""} onchange="consolEstrito=this.checked;telaConsol()"> só o que o nome do PJC identifica</label>
    </div>
    ${LEGENDA_ACC}
    ${secoes||'<p class="sub">Nenhuma verba com esse filtro.</p>'}`;
}

// --------------------------------------------------- VERBAS NÃO CALCULADAS ----
// Pedido da Raíra (20/10): só os casos que chegaram ao P10 e foram calculados, mas saíram do apto
// porque uma verba não foi calculada (categoria de inaptidão "Verba não calculada", fora do FT travado).
// A verba que trava vem dos motivos de inaptidão do caso ("BT028 — PLR (depende de documento)").
const _ncCodDe=det=>{const m=/^\s*(BT\d+)/.exec(det||"");return m?m[1]:String(det||"").split("—")[0].trim();};
const _ncNomeDe=det=>String(det||"").replace(/^\s*BT\d+\s*—\s*/,"").replace(/\s*\(depende de documento\)\s*$/,"");
const _semTag=s=>String(s||"").replace(/<[^>]+>/g,"");
// por que a IA não calculou esta verba neste caso, pelo registro da própria verba
function _ncPorque(c,cod){
  const v=(c.verbas||[]).find(v=>!v.is_reflexo&&(v.codigo_glossario===cod||(v.p4&&v.p4.codigo_glossario)===cod)&&(v.total_ia==null||v.status==="nao_calc"));
  if(!v)return {tipo:"—",texto:""};
  if(v.status==="nao_calc")return {tipo:"P9a: não calculável",texto:v.motivo_classificacao||""};
  if(v.motivo_nao_calc==="documental")return {tipo:"Depende de documento",texto:_semTag(v.obs_texto)};
  if(v.motivo_nao_calc==="no_pjc")return {tipo:"Deferida, não calculada (o PJC calculou)",texto:(v.p4||{}).contexto||""};
  return {tipo:"Deferida, não calculada",texto:(v.p4||{}).contexto||_semTag(v.obs_texto)};
}
// quanto o PJC calculou nesta verba neste caso (Raíra, 20/10: é a urgência de calcular): soma as linhas
// da verba sem valor da IA — a do PJC que ficou sem par (só PJC) ou a deferida que casou com o PJC
const _ncCods=v=>[v.codigo_glossario,v.p4&&v.p4.codigo_glossario,v.codigo_depara].filter(Boolean);
const _ncPjc=(c,cod)=>(c.verbas||[]).filter(v=>!v.is_reflexo&&!/ sobre /.test(v.nome_ia||"")&&_ncCods(v).includes(cod)
  &&(v.status==="so_pjc"||v.total_ia==null||v.status==="nao_calc")).reduce((s,v)=>s+(v.total_pjc||0),0);
let ncBusca="", ncSoUma=false;
function irNaoCalc(){ _modo("naocalc"); telaNaoCalc(); }
function telaNaoCalc(){
  const cs=casosFiltrados().filter(c=>!c.apto&&c.fora_regua!=="nao_calculado"&&c.categoria_inaptidao==="Verba não calculada");
  const casos=cs.map(c=>{const ms=(c.motivos_inaptidao||[]).filter(m=>m.categoria==="Verba não calculada");
    const cods=[...new Set(ms.map(m=>_ncCodDe(m.detalhe)))];
    const nomes={}; ms.forEach(m=>{nomes[_ncCodDe(m.detalhe)]=_ncNomeDe(m.detalhe);});
    return {c,cods,nomes};});
  const vis=ncSoUma?casos.filter(o=>o.cods.length===1):casos;
  const q=_semAcento(ncBusca);
  const pv={}; vis.forEach(o=>o.cods.forEach(k=>{const e=pv[k]=pv[k]||{cod:k,nome:o.nomes[k],it:[]}; e.it.push(o);}));
  const verbas=Object.values(pv).filter(e=>!q||_semAcento(e.cod+" "+e.nome).includes(q))
    .map(e=>({...e,n:e.it.length,so:e.it.filter(o=>o.cods.length===1).length,
      pjc:e.it.reduce((s,o)=>s+_ncPjc(o.c,e.cod),0),comPjc:e.it.filter(o=>_ncPjc(o.c,e.cod)>0).length}))
    .sort((a,b)=>b.pjc-a.pjc||b.n-a.n);   // urgência: o que o PJC calculou nessa verba primeiro
  // detalhe da verba: uma coluna "só esta verba trava" com x (Raíra, 20/10), sem outras leituras
  // assertividade sem a verba: tira do PJC o que ele calculou nas verbas que a IA não calculou (todas as que travam o caso)
  const _assertSem=o=>{const q2=o.c.quadro||{}, falta=o.cods.reduce((s,k)=>s+_ncPjc(o.c,k),0), pj=(q2.total_pjc||0)-falta;
    return (!falta||q2.total_ia==null||pj<=0)?null:Math.round(1000*(1-Math.abs(q2.total_ia-pj)/pj))/10;};
  const linhaCaso=(o,cod)=>{const q2=o.c.quadro||{}, p=_ncPorque(o.c,cod), a=q2.assertividade, vp=_ncPjc(o.c,cod), as=_assertSem(o);
    return `<tr style="cursor:pointer" onclick="trocaCnj('${o.c.cnj}')">
      <td style="white-space:nowrap;text-align:left">${o.c.cnj}</td>
      <td style="text-align:center;font-weight:700">${o.cods.length===1?"x":""}</td>
      <td style="text-align:right;font-weight:700">${vp?brl(vp):'<span class="sub">—</span>'}</td>
      <td style="text-align:right">${brl(q2.total_ia)}</td><td style="text-align:right">${brl(q2.total_pjc)}</td>
      <td style="text-align:right;font-weight:700;color:${corAcc(a)}">${accTxt(a)}</td>
      <td style="text-align:right;font-weight:700;color:${corAcc(as)}" title="PJC sem ${o.cods.length>1?"as verbas que travam o caso ("+o.cods.join(", ")+")":"esta verba"}">${accTxt(as)}</td>
      <td style="text-align:left"><b style="font-size:11px">${esc(p.tipo)}</b><div style="font-size:11px">${esc(String(p.texto).slice(0,300))}</div></td></tr>`;};
  const COLS="minmax(260px,1fr) 90px 120px 130px";
  const linhaVerba=e=>`<details style="border-bottom:1px solid var(--linha);padding:5px 0">
    <summary style="cursor:pointer;list-style:none;display:grid;grid-template-columns:${COLS};gap:12px;align-items:center">
      <span style="font-size:12.5px"><b>${esc(e.cod)}</b> · ${esc(e.nome||"")}</span>
      <span style="text-align:right;font-weight:700">${e.n}</span>
      <span style="text-align:right" title="casos em que esta é a única verba que trava: calculada, o caso volta a ser apto">${e.so}</span>
      <span style="text-align:right" title="soma do que o PJC calculou nesta verba, nos ${e.comPjc} casos em que ele calculou"><b>${e.pjc?brlK(e.pjc):"—"}</b> <span class="sub" style="font-size:11px">${e.comPjc} de ${e.n}</span></span></summary>
    <div style="margin:6px 0 10px;overflow-x:auto"><table style="font-size:12px;width:100%;table-layout:fixed">
      <colgroup><col style="width:190px"><col style="width:80px"><col style="width:115px"><col style="width:115px"><col style="width:115px"><col style="width:70px"><col style="width:80px"><col></colgroup>
      <thead><tr><th style="text-align:left">CNJ</th><th style="text-align:center">Só esta verba trava</th><th style="text-align:right">PJC · esta verba</th><th style="text-align:right">IA · caso</th><th style="text-align:right">PJC · caso</th>
        <th style="text-align:right">Assert.</th><th style="text-align:right" title="tirando do PJC o que ele calculou nas verbas que a IA não calculou">Assert. sem a verba</th><th style="text-align:left">Por que a IA não calculou</th></tr></thead>
      <tbody>${e.it.slice().sort((a,b)=>_ncPjc(b.c,e.cod)-_ncPjc(a.c,e.cod)).map(o=>linhaCaso(o,e.cod)).join("")}</tbody></table></div></details>`;  const so1=casos.filter(o=>o.cods.length===1).length;
  document.getElementById("main").innerHTML=`<h2>Verbas não calculadas</h2>
    ${barraPeriodo()}
    <div class="sub" style="margin-bottom:12px;max-width:940px">Casos que <b>chegaram ao P10 e foram calculados</b>, mas saíram do apto porque <b>uma verba não foi calculada</b>. Abaixo, as verbas que travam esses casos. Clique numa verba para ver os casos e o motivo.</div>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
      ${_tile(String(casos.length),"Casos fora do apto por verba não calculada","chegaram ao P10 e têm cálculo",true)}
      ${_tile(String(so1),"Presos por uma verba só","calculada essa verba, o caso volta a ser apto")}
      ${_tile(brlK(casos.reduce((s,o)=>s+o.cods.reduce((t,k)=>t+_ncPjc(o.c,k),0),0)),"O que o PJC calculou nessas verbas","é o que falta no cálculo da IA")}
    </div>
    <div style="display:flex;gap:14px;align-items:end;margin:0 0 12px;flex-wrap:wrap">
      <div><div class="sub">Buscar verba (nome ou código)</div><input value="${esc(ncBusca)}" placeholder="ex.: PLR, BT011…" onchange="ncBusca=this.value;telaNaoCalc()"
        style="padding:8px 10px;border:1px solid var(--linha);border-radius:8px;min-width:220px;background:var(--surface);color:var(--text)"></div>
      <label class="sub" style="display:flex;align-items:center;gap:6px;cursor:pointer;padding-bottom:8px">
        <input type="checkbox" ${ncSoUma?"checked":""} onchange="ncSoUma=this.checked;telaNaoCalc()"> só casos presos por uma verba</label>
    </div>
    <div style="display:grid;grid-template-columns:${COLS};gap:12px;font-size:10px;color:var(--cinza);text-transform:uppercase;letter-spacing:.05em;padding:2px 0;border-bottom:1px solid var(--linha)">
      <span>Verba que trava</span><span style="text-align:right">Casos</span><span style="text-align:right" title="só ela trava o caso">Só ela</span><span style="text-align:right" title="soma do que o PJC calculou nesta verba · em quantos casos ele calculou">PJC da verba</span></div>
    ${verbas.map(linhaVerba).join("")||'<p class="sub">Nenhum caso com esse filtro.</p>'}`;
}

// ---- JORNADA: cartão de ponto × pré-fixada ---------------------------------
// Duas perguntas distintas, e a divergência entre elas é o achado:
//   tipo de decisão = o que a sentença manda (apurar pelos cartões × jornada
//                     arbitrada na própria decisão);
//   fonte de apuração = o que o cálculo REALMENTE usou (batidas na memória do P9b).
// Com cartão deferido, "2h extras por dia" é TETO a apurar dia a dia; com jornada
// arbitrada, é regra fixa. Confundir os dois é o eixo sistêmico de hora extra.
const JORN={
  cartao:["Cartão de ponto","var(--azul)","a apuração vem das batidas reais, dia a dia"],
  fixa:["Jornada pré-fixada","var(--cinza)","a jornada foi arbitrada na decisão; não há apuração por cartão"],
  mista:["Cartão + jornada fixada","#C98A00","períodos com cartão e períodos com jornada arbitrada"],
};
// ---- SCORE DE CONFIANÇA (src/confianca.py) --------------------------------
// Lê só o lado LIFT, então existe também nos casos sem referência: é a nota que
// o cálculo levaria em produção. Não é acurácia, por isso não usa a escala de
// cor: o selo é neutro e só a faixa baixa ganha o âmbar de alerta.
const CONF_FAIXAS=[
  ["alta","Alta","●●●","nenhum fator de risco nem trava"],
  ["media","Média","●●○","um fator de risco"],
  ["baixa","Baixa","●○○","uma trava, ou dois ou mais fatores de risco"],
  ["restrita","Restrita","○○○","restrição do manual (Premissas de Cálculo): vai para o calculista"],
];
const _confRot=f=>(CONF_FAIXAS.find(x=>x[0]===f)||[])[1]||"—";
function chipConfianca(c){
  const s=c&&c.confianca; if(!s)return '<span class="sub" title="o LIFT não calculou nenhuma verba neste caso">—</span>';
  const [k,rot,pts,desc]=CONF_FAIXAS.find(x=>x[0]===s.faixa);
  const cor=k==="baixa"?"var(--acc-perto)":"var(--text)";
  const tit=(s.componentes.length?s.componentes.map(x=>`${x.tipo==="trava"?"TRAVA":"risco +"+x.pontos}: ${x.rotulo} (${x.detalhe})`).join("\n"):"nenhum componente acionado")+`\n— ${desc}`;
  return `<span style="font-size:10.5px;font-family:Sora;color:${cor};border:1px solid ${k==="baixa"?cor:"var(--linha)"};border-radius:5px;padding:1px 6px;white-space:nowrap" title="${esc(tit)}"><span style="letter-spacing:-1px">${pts}</span> ${rot}</span>`;
}
function blocoConfianca(c){
  const s=c.confianca; if(!s)return "";
  const itens=s.componentes.map(x=>`<li><b>${x.tipo==="trava"?"Trava":"Risco (+"+x.pontos+")"}</b> · ${esc(x.rotulo)} <span class="sub">— ${esc(x.detalhe)}</span></li>`).join("");
  return `<div class="panel" style="margin:0 0 14px;max-width:940px"><h3 style="display:flex;gap:10px;align-items:center">Confiança do cálculo ${chipConfianca(c)}</h3>
    <div class="ph">Nota calculada <b>só com o lado LIFT</b>, sem olhar a referência — é a que o caso levaria em produção. ${(CONF_FAIXAS.find(x=>x[0]===s.faixa)||[])[3]?"Faixa "+_confRot(s.faixa).toLowerCase()+": "+CONF_FAIXAS.find(x=>x[0]===s.faixa)[3]+".":""}</div>
    ${itens?`<ul style="margin:6px 0 0 18px;padding:0">${itens}</ul>`:'<div class="sub">Nenhum componente acionado.</div>'}</div>`;
}
// ---- DIAGNÓSTICO DO AGENTE (análise caso a caso) ----------------------------
// Vem de agente/agente_por_caso.json (ft_arvore_divergencias/ferramentas/agente_para_painel.py).
// Cada problema tem a CATEGORIA (de quem é a diferença) e a SITUAÇÃO frente aos ajustes: um ajuste que
// rodou depois da execução analisada deve corrigir o problema; decidido = ainda não implementado.
const AG_CAT={erro_ia:["Erro da IA","#b5484f"],premissa:["Premissa não endereçada","#a8741a"],gabarito:["Gabarito questionável","#7a6fb0"],
  regra:["Decisão de negócio","#2a6b44"],documento:["Documento fora do alcance","#5b8bb0"],medicao:["Diferença de medição","#8a8284"],investigar:["Em investigação","#a59c9d"]};
const AG_SIT={corrigido_depois:["Ajuste entrou em homologação depois desta análise","var(--ok)"],decidido:["Decidido, ainda não implementado","var(--acc-perto)"],aberto:["Em aberto","var(--cinza)"]};
const _agTag=(k,peq)=>{const [r,cor]=AG_CAT[k]||[k,"var(--cinza)"];return `<span style="display:inline-block;font-size:${peq?10:11}px;font-weight:600;white-space:nowrap;border:1px solid ${cor};color:${cor};border-radius:999px;padding:0 7px">${r}</span>`;};
function _agSitTag(p){const [r,cor]=AG_SIT[p.sit]||AG_SIT.aberto;
  const tit=[p.tema?"Tema: "+p.tema:"",p.onde?"Onde: "+p.onde:"",p.quando?"Entrou em homologação em "+p.quando.split("-").reverse().join("/"):"",p.nota||""].filter(Boolean).join("\n");
  return `<span title="${esc(tit)}" style="font-size:10.5px;font-weight:600;color:${cor};white-space:nowrap">${p.sit==="aberto"&&!p.tema?"Em aberto":r}</span>${p.onde&&p.sit==="corrigido_depois"?`<div class="sub" style="font-size:10.5px">${esc(p.onde)}</div>`:""}`;}
function _agResumo(a){const g={};(a.problemas||[]).forEach(p=>{const x=g[p.cat]=g[p.cat]||{n:0,mais:0,menos:0};x.n++;x[p.mais?"mais":"menos"]+=p.rs;});return g;}
function blocoAgente(c){
  const a=c.agente; if(!a)return "";
  const g=_agResumo(a), ps=a.problemas||[];
  const nCorr=ps.filter(p=>p.sit==="corrigido_depois").length;
  const linhasRes=Object.keys(AG_CAT).filter(k=>g[k]).map(k=>`<tr><td style="text-align:left">${_agTag(k)}</td><td style="text-align:right">${g[k].n}</td><td style="text-align:right">${brl(g[k].mais)}</td><td style="text-align:right">${brl(g[k].menos)}</td></tr>`).join("");
  // problemas agrupados por tipo (na ordem de AG_CAT), do maior para o menor valor; cada um com rótulos fixos

  const _prob=p=>{
    const corpo=p.cat==="gabarito"
      ?`<div class="ag-gab"><div class="ag-gab-t">O que é questionável no gabarito</div>${_lin("Calculista",p.calculista)}${_lin("IA",p.ia)}${_lin("Por quê",p.porque||p.regra)}</div>`
      :`${_lin("O que aconteceu",p.oque)}${_lin("Por quê",p.porque)}${p.porque?"":_lin("Regra citada",p.regra)}`;
    return `<tr><td class="ag-p"><b>${esc(p.titulo||p.verba||"")}</b>${corpo}</td>
      <td class="ag-v">${p.mais?"▲ a mais":"▼ a menos"}<br><b>${brl(p.rs)}</b></td>
      <td class="ag-s">${_agSitTag(p)}</td></tr>`;};
  const linhas=Object.keys(AG_CAT).filter(k=>ps.some(p=>p.cat===k)).map(k=>{
    const gp=ps.filter(p=>p.cat===k).sort((a,b)=>b.rs-a.rs);
    return `<tr class="ag-grupo"><td colspan="3">${_agTag(k)} <span class="sub">${gp.length} problema(s) · a mais ${brl(g[k].mais)} · a menos ${brl(g[k].menos)}</span></td></tr>`+gp.map(_prob).join("");}).join("");
  const _dA=(a.data_processamento||"?").split("-").reverse().join("/"), _dC=(c.data_processamento||"?").split("-").reverse().join("/");
  const aviso=a.mesma_execucao?"":`<div class="warn" style="margin:6px 0 8px"><b>Análise de uma execução anterior.</b> ${_dA===_dC
    ?`O agente analisou uma execução de ${_dA}${a.total_ia!=null?` (IA ${brl(a.total_ia)})`:""}, e o processo rodou de novo no mesmo dia.`
    :`O agente analisou a execução de ${_dA}; o caso foi recalculado em ${_dC}.`} O diagnóstico abaixo não vale para os valores da tela.</div>`;
  return `<div class="panel" style="margin:0 0 14px;max-width:1100px"><h3 style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">Diagnóstico do agente <span class="sub" style="font-weight:400">${esc(a.rodada||"")}</span></h3>
    ${aviso}${a.resumo?`<div class="ph" style="max-width:940px">${esc(a.resumo)}</div>`:""}
    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin:8px 0 10px">
      <table style="font-size:12px;width:auto"><thead><tr><th style="text-align:left">Tipo</th><th style="text-align:right">Problemas</th><th style="text-align:right">A mais</th><th style="text-align:right">A menos</th></tr></thead><tbody>${linhasRes}</tbody></table>
      ${nCorr?`<div class="sub" style="max-width:300px;margin-top:4px"><b style="color:var(--ok)">${nCorr} problema(s)</b> com ajuste que entrou em homologação depois desta análise: devem sair quando o ajuste chegar a produção.</div>`:""}</div>
    <details${ps.length<=8?" open":""}><summary style="cursor:pointer;font-weight:600;margin:4px 0">Problemas (${ps.length})</summary>
      <div style="overflow-x:auto"><table style="font-size:12px;margin-top:6px"><thead><tr><th style="text-align:left">Problema</th><th style="text-align:right">Efeito</th><th style="text-align:left">Situação</th></tr></thead><tbody>${linhas}</tbody></table></div></details></div>`;
}
function chipAgente(c){
  const a=c&&c.agente; if(!a)return '<span class="sub">—</span>';
  const g=_agResumo(a);
  const t=Object.keys(AG_CAT).filter(k=>g[k]).map(k=>`${AG_CAT[k][0]}: ${g[k].n} (a mais ${brl(g[k].mais)}, a menos ${brl(g[k].menos)})`).join("\n");
  const ia=(g.erro_ia||{}).n||0, pr=(g.premissa||{}).n||0, gb=(g.gabarito||{}).n||0;

let listaAgente="";
const _agSel=c=>!listaAgente||(listaAgente==="com"?!!c.agente:listaAgente==="sem"?!c.agente:!!(c.agente&&(c.agente.problemas||[]).some(p=>p.cat===listaAgente)));
// Composição do acerto por faixa de confiança: cada barra é 100% dos casos da
// faixa, fatiada nas quatro faixas de acurácia do painel (mesmas cores, então a
// cor continua significando acurácia). Responde a pergunta de decisão — "se só a
// alta seguir automática, quanto dela bate?" — melhor que uma média, que não tem
// piso e é decidida por um único caso de −19.900%. À direita, o dinheiro errado
// em cada faixa, sobrecálculo primeiro.
const brlK=v=>v==null?"—":"R$ "+(Math.abs(v)>=1e6?(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2})+" mi":Math.abs(v)>=1e3?Math.round(v/1e3).toLocaleString("pt-BR")+" mil":Math.round(v).toLocaleString("pt-BR"));
function _anConf(gr){
  if(!gr.some(g=>g.n))return '<div class="sub">Sem casos no recorte.</div>';
  const W=720,rowH=52,pt=26,pb=8,pl=64,pr=230,H=pt+pb+rowH*gr.length, bw=W-pl-pr;
  const ROT=["≥ 95% · bate","80–95% · na meta","50–80% · abaixo da meta","< 50% · não bate"];
  let g=`<text x="${pl}" y="12" font-size="10" fill="var(--cinza)">% dos casos da faixa em cada nível de ② assertividade</text>
    <text x="${W-pr+16}" y="12" font-size="10" fill="var(--cinza)">R$ calculados a mais · a menos</text>`;
  gr.forEach((e,i)=>{const yc=pt+i*rowH+rowH/2, bh=22, y=yc-bh/2;
    g+=`<text x="${pl-10}" y="${yc-2}" text-anchor="end" font-size="12.5" font-weight="700" font-family="Sora" fill="var(--text)">${e.rot}</text>
      <text x="${pl-10}" y="${yc+12}" text-anchor="end" font-size="10.5" fill="var(--cinza)">${e.n} casos</text>`;
    if(!e.n){g+=`<text x="${pl}" y="${yc+4}" font-size="11" fill="var(--cinza)">sem casos</text>`;return;}
    let x=pl;
    e.fx.forEach((k,j)=>{if(!k)return; const w=bw*k/e.n, p=Math.round(100*k/e.n);
      // 2px de respiro entre fatias

function telaJornada(){

  const _perTxt=p=>{const s=String(p||"").trim();if(!s)return "—";

  // padrão de horário e lógica de composição chegam como objeto: escrever legível

    </div>`;}).join("");
  // A global também pode trazer o ponteiro no lugar do valor ("periodo_global"
  // apontando para ela mesma). Quando a decisão não delimita, o período que vale

  const _lin=k=>((c.cadastro||{}).linhas||[]).find(l=>l.chave===k);
  const _periodoImprescrito=()=>{

    if(a&&b)return `de ${esc(a)} a ${esc(b)}`;
    if(a)return `a partir de ${esc(a)}`;
    const dp=(c.cadastro||{}).data_prescricao;
    return dp?`a partir de ${esc(dp)}`:null;
  };
  const _perGlobal=x=>{
    const p=String(x.periodo||"").trim();
    if(!p)return null;
    if(p!=="periodo_global")return _perTxt(p);
    const imp=_periodoImprescrito();
    return imp
      ? `${imp} <span class="sub">(período imprescrito — a decisão não delimitou)</span>`
      : `<span style="color:var(--acc-perto)">período não especificado, e o P1 não trouxe o imprescrito</span>`;
  };
  const p4g=(j.p4_global||[]).map(x=>`<div style="margin-bottom:8px">
      <div class="sub">${[x.fonte&&("fonte: "+esc(x.fonte)),_perGlobal(x),x.divisor!=null&&("divisor "+x.divisor)].filter(Boolean).join(" · ")}</div>
      <div style="font-size:13.5px;line-height:1.5;margin-top:3px">${esc(x.descricao||"—")}</div></div>`).join("");
  // O P4 usa PONTEIROS: a verba que segue a jornada do caso traz o texto
  // literal "jornada_global", e o período dela, "periodo_global". Imprimir o
  // ponteiro mostra o nome da variável em vez da regra — e era o que acontecia
  // em 1.192 verbas. Aqui a referência é resolvida contra o `p4_global`, e fica
  // dito de onde veio, para não parecer que a verba tem regra própria.

    const r=_resolve(x.texto);

    const per=!_pg?null:(_pg==="periodo_global"?_periodoImprescrito():_perTxt(_pg));
    return `<details style="margin-bottom:6px">
      <summary style="cursor:pointer;font-weight:600">${x.codigo?`<b style="font-family:Sora;color:var(--salmao)">${esc(x.codigo)}</b> · `:""}${esc(x.nome||"verba")}
        ${r.herdado?`<span class="sub" style="font-weight:400"> · ${r.orfao?'<span style="color:var(--acc-perto)">referência não resolvida</span>':"segue a jornada global"}</span>`:""}</summary>

      <pre style="white-space:pre-wrap;word-break:break-word;font-size:11.5px;background:var(--card);border:1px solid var(--linha);border-radius:7px;padding:9px;margin:6px 0 0;max-height:320px;overflow:auto">${esc(r.texto)}</pre></details>`;}).join("");
  const par=j.parametros||{};
  const parRows=Object.entries(par).map(([k,v])=>`<tr><td style="text-align:left">${esc(k.replace(/_/g," "))}</td><td style="text-align:left">${esc(typeof v==="object"?JSON.stringify(v):v)}</td></tr>`).join("");
  document.getElementById("main").innerHTML=`<h2>Jornada e cartão de ponto</h2>
    <div class="sub" style="margin-bottom:14px">${CNJ} · ${c.processo.periodo_calculo||""}</div>

    </div>

    ${regimes||'<p class="sub">O P9a não trouxe definições de jornada neste caso.</p>'}

    ${(p4g||p4e)?`<div class="seccab"><h3>Jornada na decisão (P4)</h3><span class="q">o texto vinculante, sem edição do app</span></div><div class="sechr"></div>
      ${p4g?`<div class="p4">${p4g}</div>`:""}
      ${p4e?`<div style="margin-top:10px"><div class="sub" style="margin-bottom:6px">Jornada específica citada por verba:</div>${p4e}</div>`:""}`:""}`;
}

// ---- LISTA DE CASOS: o mestre do drill-down --------------------------------
// Responde a pergunta de rotina — "rodou um caso esta semana, qual foi e como
// ele saiu?" — numa tabela única, plana, ordenável, com TODAS as categorias
// juntas. A visão agrupada por categoria de aptidão continua na Elegibilidade,
// porque lá a pergunta é outra (quem é apto e por que caiu).
// Padrão (Raíra, 15/10): aptos validáveis, melhor assertividade primeiro e, na primeira abertura, score alta:
// o conjunto candidato a produção, o mesmo da apresentação. Tudo continua mudável nos filtros.
// Cópia, 18/10: quatro filtros (grupo, direção, confiança, agente) mais a busca; a ordem fica no clique
// da coluna. Saíram jornada, verbas c/ par, a coluna Ref., os cards e os textos de explicação.
let listaFiltro="aptos", listaOrdem="assert", listaDir="desc", listaBusca="", listaDirecao="", listaConf="", _listaIni=false;
const _DIR1={data:"desc",lift:"desc",ref:"desc",assert:"asc",dir:"desc",cnj:"asc",apto:"asc",conf:"desc",agente:"desc"};
function listaOrd(k){
  listaDir = (listaOrdem===k) ? (listaDir==="asc"?"desc":"asc") : (_DIR1[k]||"asc");
  listaOrdem = k;
  telaLista();
}
const AG_FILTROS=[["","Todos"],["erro_ia","Com erro da IA"],["gabarito","Com gabarito questionável"],["com","Com análise do agente"],["sem","Sem análise do agente"]];
function _listaSel(c){
  return _noGrupo(c,listaFiltro)
    &&(!listaDirecao||_dirCaso(c)===listaDirecao)
    &&(!listaConf||(c.confianca||{}).faixa===listaConf);
}
// "recente" é ancorado na data mais nova da BASE (não em hoje): o painel é
// gerado de um recorte, e usar o relógio faria tudo parecer velho.
const _maxData=()=>{const ds=D.cnjs.map(c=>D.casos[c]).filter(Boolean).map(c=>c.data_processamento).filter(Boolean).sort();
  return ds.length?ds[ds.length-1]:null;};
// cabeçalho clicável: mostra a seta só na coluna ativa, e o title diz o que o
// clique faz — sem isso a tabela parece ordenável e não avisa como
function _th(k,rot,align,dica){
  const on=listaOrdem===k;
  const seta=on?(listaDir==="asc"?" ▲":" ▼"):"";
  const t=(dica?dica+" · ":"")+(on?"clique para inverter":"clique para ordenar por esta coluna");
  return `<th style="text-align:${align};cursor:pointer;white-space:nowrap;${on?"color:var(--salmao)":""}"
    title="${esc(t)}" onclick="listaOrd('${k}')">${rot}<span style="font-size:10px">${seta}</span></th>`;
}
const _listaCasos=()=>{const q=String(listaBusca||"").replace(/\D/g,"");
  return casosFiltrados().filter(_listaSel).filter(_agSel).filter(c=>!q||c.cnj.replace(/\D/g,"").includes(q));};
// as setas ‹ › do caso andam na lista como ela está filtrada e ordenada (período inclusive);
// caso aberto fora dela (por outra tela) anda na base inteira
let _navCnjs=null;
const _navLista=()=>(_navCnjs&&_navCnjs.includes(CNJ))?_navCnjs:D.cnjs;
// diferença relativa do total (IA − referência) ÷ referência
const _difRel=c=>{const q=c.quadro||{};return (q.total_ia!=null&&q.total_pjc)?(q.total_ia-q.total_pjc)/q.total_pjc:null;};
function telaLista(){
  // padrão da primeira abertura (Raíra, 15/10): aptos, melhor assertividade primeiro, score alta
  if(!_listaIni){_listaIni=true; listaConf="alta";}
  const anchor=_maxData(), corte=anchor?_anShift(anchor,7):null;
  const cs=_listaCasos();
  const _a=c=>(c.quadro&&c.quadro.assertividade!=null)?c.quadro.assertividade:null;
  // valor nulo vai sempre para o FIM, nas duas direções: caso sem referência não é "o pior", é "sem medida"
  const _txt=v=>String(v==null?"":v);
  const CHAVES={
    data:  c=>c.data_processamento||null,
    cnj:   c=>c.cnj,
    apto:  c=>c.apto?(aptoValor(c)?"0 apto valor":"1 apto"):"2 "+(c.categoria_inaptidao||"inapto"),
    // pior primeiro na direção inicial: baixa=2, média=1, alta=0
    conf:  c=>c.confianca?CONF_FAIXAS.findIndex(x=>x[0]===c.confianca.faixa):null,
    agente:c=>c.agente?(c.agente.problemas||[]).filter(p=>p.cat==="erro_ia").reduce((s,p)=>s+p.rs,0):null,
    assert:c=>_a(c),
    dir:   c=>_difRel(c),
    lift:  c=>(c.quadro||{}).total_ia,
    ref:   c=>(c.quadro||{}).total_pjc,
  };
  const f=CHAVES[listaOrdem]||CHAVES.data;
  const ord=cs.slice().sort((x,y)=>{const a=f(x), b=f(y);
    if(a==null&&b==null)return 0; if(a==null)return 1; if(b==null)return -1;
    const d=(typeof a==="number"&&typeof b==="number")?a-b:_txt(a).localeCompare(_txt(b),"pt-BR");
    return listaDir==="asc"?d:-d;});
  _navCnjs=ord.map(c=>c.cnj);
  // verba com total negativo (IA ou PJC): o painel não zera, só avisa que a assertividade não é confiável
  const negFlag=c=>{const n=c.verbas_negativas||[];if(!n.length)return"";
    const t=n.map(x=>`${x.lado}: ${x.verba} ${brl(x.total)}`).join("\n");
    return ` <span style="color:var(--acc-perto);cursor:help" title="Assertividade não confiável: ${n.length} verba(s) com total negativo\n${esc(t)}">⚠ neg.</span>`;};
  const dirCell=c=>{const r=_difRel(c); if(r==null)return '<span class="sub">—</span>';
    const p=Math.round(100*Math.abs(r)); return Math.abs(r)<=0.05?`<span class="sub">± ${p}%</span>`:`${r>0?"▲":"▼"} ${p.toLocaleString("pt-BR")}%`;};
  const linhas=ord.map(c=>{
    const a=_a(c);
    const novo=c.data_processamento&&corte&&c.data_processamento>=corte;
    const zer=(c.quadro&&c.quadro.total_ia!=null&&c.quadro.total_ia<=0);
    return `<tr style="cursor:pointer" onclick="trocaCnj('${c.cnj}')">
      <td style="white-space:nowrap">${c.data_processamento||"—"}${novo?' <span class="tag" style="background:var(--salmao);color:#fff">novo</span>':""}</td>
      <td style="font-variant-numeric:tabular-nums;white-space:nowrap">${c.cnj}${c.gabarito_pdf_dif?` <b style="color:var(--acc-perto);cursor:help" title="* PJC e PDF de cálculos diferentes (.pjc ${c.gabarito_pdf_dif.id_pjc} × PDF ${c.gabarito_pdf_dif.id_pdf}); a comparação usa o .pjc">*</b>`:""}</td>
      <td style="text-align:left;font-size:11.5px">${aptidaoCell(c)}</td>
      <td style="text-align:left">${chipConfianca(c)}</td>
      <td style="text-align:right;font-weight:700;color:${corAcc(a)}" title="${rotAcc(a)}">${accTxt(a)}${negFlag(c)}</td>
      <td style="text-align:right;white-space:nowrap">${dirCell(c)}</td>
      <td style="text-align:right${zer?";color:var(--ruim);font-weight:600":""}">${brl((c.quadro||{}).total_ia)}</td>
      <td style="text-align:right">${brl((c.quadro||{}).total_pjc)}</td>
      <td style="text-align:left">${chipAgente(c)}</td></tr>`;}).join("");
  document.getElementById("main").innerHTML=`<h2>Lista de casos</h2>
    ${barraPeriodo()}
    <div style="display:flex;gap:10px;align-items:end;margin:0 0 10px;flex-wrap:wrap">
      ${_selF("Casos",listaFiltro,GRUPOS_CASO,"listaFiltro=this.value;telaLista()")}
      ${_selF("Direção",listaDirecao,DIRECOES,"listaDirecao=this.value;telaLista()")}
      ${_selF("Confiança",listaConf,[["","Todas"],...CONF_FAIXAS.map(([k,rot])=>[k,rot])],"listaConf=this.value;telaLista()")}
      ${_selF("Agente",listaAgente,AG_FILTROS,"listaAgente=this.value;telaLista()")}
      <div><div class="sub">Buscar CNJ</div><input value="${esc(listaBusca||"")}" placeholder="dígitos do CNJ…" oninput="listaBusca=this.value;telaLista()"
        style="padding:8px 10px;border:1px solid var(--linha);border-radius:8px;min-width:200px;background:var(--surface);color:var(--text)"></div>
      <button class="btn-dl" style="margin:0" onclick="baixarLista()">baixar CSV</button>
    </div>
    <div class="sub" style="margin-bottom:10px"><b>${cs.length}</b> casos no filtro · ${cs.filter(c=>c.apto).length} aptos · clique no cabeçalho para ordenar, numa linha para abrir o caso</div>
    <div style="overflow-x:auto"><table style="font-size:12px"><thead><tr>
      ${_th("data","Data","left","")}
      ${_th("cnj","CNJ","left","")}
      ${_th("apto","Aptidão","left","")}
      ${_th("conf","Confiança","left","Score de confiança, só com o lado LIFT. Passe o mouse no selo para ver o que foi acionado.")}
      ${_th("assert","② Assertividade","right","a soma final do LIFT bate com a da referência")}
      ${_th("dir","Direção","right","total do LIFT acima (▲) ou abaixo (▼) da referência, em % da referência")}
      ${_th("lift","LIFT","right","")}
      ${_th("ref","Referência","right","")}
      ${_th("agente","Agente","left","problemas achados pelo agente; ordena pelo R$ de erro da IA")}</tr></thead><tbody>${linhas}</tbody></table></div>
    ${cs.length?"":'<p class="sub">Nenhum caso com esse filtro.</p>'}`;
}
function baixarLista(){
  const cs=_listaCasos();
  const head=["Data","CNJ","Apto","Categoria de inaptidão","Tipo de cálculo","Jornada (decisão)","Apuração usada","Cartão: meses","Cartão: dias","Acurácia global","Assertividade","Índice de compensação",
              "Verbas c/ par (s/ reflexo)","Verbas do caso (s/ reflexo)","Reflexos c/ par","Reflexos",
              "Total LIFT","Total referência","Referência lida","Confiança","Pontos de risco","Componentes do score"];
  const rows=cs.map(c=>{const cm=c.camadas||{},p=cm.principal||{},r=cm.rescisoria||{},x=cm.reflexo||{};
    const j=c.jornada||{}, ct=j.cartao||{};
    return [c.data_processamento,c.cnj,c.apto?"sim":"não",c.apto?"":(c.categoria_inaptidao||""),c.tipo_calculo||"",
      j.tipo_decisao||"",(j.cartao_nao_usado?"presumida (manda cartão!)":(j.fonte_apuracao||"")),ct.n_comp||"",ct.n_dias||"",
      (c.quadro||{}).acuracia_global,(c.quadro||{}).assertividade,(c.quadro||{}).indice_compensacao,
      (p.n_par||0)+(r.n_par||0),(p.n||0)+(r.n||0),x.n_par||0,x.n||0,
      (c.quadro||{}).total_ia,(c.quadro||{}).total_pjc,
      c.sem_pjc?"não carregada":(c.extracao_confiavel?"sim":"não confiável"),
      c.confianca?_confRot(c.confianca.faixa):"",c.confianca?c.confianca.pontos:"",
      c.confianca?c.confianca.componentes.map(x=>(x.tipo==="trava"?"TRAVA ":"")+x.rotulo).join(" | "):""];});
  baixarCSV("casos_validacao.csv",[head,...rows]);
}

// ---- Analytics (painel) ----
var anPeriodo="Tudo";
function _anPct(v){return v==null?"—":(Math.round(v*10)/10).toString().replace(".",",")+"%";}
function _anParse(d){const p=d.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
function _anShift(d,days){const t=_anParse(d);t.setUTCDate(t.getUTCDate()-days);return t.toISOString().slice(0,10);}
function _anWeek(d){const t=_anParse(d);const k=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-k);return t.toISOString().slice(0,10);}
function _anDM(d){return d.slice(8,10)+"/"+d.slice(5,7);}
function anSetPeriodo(n,label){
  const ds=D.cnjs.map(c=>D.casos[c]).filter(Boolean).map(c=>c.data_processamento).filter(Boolean).sort();
  const anchor=ds.length?ds[ds.length-1]:null;
  if(!n||!anchor){fDe="";fAte="";}else{fDe=_anShift(anchor,n);fAte="";}
  anPeriodo=label; _render();
}
// `ref` = o valor do período inteiro (o número do card). Sem ele, a ponta da
// linha vira "o nível de hoje" — e uma semana de 1 caso mostrava 75% ao lado de
// um card de 24%, os dois certos. A linha de referência e os pontos vazados em
// semana com menos de 3 casos existem para impedir essa leitura.
function aplicaTema(t){document.documentElement.classList.toggle("dark",t==="dark");
  const b=document.getElementById("themebtn"); if(b)b.textContent=t==="dark"?"☀️":"🌙";}
function toggleTema(){const t=document.documentElement.classList.contains("dark")?"light":"dark";
  try{localStorage.setItem("tema",t);}catch(e){} aplicaTema(t);}
function temaInicial(){try{const s=localStorage.getItem("tema"); if(s)return s;
  if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)return "dark";}catch(e){} return "light";}
try{aplicaTema(temaInicial());}catch(e){}
topo();irPlacar();
</script>
