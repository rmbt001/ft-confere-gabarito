      <div class="ph">quantos casos em cada faixa de <b>assertividade</b> — a medida não tem piso, então a faixa mais baixa inclui casos com erro maior que a própria referência</div>
      <div class="an-grid2">
        <div>${_anHist(fx)}</div>
        <div>
          <div class="kpi"><span class="kn" style="color:${corAcc(97)}">${fx[0]+fx[1]}</span><span class="kl">casos com o <b>total na meta</b> (≥ 80%), de ${arrA.length}</span></div>
          <div class="kpi"><span class="kn" style="color:${corAcc(60)}">${fx[2]}</span><span class="kl">abaixo da meta, entre 50% e 80%</span></div>
          <div class="kpi g"><span class="kn">${fx[3]}</span><span class="kl">com o total <b>fora</b> (&lt; 50%)</span></div>
          <div class="an-note">Esta distribuição usa a <b>②</b> de propósito: ela compara só os dois totais e <b>não depende do pareamento</b> verba a verba, então é a leitura que se sustenta enquanto o de-para não fecha. Em compensação ela é <b>líquida</b>: um caso pode aparecer nas faixas altas com erro grande se a verba a mais anular a verba a menos. Quem separa isso é o <b>①</b> dos cards, e a distância entre os dois está aberta em <a href="javascript:irErro()" style="color:var(--salmao)">Onde o erro nasce</a>.
          ${fx[3]>=arrA.length/2?" A maior parte dos casos está na faixa mais baixa: mover a mediana depende de causa sistêmica, não de caso a caso.":""}</div>
        </div>
      </div></div>
    ${_cab("Cartão de ponto × jornada pré-fixada","a origem da jornada muda o acerto?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">Os mesmos casos do placar, separados por <b>de onde vem a jornada</b>. Cartão é apuração dia a dia sobre batidas reais; pré-fixada é regra arbitrada na decisão. A medida em destaque é a <b>②</b>, que não depende do pareamento verba a verba. <b>N pequeno em cada grupo</b>, então leia como indício e confira o n de cada linha antes de concluir.</div>
    ${tabJornada}
    ${filaJor}
    <div class="sub" style="margin-top:6px;max-width:940px">No recorte largo (todos os <b>${conf.length}</b> casos com referência confiável, incluindo acima de R$ 200 mil): ${largoJor}</div>
    ${_cab("Camadas de verba","o erro está na principal, na rescisória ou no reflexo?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">As medidas <b>①</b> e <b>③</b> abertas nas três camadas, que erram por motivos diferentes: <b>principais</b> (P10a) apuram base × quantidade mês a mês; <b>rescisórias</b> (P10b) são valor fixo/roteado; <b>reflexos</b> são calculados em código sobre cada verba-base e <b>herdam o erro dela</b>, por isso a coluna “reflexo c/ base certa” isola os reflexos cuja base já bate (≥95%). <b>Mesmo recorte dos cards</b>, então a linha GLOBAL é o card ①.</div>
    ${camTabela}
    <div class="sub" style="margin-top:6px;max-width:940px">No recorte largo (os <b>${conf.length}</b> casos com referência confiável ${soAptos?"e aptos":"(apto + não-apto)"}, incluindo os acima de R$ 200 mil, que é o mesmo da aba “Acurácia por verba”): global <b>${accTxt((camConf.global||{}).medCaso)}</b> · valor quando casa <b>${accTxt((camConf.global||{}).medVerba)}</b> · reflexo com base certa <b>${accTxt((camConf.reflexo||{}).medBaseOk)}</b> em ${((camConf.reflexo||{}).baseOk||[]).length} comparações.</div>
    ${_cab("Camadas de valor","a atualização monetária acrescenta erro?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">O mesmo cálculo medido em três valores: <b>nominal</b> (o devido), <b>corrigido</b> (× fator do índice) e <b>com juros</b> (+ SELIC). Se a acurácia cai de uma camada para a outra, a <b>atualização</b> está somando erro por cima do cálculo; se fica igual, o erro é todo do nominal e a atualização só o amplifica. Lado referência: corrigido vem do <b>índice acumulado do próprio .pjc</b> (exato); com juros vem do Resumo do PDF, então só existe nos casos que têm o PDF ao lado.</div>
    <table><thead><tr><th>Camada</th><th style="text-align:right">Casos</th><th style="text-align:right">Σ LIFT</th><th style="text-align:right">Σ Referência</th><th style="text-align:right">① global (mediana)</th><th style="text-align:right">② assertividade (mediana)</th></tr></thead><tbody>${valRows}</tbody></table>`;
}

// ------------------------------------------------- ONDE O ERRO NASCE ---------
// Decompõe o MESMO dinheiro do card ① por natureza de erro, em R$. É a resposta
// para "onde mexer rende mais": a % por verba diz o que está ruim, o R$ diz o
// que é grande. Verba de R$ 500 com 0% de acurácia não paga o esforço.
const EIXOS_ERRO=[
  ["falta","Verba que a referência tem e o LIFT não entregou","escopo","#D8503C",
   "Sub-identificação (P2/P4 não deferiu) ou deferiu e não calculou. O crédito sai menor do que é."],
  ["excesso","Verba que só o LIFT calculou","escopo","#C98A00",
   "Super-identificação (P2/P4), ou a referência não trata aquilo como verba própria. Infla o crédito."],
  ["p9a","Roteada como não-calculável e a referência quantificou","escopo","#8E44AD",
   "O P9a marcou não-calculável (decisão ilíquida, documento ausente, norma coletiva) e a referência apurou assim mesmo."],
  ["zerada","Casou com a referência e saiu R$ 0","conta","#7A1F12",
   "A verba existe dos dois lados e o LIFT devolveu zero: competências vazias no P9b, base zero, ou dedução maior que o devido."],
  ["apuracao","Diferença de conta na verba principal","conta","var(--salmao)",
   "Os dois lados têm a verba e o valor difere: base, quantidade de horas, período apurado (P8 · P9b · P10a)."],
  ["rescisoria","Diferença em rescisória / valor fixo","conta","var(--azul)",
   "Valor fixado em decisão, aviso, 13º, férias, multas (P10b)."],
  ["reflexo","Diferença no reflexo","conta","#C98A00",
   "13º, férias, aviso e DSR sobre a verba-base, calculados em código. Herda o erro da base."],
];
function _eixoErro(v){
  if(v.status==="nao_calc")return "p9a";
  if(v.status==="so_pjc")return "falta";
  if(v.status==="so_ia")return v.total_ia==null?"falta":"excesso";   // deferida-não-calculada × super-identificação
  if(v.total_ia===0&&v.total_pjc)return "zerada";
  if(v.is_reflexo)return "reflexo";
  if(v.is_rescisoria)return "rescisoria";
  return "apuracao";
}
const _erroRS=v=>Math.abs((v.total_ia||0)-(v.total_pjc||0));
const _tamRS=v=>Math.max(v.total_ia||0,v.total_pjc||0);
function telaErro(){
  const ft=baseFT();
  const eixos={}; EIXOS_ERRO.forEach(([k])=>eixos[k]={rs:0,n:0,casos:{},verbas:{}});
  let totErro=0,totTam=0,liq=0;
  const porVerba={};
  ft.forEach(c=>(c.verbas||[]).forEach(v=>{
    const e=_erroRS(v); if(!e)return;   // verba sem diferença nenhuma não entra em lugar nenhum
    const k=_eixoErro(v), g=eixos[k]; if(!g)return;
    g.rs+=e; g.n++; g.casos[c.cnj]=1; totErro+=e; totTam+=_tamRS(v); liq+=(v.total_ia||0)-(v.total_pjc||0);
    const nome=v.nome_ia||v.nome_pjc||"(sem nome)";
    const cod=(v.p4&&v.p4.codigo_glossario)||(v.p9a_raw&&v.p9a_raw.codigo_glossario)||v.codigo_glossario||null;
    const ch=(cod||nome)+"|"+k;
    const p=porVerba[ch]||(porVerba[ch]={nome,cod,eixo:k,rs:0,n:0,casos:{}});
    p.rs+=e; p.n++; p.casos[c.cnj]=1;
  }));
  const pctT=v=>totErro?100*v/totErro:0;
  // naturezas sem nenhuma verba no recorte saem da lista (ex.: "roteada como
  // não-calculável" é zero entre aptos por definição — verba não-calculável é o
  // que torna o caso não-apto). Ficam nomeadas no rodapé, para não parecer que
  // a natureza deixou de ser medida.
  const vazios=EIXOS_ERRO.filter(([k])=>!eixos[k].n).map(x=>x[1]);
  const ordem=EIXOS_ERRO.filter(([k])=>eixos[k].n).sort((a,b)=>eixos[b[0]].rs-eixos[a[0]].rs);
  // guarda de honestidade do maior balde: "só o LIFT calculou" que convive, no
  // MESMO caso, com "só a referência tem" pode ser a mesma verba com nomes que o
  // de-para não casou. Isso é falha de pareamento, não super-identificação.
  let rsAmbiguo=0;
  ft.forEach(c=>{const vs=c.verbas||[];
    if(!vs.some(v=>_eixoErro(v)==="falta"))return;
    vs.forEach(v=>{if(_eixoErro(v)==="excesso")rsAmbiguo+=_erroRS(v);});});
  // Quanto do ① depende do pareamento: compara os casos com a assinatura de
  // pareamento duvidoso (verba só-LIFT E verba só-referência no mesmo caso)
  // contra os demais. Se ① despenca nos suspeitos mas ② não, o que está
  // quebrado é o PAR, não o cálculo — ② compara só os totais e não usa o par.
  const susp=ft.filter(_pareamentoSuspeito), limpos=ft.filter(c=>!_pareamentoSuspeito(c));
  const _medG=a=>_mediana(a.map(c=>c.quadro.acuracia_global).filter(x=>x!=null));
  const _medA=a=>_mediana(a.map(c=>c.quadro.assertividade).filter(x=>x!=null));
  const gS=_medG(susp), gL=_medG(limpos), aS=_medA(susp), aL=_medA(limpos);
  const somaGrupo=g=>EIXOS_ERRO.filter(x=>x[2]===g).reduce((s,x)=>s+eixos[x[0]].rs,0);
  const rsEscopo=somaGrupo("escopo"), rsConta=somaGrupo("conta");
  // barra empilhada escopo × conta: a leitura de uma olhada
  const seg=(v,cor,lbl)=>v?`<div style="width:${100*v/totErro}%;background:${cor};display:flex;align-items:center;justify-content:center;color:#fff;font-family:Sora;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden" title="${lbl}: ${brl(v)}">${Math.round(pctT(v))}%</div>`:"";
  const linhas=ordem.map(([k,rot,grupo,cor,desc])=>{
    const g=eixos[k], nCasos=Object.keys(g.casos).length;
    const top=Object.values(porVerba).filter(p=>p.eixo===k).sort((a,b)=>b.rs-a.rs).slice(0,8);
    const det=top.length?`<table style="font-size:11.5px;margin-top:7px"><thead><tr><th>Verba</th><th style="text-align:right">Casos</th><th style="text-align:right">R$ em jogo</th><th style="text-align:right">% do erro total</th></tr></thead><tbody>
        ${top.map(p=>`<tr><td>${p.cod?`<b style="font-family:Sora;color:var(--salmao)">${esc(p.cod)}</b> · `:""}${esc(p.nome)}</td>
          <td style="text-align:right">${Object.keys(p.casos).length}</td><td style="text-align:right">${brl(p.rs)}</td>
          <td style="text-align:right">${pctT(p.rs).toFixed(1)}%</td></tr>`).join("")}</tbody></table>`:"";
    return `<details style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:7px">
      <summary style="cursor:pointer;display:flex;align-items:center;gap:12px;list-style:none;flex-wrap:wrap">
        <span style="flex:1;min-width:230px"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${cor};margin-right:8px"></span><b>${rot}</b>
          <span class="tag" style="margin-left:7px">${grupo==="escopo"?"escopo":"conta"}</span></span>
        <span style="flex:0 0 150px;background:var(--salmao-claro);border-radius:6px;height:16px;position:relative;overflow:hidden"><span style="position:absolute;left:0;top:0;height:16px;width:${Math.max(2,Math.round(100*g.rs/(totErro||1)))}%;background:${cor}"></span></span>
        <b style="font-family:Sora;min-width:120px;text-align:right">${brl(g.rs)}</b>
        <span class="sub" style="min-width:150px;text-align:right;font-size:11.5px">${pctT(g.rs).toFixed(1)}% do erro · ${g.n} verba${g.n!==1?"s":""} em ${nCasos} caso${nCasos!==1?"s":""}</span>
      </summary>
      <div class="sub" style="margin-top:6px;max-width:900px">${desc}</div>${det}
      ${top.length?`<div class="sub" style="margin-top:6px;font-size:11px">8 maiores desta natureza. A aba <a href="javascript:irVerbas()" style="color:var(--salmao)">Acurácia por verba</a> abre cada uma caso a caso.</div>`:""}
    </details>`;}).join("");
  // direção: em R$ (líquido) e em nº de casos (±5% no ponto)
  let sub=0,neu=0,sup=0;
  ft.forEach(c=>{const ia=c.quadro.total_ia,pj=c.quadro.total_pjc;if(ia==null||pj==null||pj<=0)return;
    const r=(ia-pj)/pj; if(r>0.05)sup++;else if(r<-0.05)sub++;else neu++;});
  const vtot=sub+neu+sup;
  const vseg=(n,cor,lbl)=>n?`<div style="width:${100*n/vtot}%;background:${cor};display:flex;align-items:center;justify-content:center;color:#fff;font-family:Sora;font-weight:600;font-size:12px" title="${lbl}: ${n}">${n}</div>`:"";
  document.getElementById("main").innerHTML=`<h2>Onde o erro nasce</h2>
    <div class="sub" style="margin-bottom:12px;max-width:940px">O <b>mesmo dinheiro</b> do card ① do <a href="javascript:irPlacar()" style="color:var(--salmao)">Placar</a> (${ft.length} casos ${soAptos?"aptos":""}, referência lida e abaixo de R$ 200 mil), separado por <b>natureza do erro</b> e medido em <b>reais</b>. A aba “Acurácia por verba” ordena por percentual, que diz o que está ruim; aqui a ordem é por <b>R$ em jogo</b>, que diz o que é grande. As duas juntas dão a fila de prioridade.</div>
    <div style="margin:0 0 10px">${chipEscopo()}</div>
    ${barraPeriodo()}
    ${_cab("Escopo × conta","o LIFT calcula as verbas erradas, ou calcula errado as verbas certas?")}
    <div class="tiles">
      ${_tile(brl(totErro),"Erro total no período","Σ|LIFT − referência|, verba a verba",true)}
      ${_tile(Math.round(pctT(rsEscopo))+"%","Erro de escopo",brl(rsEscopo)+" · verba a mais, a menos ou não calculada")}
      ${_tile(Math.round(pctT(rsConta))+"%","Erro de conta",brl(rsConta)+" · a verba existe dos dois lados e o valor difere")}
      ${_tile((liq>=0?"+":"−")+brl(Math.abs(liq)).replace("R$",""),"Saldo líquido",liq>=0?"o LIFT calcula A MAIS no agregado":"o LIFT calcula A MENOS no agregado")}
    </div>
    ${totErro?`<div style="display:flex;height:38px;border-radius:9px;overflow:hidden;gap:2px;margin-top:14px">
      ${seg(rsEscopo,"#D8503C","Erro de escopo")}${seg(rsConta,"var(--salmao)","Erro de conta")}</div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--cinza);margin-top:6px"><span>← escopo: a lista de verbas está errada</span><span>conta: a lista está certa e o valor não →</span></div>`:""}
    <div class="an-note" style="margin-top:12px;max-width:940px">A distância entre <b>①</b> e <b>③</b> no Placar é exatamente a fatia de <b>escopo</b> desta barra. Erro de escopo se conserta em prompt de deferimento e roteamento (P2/P4/P9a); erro de conta, em apuração (P8/P9b/P10) e em código de reflexo.</div>
    ${_cab("Por natureza do erro","qual etapa do pipeline devolve mais dinheiro se for consertada?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">Cada linha é um mecanismo distinto, com a etapa que o produz. Abra para ver as <b>maiores verbas</b> daquela natureza. Uma verba pode aparecer em mais de uma linha quando erra por motivos diferentes em casos diferentes.</div>
    ${linhas||'<p class="sub">Sem verbas divergentes no recorte.</p>'}
    ${vazios.length?`<div class="sub" style="margin-top:4px;font-size:11.5px">Sem nenhuma verba no recorte: ${vazios.map(v=>esc(v.toLowerCase())).join(" · ")}.</div>`:""}
    ${rsAmbiguo?`<div class="warn" style="margin-top:14px"><b>Quanto deste número depende do pareamento estar certo.</b>
      <b>${brl(rsAmbiguo)}</b> (${pctT(rsAmbiguo).toFixed(1)}% do erro total) está em casos que têm, ao mesmo tempo, verba <b>só no LIFT</b> e verba <b>só na referência</b>.
      Pode ser a <b>mesma verba</b> com nomes diferentes que o de-para não casou, e aí é falha de <b>pareamento</b>, não erro de cálculo.
      <div style="margin-top:8px">Os <b>${susp.length}</b> casos com essa assinatura (de ${ft.length}) medem assim:</div>
      <table style="font-size:12px;margin-top:5px;max-width:620px"><thead><tr><th style="text-align:left">Casos</th><th style="text-align:right">① global</th><th style="text-align:right">② assertividade</th></tr></thead><tbody>
        <tr><td>Com verba órfã dos dois lados (${susp.length})</td><td style="text-align:right;font-weight:700;color:${corAcc(gS)}">${accTxt(gS)}</td><td style="text-align:right;color:${corAcc(aS)}">${accTxt(aS)}</td></tr>
        <tr><td>Demais (${limpos.length})</td><td style="text-align:right;font-weight:700;color:${corAcc(gL)}">${accTxt(gL)}</td><td style="text-align:right;color:${corAcc(aL)}">${accTxt(aL)}</td></tr>
      </tbody></table>
      <div style="margin-top:7px">${(gS!=null&&gL!=null&&gS<gL&&aS!=null&&aL!=null&&aS>=aL)
        ? `Nos suspeitos o <b>①</b> cai (${accTxt(gS)} contra ${accTxt(gL)}) e o <b>②</b> <b>não</b> cai (${accTxt(aS)} contra ${accTxt(aL)}). Essa é a assinatura de <b>par quebrado</b>: os totais concordam, mas o painel enxerga duas verbas órfãs onde há uma só. Enquanto o de-para não fechar, o ① desses casos é piso, não medida.`
        : `Compare as duas linhas: se o ① cai nos suspeitos e o ② não acompanha, o que está quebrado é o par, não a conta.`}</div></div>`:""}
    ${_cab("Direção","o LIFT erra para cima ou para baixo?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">Sinal de (total LIFT − total referência) por caso, ±5% no ponto. Os dois erros têm custo <b>diferente</b> para o negócio: para cima compra caro, para baixo perde negócio — por isso não podem ser lidos como uma média só.</div>
    ${vtot?`<div style="display:flex;height:40px;border-radius:9px;overflow:hidden;gap:2px;margin-top:6px">${vseg(sub,"var(--azul)","Calcula a menos")}${vseg(neu,"var(--neutro)","No ponto")}${vseg(sup,"var(--salmao)","Calcula a mais")}</div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--cinza);margin-top:6px"><span>← erra pra baixo</span><span>no ponto ±5%</span><span>erra pra cima →</span></div>
      <div class="an-legend"><span><i class="an-dot" style="background:var(--azul)"></i> Calcula a menos (${sub})</span><span><i class="an-dot" style="background:var(--neutro)"></i> No ponto (${neu})</span><span><i class="an-dot" style="background:var(--salmao)"></i> Calcula a mais (${sup})</span></div>
      <div class="an-note">Casa com os eixos sistêmicos já mapeados: jornada pré-fixada zera hora extra (para baixo) × hora extra 100% inflada por DSR/feriado assumido (para cima).</div>`:'<div class="sub">Sem casos comparáveis no recorte.</div>'}
    ${_cab("Índice de compensação","quanto do erro do caso some quando se olha só o total?")}
    ${blocoCompensacao(ft)}`;
}
// Seção final da tela: em quantos casos o total está mentindo.
// Não substitui nada — o pareamento suspeito e a decomposição em reais, acima,
// continuam inteiros. Esta responde outra pergunta, sobre os mesmos casos.
function blocoCompensacao(ft){
  // Fora do gráfico, por dois motivos diferentes que precisam ser contados
  // separado: sem índice é erro bruto ZERO (não há compensação a medir, e o
  // Python grava nulo de propósito); erro bruto pequeno demais é onde o índice
  // mede arredondamento. O corte é RELATIVO: R$ 50 de erro sobre R$ 1.000 de
  // referência importa, sobre R$ 500 mil não.
  const comIndice=ft.filter(c=>c.quadro.indice_compensacao!=null);
  const nSemIndice=ft.length-comIndice.length;
  const plot=comIndice.filter(c=>c.quadro.erro_bruto>=0.05*Math.abs(c.quadro.total_pjc||0));
  const nPequeno=comIndice.length-plot.length;
  if(!plot.length)return '<div class="sub">Sem casos com erro suficiente para medir compensação neste recorte.</div>';
  const pontos=plot.map(c=>({cnj:c.cnj,a:c.quadro.assertividade,i:c.quadro.indice_compensacao,
                             g:(c.camadas&&c.camadas.global?c.camadas.global.acc:null)}));
  const nBorda=pontos.filter(p=>p.a<-100).length;
  const sel=_quadDisp,q=QUADRANTES.find(x=>x[0]===sel);
  const daSel=sel?pontos.filter(p=>_quadDe(p.a,p.i)===sel).sort((x,y)=>y.i-x.i):[];
  // Todas as contagens da nota são CALCULADAS. Número escrito à mão aqui
  // envelhece na primeira rodada e ninguém percebe, porque continua plausível.
  const nota=[nBorda?`<b>${nBorda}</b> ${nBorda===1?"caso está":"casos estão"} abaixo de −100% e ${nBorda===1?"aparece fixado":"aparecem fixados"} na borda de baixo (triângulo), para não esmagar o resto do gráfico`:"",
              nPequeno?`<b>${nPequeno}</b> ${nPequeno===1?"caso ficou":"casos ficaram"} de fora por ter erro bruto abaixo de 5% da referência — ali o índice mede arredondamento, não compensação`:"",
              nSemIndice?`<b>${nSemIndice}</b> ${nSemIndice===1?"caso não tem":"casos não têm"} índice: erro bruto zero, então não há compensação a medir (nulo, não zero)`:""
             ].filter(Boolean).map(t=>`<div>· ${t}.</div>`).join("");
  const linhas=daSel.map(p=>`<tr onclick="trocaCnj('${p.cnj}')" style="cursor:pointer" title="abrir o resumo deste caso">
      <td>${p.cnj}</td>
      <td style="text-align:right;color:${corAcc(p.a)}">${accTxt(p.a)}</td>
      <td style="text-align:right;color:${corAcc(p.g)}">${accTxt(p.g)}</td>
      <td style="text-align:right;font-weight:700">${p.i.toFixed(1)}%</td></tr>`).join("");
  return `<div class="sub" style="margin-bottom:10px;max-width:940px">Um ponto por caso: <b>quanto do erro se anula</b> (→) contra <b>a nota que o total dá</b> (↑).
      O índice é <b>1 − erro líquido ÷ erro bruto</b>: 0% = todo o erro vai na mesma direção e o total mostra o estrago inteiro;
      100% = o total bate por acaso. Clique num quadrante para listar os casos dele.</div>
    ${_anDisp(pontos,sel)}
    <div class="an-note" style="margin-top:2px">${plot.length} casos no gráfico, de ${ft.length} no recorte.</div>
    ${nota?`<div class="sub" style="font-size:11.5px;margin-top:6px">${nota}</div>`:""}
    ${sel?`<div style="margin-top:14px"><b>${esc(q[1])}</b> <span class="sub">· ${daSel.length} ${daSel.length===1?"caso":"casos"}</span>
        <div class="sub" style="margin-top:4px;max-width:940px">${q[2]}</div>
        <table style="font-size:12px;margin-top:8px;max-width:620px"><thead><tr>
          <th style="text-align:left">CNJ</th><th style="text-align:right">② assertividade</th>
          <th style="text-align:right">① acurácia global</th><th style="text-align:right">índice</th></tr></thead>
          <tbody>${linhas}</tbody></table></div>`
      :`<div class="sub" style="margin-top:12px">Nenhum quadrante selecionado — <b>clique em um deles no gráfico</b> para ver a lista de casos, com o CNJ clicável.</div>`}`;
}

// -------------------------------------------------------- ELEGIBILIDADE ------
// Nenhuma medida desta tela segue o seletor "só aptos": ela é justamente sobre
// quem é apto. Por isso o chip não aparece aqui.
function telaElegib(){
  const todos=casosFiltrados();
  const aptos=todos.filter(c=>c.apto);
  const nSemTipo=todos.filter(c=>!c.tipo_calculo).length;
  const sRR=todos.filter(c=>c.tipo_calculo===TIPO_RR||!c.tipo_calculo);
  const sApto=sRR.filter(c=>c.apto);
  const sComPjc=sApto.filter(c=>!c.sem_pjc);
  const sConf=sComPjc.filter(c=>c.extracao_confiavel);
  const sMeta=sConf.filter(c=>c.quadro.assertividade!=null&&c.quadro.assertividade>=80);
  const sMetaG=sConf.filter(c=>c.quadro.acuracia_global!=null&&c.quadro.acuracia_global>=80);
  const _fnl=[{l:"Casos no período",n:todos.length,d:""},
    {l:"Risco Real (ou tipo não informado)",n:sRR.length,d:"outro tipo de cálculo (Autos/Adequação…)"},
    {l:"Aptos ao FT",n:sApto.length,d:"verba inelegível / dep. documento"},
    {l:"Com referência carregada",n:sComPjc.length,d:"aguardando o cálculo de referência subir"},
    {l:"Extração da referência confiável",n:sConf.length,d:"referência pouco confiável"},
    {l:"② Assertividade ≥ 80% (meta)",n:sMeta.length,d:"abaixo da meta"},
    {l:"① Acurácia global ≥ 80%",n:sMetaG.length,d:"régua dura: cai mais"}];
  const _fmax=todos.length||1;
  const funil=_fnl.map((s,i)=>{const w=Math.max(6,Math.round(100*s.n/_fmax));const drop=i?_fnl[i-1].n-s.n:0;
    const taxa=i&&_fnl[i-1].n?100*s.n/_fnl[i-1].n:null;
    return `<div class="fstep"><div class="fbar-wrap">
      <div class="fbar-track"><div class="fbar-fill" style="width:${w}%;opacity:${(1-i*0.11).toFixed(2)}">${s.n}</div></div>
      <div class="fbar-meta"><span class="frname">${s.l}</span>${taxa!=null?` · <span class="fpass">${taxa.toFixed(1).replace(".",",")}% do anterior</span>`:""}

  // motivo da queda no degrau "Aptos"
  const grp={}; todos.filter(c=>!c.apto).forEach(c=>{const k=c.categoria_inaptidao||"Motivo não classificado";grp[k]=(grp[k]||0)+1;});
  const dord=Object.entries(grp).sort((a,b)=>b[1]-a[1]),dmax=Math.max.apply(null,dord.map(d=>d[1]).concat(1));
  const dcolor=k=>/inelegível/i.test(k)?"var(--ruim)":/documento/i.test(k)?"var(--cinza)":/n[ãa]o calcul/i.test(k)?"var(--salmao)":"var(--neutro)";
  const drop=dord.length?dord.map(([k,n])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:190px;font-size:12px" class="frname">${esc(k)}</div><div style="flex:1;height:20px;background:var(--card);border-radius:6px;overflow:hidden"><div style="width:${100*n/dmax}%;height:100%;background:${dcolor(k)};border-radius:6px"></div></div><div style="width:26px;text-align:right;font-family:Sora;font-weight:600;font-size:12px">${n}</div></div>`).join(""):'<div class="sub">Nenhum caso não-apto no recorte.</div>';
  // matriz dos R$ 200k: gate de PRODUÇÃO (valor do LIFT), sobre aptos com referência lida
  const rot=aptos.filter(comPJC);
  const m=[[0,0],[0,0]];
  rot.forEach(c=>{const ia=c.quadro.total_ia,pj=c.quadro.total_pjc;if(ia==null||pj==null)return;m[ia<LIMITE_FT?0:1][pj<LIMITE_FT?0:1]++;});
  const mtot=m[0][0]+m[0][1]+m[1][0]+m[1][1],acerto=mtot?100*(m[0][0]+m[1][1])/mtot:null;
  // acurácia por tipo de cálculo
  const porTipo={};
  todos.forEach(c=>{const t=c.tipo_calculo||"(sem tipo)"; (porTipo[t]=porTipo[t]||[]).push(c);});
  const tipoRows=Object.entries(porTipo).sort((a,b)=>b[1].length-a[1].length).map(([t,arr])=>{
    const arrConf=arr.filter(comPJC);
    const accArr=arrConf.map(c=>c.quadro.assertividade).filter(x=>x!=null);
    const acc=_media(accArr), med=_mediana(accArr);
    const nAdeq=arr.filter(c=>c.calculo_adequacao).length;
    const nNc=arr.length-arrConf.length;
    return `<tr><td>${esc(t)}</td><td style="text-align:right">${arr.length}${nNc?` <span class="sub" title="${nNc} sem referência carregada ou com extração não confiável — fora da acurácia">(${arrConf.length} comparáveis)</span>`:""}</td>
      <td style="text-align:right;font-weight:700;color:${corAcc(acc)}" title="${rotAcc(acc)}">${acc!=null?acc.toFixed(1)+"%":"—"}</td>
      <td style="text-align:right;color:${corAcc(med)}">${med!=null?med.toFixed(1)+"%":"—"}</td>
      <td style="text-align:right${nAdeq?';color:var(--ruim)':''}">${nAdeq||"—"}</td></tr>`;}).join("");
  const tipoCurto=t=>!t?"—":t.replace("Cálculo de ","").replace("Cálculo dos ","").replace("Cálculo do ","");
  // casos por categoria de aptidão
  const _catOf=c=>c.fora_regua?(FORA_REGUA_ROT[c.fora_regua]+" — fora da régua")
    :(c.apto&&c.sem_pjc)?"⏳ Apto, aguardando referência (não validável ainda)"
    :(c.apto&&!c.extracao_confiavel)?"⚠️ Referência não lida — não validável"
    :c.apto?(aptoValor(c)?"✓ Apto valor (IA entre R$ 50 mil e R$ 200 mil) · validável":"✓ Apto · validável (referência lida)"):("Não Apto · "+(c.categoria_inaptidao||"motivo não classificado"));
  const _grp={}; todos.forEach(c=>{(_grp[_catOf(c)]=_grp[_catOf(c)]||[]).push(c);});
  const casosGrp=Object.entries(_grp).sort((a,b)=>((a[0][0]==="✓"?0:1)-(b[0][0]==="✓"?0:1))||b[1].length-a[1].length).map(([cat,arr])=>{
    const linhas=arr.slice().sort((a,b)=>(b.data_processamento||"").localeCompare(a.data_processamento||"")).map(c=>{
      const a=c.quadro.assertividade;
      const mot=c.apto?"—":esc((c.motivos_inaptidao||[]).map(m=>m.detalhe).join(" · ")||(c.codigos_inelegiveis||[]).join(", ")||"—");
      return `<tr style="cursor:pointer" onclick="trocaCnj('${c.cnj}')"><td>${c.data_processamento||"—"}</td><td>${c.cnj}</td>
        <td class="sub" style="font-size:12px" title="${esc(c.tipo_calculo||"")}">${tipoCurto(c.tipo_calculo)}${c.calculo_adequacao?" ⟳":""}</td>
        <td style="text-align:right;color:${corAcc(a)}" title="${rotAcc(a)}">${a!=null?a+"%":"—"}</td>
        <td style="text-align:right">${brl(c.quadro.total_ia)}</td><td style="text-align:right">${brl(c.quadro.total_pjc)}</td>
        <td class="sub" style="font-size:11px">${mot}</td>
        <td style="text-align:center" title="${c.sem_pjc?"referência ainda não carregada":(c.extracao_confiavel?"referência lida":"extração da referência não confiável")}">${c.sem_pjc?"⏳":(c.extracao_confiavel?"✓":"⚠️")}</td></tr>`;}).join("");
    const cor=cat[0]==="✓"?"var(--ok)":(cat[0]==="⚠"||cat[0]==="⏳"?"var(--acc-perto)":"var(--ruim)");
    return `<details${cat[0]==="✓"?" open":""} style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:8px">
      <summary style="cursor:pointer;display:flex;align-items:center;gap:12px;list-style:none">
        <span style="flex:1;font-weight:700;color:${cor}">${esc(cat)}</span>
        <b style="font-family:Sora;min-width:80px;text-align:right">${arr.length} caso${arr.length>1?"s":""}</b></summary>
      <div style="margin-top:8px;overflow-x:auto"><table style="font-size:12px"><thead><tr><th>Data</th><th>CNJ</th><th>Tipo</th><th>Acur.</th><th>LIFT</th><th>Referência</th><th>Motivo (se não-apto)</th><th>Extr.</th></tr></thead><tbody>${linhas}</tbody></table></div>
    </details>`;}).join("");
  document.getElementById("main").innerHTML=`<h2>Elegibilidade</h2>
    <div class="sub" style="margin-bottom:12px;max-width:940px">Quem entra no automatizado. População única desta tela: <b>todos os ${todos.length} casos do período</b>, apto e não-apto.
      Nenhum número aqui segue o seletor “só aptos” do Placar, porque a pergunta é justamente quem é apto. <b>Não Apto ≠ Restrito</b>: não-apto não segue pelo automatizado (vai para humano/Full), mas o caso pode ser aproveitado.</div>
    ${barraPeriodo()}
    ${_cab("Funil","onde os casos caem entre entrar e bater a meta?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">Cada etapa é subconjunto da anterior. O degrau do tipo inclui de propósito os <b>${nSemTipo}</b> casos <b>sem tipo na esteira</b>: tipo ausente não prova que o caso não é Risco Real, então não derruba a aptidão, e assim o degrau “Aptos ao FT” fecha com os <b>${aptos.length}</b> aptos. Os dois últimos degraus são a <b>mesma população</b> medida pelas duas réguas.</div>
    <div class="panel" style="margin-top:0">${funil}
      <div class="an-grid2b" style="margin-top:16px">
        <div><h3 style="margin-bottom:10px">Motivo da queda no degrau “Aptos”</h3>${drop}</div>
        <div><div class="an-note" style="border:0;padding:0">Os <b>${aptos.length} aptos</b> se dividem depois em <b>${aptos.filter(comPJC).length}</b> validáveis (referência lida), <b>${aptos.filter(c=>c.sem_pjc).length}</b> aguardando a referência e <b>${aptos.filter(c=>!c.sem_pjc&&!c.extracao_confiavel&&!c.fora_regua).length}</b> com referência não lida e <b>${aptos.filter(c=>!c.sem_pjc&&c.fora_regua).length}</b> fora da régua (não calculado / gabarito a corrigir). Nenhum balde sozinho dá ${aptos.length}.</div></div>
      </div></div>
    ${_cab("Fronteira dos R$ 200 mil","o roteamento manda o caso para o lado certo?")}
    <div class="sub" style="margin-bottom:10px;max-width:940px">O gate de produção é o valor do <b>LIFT</b> (a referência não existe na hora da decisão): abaixo de R$ 200 mil vai para o automatizado, acima vai para a esteira Full. Aqui, com a referência na mão, dá para ver se a decisão teria sido certa. Sobre os <b>${rot.length}</b> casos aptos com referência lida.</div>
    ${mtot?`<div class="an-grid2">
      <div class="mtx">
        <div class="ch"></div><div class="ch">Referência &lt; 200k<br><span style="font-weight:400">(real: automatizável)</span></div><div class="ch">Referência ≥ 200k<br><span style="font-weight:400">(real: é Full)</span></div>
        <div class="rh">LIFT &lt; 200k<br><span style="font-weight:400">→ automatizado</span></div>
        <div class="cell okc"><div class="cn">${m[0][0]}</div><div class="cl">✓ automatizou certo</div></div>
        <div class="cell grave"><div class="cn">${m[0][1]}</div><div class="cl">⚠ caso Full foi automatizado</div></div>
        <div class="rh">LIFT ≥ 200k<br><span style="font-weight:400">→ esteira Full</span></div>
        <div class="cell perda"><div class="cn">${m[1][0]}</div><div class="cl">foi pro Full à toa</div></div>
        <div class="cell okc"><div class="cn">${m[1][1]}</div><div class="cl">✓ barrou certo → Full</div></div>
      </div>
      <div>
        <div class="kpi"><span class="kn">${accTxt(acerto)}</span><span class="kl">acerto de roteamento (diagonal ÷ ${mtot})</span></div>
        <div class="kpi g"><span class="kn">${m[0][1]}</span><span class="kl"><b>vazamento pra dentro</b> — caso ≥ 200k tratado como pequeno. Risco operacional.</span></div>
        <div class="kpi p"><span class="kn">${m[1][0]}</span><span class="kl"><b>vazamento pra fora</b> — foi pro Full sem precisar. Custo de cobertura.</span></div>
        <div class="an-note">Erro de roteamento ≠ erro de valor: um caso colado nos 200 mil troca de lado com um percentual pequeno de erro. Por isso é um quadro à parte da acurácia.</div>
      </div></div>`:'<div class="sub">Sem casos comparáveis no recorte.</div>'}
    ${_cab("Tipo de cálculo da referência","estou comparando contra o gabarito certo?")}
    <div class="sub" style="margin-bottom:6px">Tipo do cálculo de referência (esteira pré-compra do Zeev). <b>Adequação</b> = casos com a flag ligada; o Fast Track só é comparável contra <b>Risco Real</b>.</div>
    <table><thead><tr><th>Tipo de cálculo</th><th style="text-align:right">Casos</th><th style="text-align:right">Assertividade média</th><th style="text-align:right">Mediana</th><th style="text-align:right">Adequação</th></tr></thead><tbody>${tipoRows}</tbody></table>
    ${_cab("Casos por categoria","quem é cada um dos "+todos.length+" casos?")}
    <div class="sub" style="margin-bottom:8px;max-width:940px">Agrupados por aptidão. <b>Não Apto</b> = tipo ≠ Risco Real, verba de glossário inelegível, ou verba não-calculável/dependente de documento (exceto honorários). Clique num caso para abrir.</div>
    ${casosGrp}`;
}

// ---------------------------------------------------- CONFIANÇA DO DADO ------
// Tudo o que responde "não dá para medir isto" — separado do resultado de
// propósito: extração da referência quebrada, cadastro divergente, caso sem
// referência e cálculo zerado não são acurácia ruim, são ausência de medida.
function telaConfianca(){
  const todos=casosFiltrados();
  const semPjc=todos.filter(c=>c.sem_pjc);
  const comRef=todos.filter(c=>!c.sem_pjc);
  const conf=comRef.filter(c=>c.extracao_confiavel);
  // fora da régua tem lista própria: não é o parser que quebrou
  const foraRegua=comRef.filter(c=>c.fora_regua);
  const naoConf=comRef.filter(c=>!c.extracao_confiavel&&!c.fora_regua);
  const foraRows=foraRegua.slice().sort((a,b)=>(a.fora_regua||"").localeCompare(b.fora_regua||"")||(b.data_processamento||"").localeCompare(a.data_processamento||"")).map(c=>
    `<tr style="cursor:pointer" onclick="trocaCnj('${c.cnj}')"><td>${c.data_processamento||"—"}</td><td>${c.cnj}</td>
      <td style="text-align:center">${c.apto?'<span style="color:var(--ok)">✓ apto</span>':'<span class="sub">não-apto</span>'}</td>
      <td style="font-size:12px">${FORA_REGUA_ROT[c.fora_regua]||esc(c.fora_regua)}</td>
      <td class="sub" style="font-size:11.5px;text-align:left">${esc(c.motivo_fora_regua||"—")}</td></tr>`).join("");
  const foraGrp={};
  foraRegua.forEach(c=>{const k=(c.fora_regua==="nao_calculado"?String(c.motivo_fora_regua||"?"):"gabarito a corrigir").slice(0,90);foraGrp[k]=(foraGrp[k]||0)+1;});
  const foraTop=Object.entries(foraGrp).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td style="text-align:right;font-weight:700">${n}</td></tr>`).join("");
  const semHist=conf.filter(c=>c.hist_confiavel===false);
  const baseAcc=conf.filter(c=>c.apto&&c.quadro.total_pjc!=null&&c.quadro.total_pjc<LIMITE_FT);
  const covArr=conf.map(c=>{const np=c.diag_extracao&&c.diag_extracao.n_verbas_pjc;
    const nc=c.verbas.filter(v=>v.status==="coincide").length; return np?100*nc/np:null;}).filter(x=>x!=null);
  // casos com extração não confiável, com o motivo — antes só existia como banner
  // dentro do caso, então a lista de "o que consertar no parser" não existia.
  const motRows=naoConf.slice().sort((a,b)=>(b.data_processamento||"").localeCompare(a.data_processamento||"")).map(c=>{
    const ms=((c.diag_extracao||{}).motivos_extracao)||[];
    return `<tr style="cursor:pointer" onclick="trocaCnj('${c.cnj}')"><td>${c.data_processamento||"—"}</td><td>${c.cnj}</td>
      <td style="text-align:center">${c.apto?'<span style="color:var(--ok)">✓ apto</span>':'<span class="sub">não-apto</span>'}</td>
      <td class="sub" style="font-size:11.5px;text-align:left">${ms.length?ms.map(esc).join(" · "):"motivo não registrado (JSON antigo)"}</td></tr>`;}).join("");
  // agrupa o motivo pela primeira frase: mostra se é um bug de parser ou vários
  const motGrp={};
  naoConf.forEach(c=>{const ms=((c.diag_extracao||{}).motivos_extracao)||["(não registrado)"];
    ms.forEach(m=>{const k=String(m).split(/[(:]/)[0].trim().slice(0,70); motGrp[k]=(motGrp[k]||0)+1;});});
  const motTop=Object.entries(motGrp).sort((a,b)=>b[1]-a[1])
    .map(([k,n])=>`<tr><td>${esc(k)}</td><td style="text-align:right;font-weight:700">${n}</td></tr>`).join("");
  // dados cadastrais (insumo)
  const cad=agregaCadastro(comRef);
  const _cadCor={parcial:"var(--acc-perto)",escopo:"var(--acc-perto)",diverge:"var(--ruim)"};
  const cadRows=Object.values(cad.campos).map(e=>{
    const comp=e.bate+e.parcial+e.mais+e.menos+e.diverge;
    const pctOk=comp?100*(e.bate+e.parcial)/comp:null;
    const lista=e.casos.length?`<details style="margin-top:4px"><summary style="cursor:pointer;font-size:11.5px;color:var(--cinza)">ver os ${e.casos.length} caso(s)</summary>
        <table style="font-size:11.5px;margin-top:5px"><tbody>${e.casos.slice().sort((a,b)=>Math.abs((b.l.delta_dias||0))-Math.abs((a.l.delta_dias||0))).map(o=>
          `<tr style="cursor:pointer" onclick="trocaCnj('${o.cnj}')" title="${esc(o.l.motivo||"")}"><td>${o.cnj}</td><td>${esc(o.l.lift||"—")}</td><td>${esc(o.l.pjc||"—")}</td>
           <td style="text-align:right;color:${_cadCor[o.tipo]||"var(--cinza)"}">${o.l.delta_dias!=null&&o.l.delta_dias!==0?(o.l.delta_dias>0?"+":"")+o.l.delta_dias+"d":(o.tipo==="parcial"?"grafia":"—")}</td></tr>`).join("")}</tbody></table></details>`:"";
    return `<tr><td>${esc(e.campo)}${lista}</td><td style="text-align:right">${comp}</td>
      <td style="text-align:right;color:var(--ok)">${e.bate}</td>
      <td style="text-align:right;color:${e.parcial?"var(--acc-perto)":"var(--cinza)"}">${e.parcial||"—"}</td>

      ${p4g?`<div class="p4">${p4g}</div>`:""}
      ${p4e?`<div style="margin-top:10px"><div class="sub" style="margin-bottom:6px">Jornada específica citada por verba:</div>${p4e}</div>`:""}`:""}`;

// "recente" é ancorado na data mais nova da BASE (não em hoje): o painel é
// gerado de um recorte, e usar o relógio faria tudo parecer velho.
const _maxData=()=>{const ds=D.cnjs.map(c=>D.casos[c]).filter(Boolean).map(c=>c.data_processamento).filter(Boolean).sort();
  return ds.length?ds[ds.length-1]:null;};
// Caso com verba só-LIFT E verba só-referência ao mesmo tempo: as duas podem ser
// a MESMA verba que o de-para não casou. Enquanto o pareamento não está redondo,
// toda medida que penaliza escopo (a acurácia global) fica suspeita nesses casos,
// e é por isso que ela não aparece na lista.
function _pareamentoSuspeito(c){
  const vs=(c.verbas||[]).filter(v=>!v.is_reflexo);
  return vs.some(v=>v.status==="so_ia"&&v.total_ia!=null) && vs.some(v=>v.status==="so_pjc");
}
// cabeçalho clicável: mostra a seta só na coluna ativa, e o title diz o que o

function _th(k,rot,align,dica){
  const on=listaOrdem===k;
  const seta=on?(listaDir==="asc"?" ▲":" ▼"):"";
  const t=(dica?dica+" · ":"")+(on?"clique para inverter":"clique para ordenar por esta coluna");
  return `<th style="text-align:${align};cursor:pointer;white-space:nowrap;${on?"color:var(--salmao)":""}"
    title="${esc(t)}" onclick="listaOrd('${k}')">${rot}<span style="font-size:10px">${seta}</span></th>`;
}

  const nApto=cs.filter(c=>c.apto).length;

  // jornada: contado sobre o PERÍODO (não sobre o filtro), senão o número muda

  document.getElementById("main").innerHTML=`<h2>Lista de casos</h2>
    <div class="sub" style="margin-bottom:12px;max-width:940px">Todos os casos do período numa tabela só, <b>sem agrupar</b>, ordenada por data de processamento.

      <div style="margin-top:7px">A medida desta lista é a <b>② assertividade</b>, que compara só os dois totais e <b>não depende do pareamento</b> verba a verba.
      A <b>① acurácia global</b> fica de fora aqui de propósito: ela conta verba de um lado só como erro cheio, então <b>toda falha de de-para vira erro de cálculo</b> no número, e o de-para ainda não está redondo.
      O <b style="color:var(--acc-perto)">⚖</b> na coluna de verbas marca os casos onde isso é provável (há verba só no LIFT <b>e</b> verba só na referência ao mesmo tempo).

    </div>

          ${[["data|desc","Data (mais novo primeiro)"],["data|asc","Data (mais antigo primeiro)"],

      ${_th("assert","② Assertividade","right","② Assertividade: a soma final do LIFT bate com a da referência. Não depende do pareamento verba a verba, por isso é a medida desta lista.")}

      ${_th("lift","LIFT","right","")}

    ${cs.length?"":'<p class="sub">Nenhum caso com esse filtro.</p>'}`;

function baixarLista(){

              "Verbas c/ par (s/ reflexo)","Verbas do caso (s/ reflexo)","Reflexos c/ par","Reflexos",
              "Total LIFT","Total referência","Referência lida"];
  const rows=cs.map(c=>{const cm=c.camadas||{},p=cm.principal||{},r=cm.rescisoria||{},x=cm.reflexo||{};
    const j=c.jornada||{}, ct=j.cartao||{};
    return [c.data_processamento,c.cnj,c.apto?"sim":"não",c.apto?"":(c.categoria_inaptidao||""),c.tipo_calculo||"",
      j.tipo_decisao||"",(j.cartao_nao_usado?"presumida (manda cartão!)":(j.fonte_apuracao||"")),ct.n_comp||"",ct.n_dias||"",
      (c.quadro||{}).acuracia_global,(c.quadro||{}).assertividade,(c.quadro||{}).indice_compensacao,
      (p.n_par||0)+(r.n_par||0),(p.n||0)+(r.n||0),x.n_par||0,x.n||0,
      (c.quadro||{}).total_ia,(c.quadro||{}).total_pjc,
      c.sem_pjc?"não carregada":(c.extracao_confiavel?"sim":"não confiável")];});

// ---- Analytics (painel) ----
var anPeriodo="Tudo";
// ---- Aba "Versões de prompt" -----------------------------------------------
// Os casos foram processados em momentos diferentes, com prompts diferentes: a
// acurácia agregada é média ponderada de SAFRAS distintas, não a medição de uma
// versão. Toda tabela de resultado carrega `id_agente`, e o catálogo de agentes
// resolve o id para (agente, versão, data, texto do prompt) — então dá para
// segmentar a acurácia por versão e ler o diff do que mudou entre safras.
//
// LIMITE DE MÉTODO, dito na tela: comparar safras é OBSERVACIONAL. Cada safra
// tem casos diferentes, então a diferença mistura efeito de prompt com
// composição de casos. Só reprocessar os MESMOS casos em duas versões (teste
// pareado) atribui causa.
function irVersoes(){ _modo("versoes"); telaVersoes(); }

const _vBase=()=>casosEscopo().filter(comPJC).filter(c=>c.quadro&&c.quadro.acuracia_global!=null);
const _pct=v=>v==null?"—":(Math.round(v*10)/10).toLocaleString("pt-BR")+"%";

function _porVersao(base,etapa){
  const g={};
  base.forEach(c=>{const v=(c.versoes||{})[etapa]; const k=v==null?"?":String(v); (g[k]=g[k]||[]).push(c);});
  return Object.entries(g).map(([k,cs])=>({
    versao:k, n:cs.length,
    med:_mediana(cs.map(c=>c.quadro.acuracia_global)),
    media:_media(cs.map(c=>c.quadro.acuracia_global)),
    // tamanho típico do caso em cada versão: se varia, a comparação entre
    // versões está confundida por complexidade e não vale como ranking
    pjc:_mediana(cs.map(c=>c.quadro.total_pjc).filter(v=>v!=null)),
    datas:cs.map(c=>c.data_processamento).filter(Boolean).sort(),
  })).sort((a,b)=>(a.versao==="?")-(b.versao==="?")||(+a.versao)-(+b.versao));
}

function telaVersoes(){
  const A=D.agentes||{}, ETAPAS=A.etapas||[], SAFRA=A.etapas_safra||[];
  if(!(A.catalogo||[]).length){
    document.getElementById("main").innerHTML=`<h2>Versões de prompt</h2>
      <div class="obs"><h3>catálogo de agentes ausente</h3>Rode <b>python ingerir.py</b> para baixar
      <code>raw.ft_lift_tb_agente</code> e depois <b>python gerar_telas.py</b>. É essa tabela que diz
      qual versão de prompt produziu cada saída.</div>`;
    return;
  }
  const base=_vBase();

  // ---- 1. safras (combinação de versões do miolo do cálculo) ----
  const porSafra={};
  base.forEach(c=>{if(c.safra)(porSafra[c.safra]=porSafra[c.safra]||[]).push(c);});
  const safras=Object.entries(porSafra).map(([k,cs])=>{
    const datas=cs.map(c=>c.data_processamento).filter(Boolean).sort();
    return {safra:k,n:cs.length,cs,
      med:_mediana(cs.map(c=>c.quadro.acuracia_global)),
      medAss:_mediana(cs.map(c=>c.quadro.assertividade).filter(v=>v!=null)),
      de:datas[0]||null,ate:datas[datas.length-1]||null};
  }).sort((a,b)=>String(a.de||"").localeCompare(String(b.de||"")));

  const maxN=Math.max(1,...safras.map(s=>s.n));
  // NENHUM veredito nesta tabela: as safras têm casos DIFERENTES, então a
  // diferença entre elas mistura efeito de versão com complexidade do caso.
  // "melhor safra" aqui seria só o balde que sorteou os casos mais fáceis.
  // Veredito só no bloco pareado (mesmo caso, duas versões).
  const trSafra=safras.map(s=>`<tr>
      <td><b style="font-family:Sora">${esc(s.safra)}</b></td>
      <td style="text-align:right">${s.de||"—"}</td><td style="text-align:right">${s.ate||"—"}</td>
      <td style="text-align:right">
        <span style="display:inline-block;vertical-align:middle;width:${Math.max(3,Math.round(70*s.n/maxN))}px;height:9px;background:var(--salmao);border-radius:2px;margin-right:6px"></span>${s.n}</td>
      <td style="text-align:right">${_pct(s.med)}</td>
      <td style="text-align:right">${_pct(s.medAss)}</td>
      <td style="text-align:right">${brl(_mediana(s.cs.map(c=>c.quadro.total_pjc).filter(v=>v!=null)))}</td></tr>`).join("");

  const espalha=safras.filter(s=>s.n>=10);
  const dif=espalha.length>1?Math.max(...espalha.map(s=>s.med))-Math.min(...espalha.map(s=>s.med)):0;
  const alerta=dif>=8?`<div class="obs">
      <h3>por que não há “melhor safra” nesta tabela</h3>
      Entre as safras com 10+ casos a acurácia mediana varia <b>${_pct(dif).replace("%"," pontos")}</b>,
      e a média global da tela é a mistura disso — ela não mede versão nenhuma. Mas o ranking
      <b>não é atribuível à versão</b>: cada safra tem <b>casos diferentes</b>, com complexidade e
      tamanho diferentes (a coluna <b>PJC mediano</b> mostra isso), então a diferença confunde
      prompt com amostra. Por isso esta tabela é <b>descritiva</b>: ela serve para mostrar que a
      população é misturada, não para eleger uma versão.
      <div style="margin-top:8px">O veredito só sai do <b>bloco pareado</b> abaixo: mesmo caso,
      duas versões, tudo o mais constante.</div></div>`:"";

  // ---- bloco PAREADO: o mesmo caso em duas versões ----
  const PA=(A.pareado||{casos:[],transicoes:[]});
  const trans=(PA.transicoes||[]).filter(t=>(t.casos||[]).length);
  const blocoPar=(()=>{
    if(!trans.length)return `<div class="obs" style="border-left-color:var(--ruim)">
      <h3>não há nenhum caso rodado em duas versões</h3>
      Sem o mesmo caso em duas versões, <b>nenhuma comparação entre versões é atribuível</b> —
      só dá para descrever safras. Destravar isto é reprocessar um conjunto fixo de casos na
      versão atual (e é o mesmo pré-requisito de qualquer suíte de regressão).</div>`;
    const blocos=trans.map(t=>{
      const cs=t.casos;
      // erro em módulo contra a referência, de cada lado — pareado: mesmo caso,
      // mesma referência, só a versão muda.
      // Assertividade de cada lado e o Δ em p.p., caso a caso. "Melhorou/piorou"
      // sozinho é rótulo: não distingue mover 0,3 ponto de mover 40, e foi assim
      // que um lote que derrubou casos quase certos passou por "38 × 49".
      // Ordena por Δ CRESCENTE — as maiores regressões no topo, que é onde se age.
      const pp=v=>numf(Math.round(v*10)/10)+" p.p.";
      const cmp=cs.map(o=>{
        // resolve a âncora pelo CASO, não pelo valor gravado: num JSON gerado
        // antes da correção o `o.pjc` é o total COM reflexos, e o lado LIFT não
        // os tem. Resolvendo aqui, a tela fica certa sem depender do render.
        const cc=D.casos[o.cnj], anc=cc?ancoraRodada(cc):o.pjc;
        const aDe=asrtRodada(o.ia_de,anc), aPara=asrtRodada(o.ia_para,anc);
        return {...o, pjc:anc, aDe, aPara, d:(aDe==null||aPara==null)?null:aPara-aDe};
      }).sort((x,y)=>((x.d==null)-(y.d==null))||(x.d-y.d));
      const linhas=cmp.map(o=>{
        const cor=o.d==null?"var(--neutro)":o.d>0.05?"var(--ok)":o.d<-0.05?"var(--ruim)":"var(--neutro)";
        return `<tr><td><span onclick="trocaCnj('${o.cnj}')" style="cursor:pointer;color:var(--salmao)" title="abrir caso">${o.cnj} ↗</span>
          ${o.apto?"":' <span class="sub">não-apto</span>'}</td>
          <td style="text-align:right">${brl(o.pjc)}</td>
          <td style="text-align:right">${brl(o.ia_de)}</td><td style="text-align:right">${brl(o.ia_para)}</td>
          <td style="text-align:right;color:${corAcc(o.aDe)}">${o.aDe==null?"—":_pct(o.aDe)}</td>
          <td style="text-align:right;font-weight:700;color:${corAcc(o.aPara)}">${o.aPara==null?"—":_pct(o.aPara)}</td>
          <td style="text-align:right;color:${cor};font-weight:600">${
            o.d==null?"—":(o.d>0?"+":"−")+pp(Math.abs(o.d))}</td></tr>`;}).join("");
      const ds=cmp.map(o=>o.d).filter(v=>v!=null);
      const mel=ds.filter(v=>v>0.05).length, pio=ds.filter(v=>v<-0.05).length;
      const medD=ds.length?_mediana(ds):null;
      return `<details style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:7px" open>
        <summary style="cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
          <b style="font-family:Sora">${esc(t.de)} → ${esc(t.para)}</b>
          <span class="sub">${cs.length} caso(s) nos dois lados</span>
          <span class="sub" style="color:var(--ok)">${mel} subiu</span>
          <span class="sub" style="color:var(--ruim)">${pio} caiu</span>
          ${medD==null?"":`<span class="sub" style="margin-left:auto;font-weight:700;color:${
            medD>0.05?"var(--ok)":medD<-0.05?"var(--ruim)":"var(--neutro)"}">Δ mediano ${
            medD>0?"+":"−"}${pp(Math.abs(medD))}</span>`}</summary>
        <div style="overflow-x:auto"><table style="font-size:12px;margin-top:6px"><thead><tr>
          <th>Caso</th><th style="text-align:right">Referência</th>
          <th style="text-align:right">LIFT em ${esc(t.de)}</th><th style="text-align:right">LIFT em ${esc(t.para)}</th>
          <th style="text-align:right">Assert. antes</th><th style="text-align:right">Assert. depois</th>
          <th style="text-align:right" title="quanto a assertividade andou, em pontos percentuais">Δ p.p.</th>
          </tr></thead><tbody>${linhas}</tbody></table></div>
        ${cs.length<8?`<div class="sub" style="margin-top:7px">N pequeno: leia caso a caso, não como taxa.</div>`:""}
      </details>`;}).join("");
    return blocos;
  })();

  // ---- 2. acurácia por versão de cada etapa ----
  const blocosEtapa=ETAPAS.map(e=>{
    const linhas=_porVersao(base,e.etapa);
    const uteis=linhas.filter(l=>l.versao!=="?");
    if(uteis.length<2)return `<div style="padding:9px 0;border-bottom:1px solid var(--linha)">
      <b style="font-family:Sora">${esc(e.etapa)}</b> <span class="sub">${esc(e.rotulo)}</span>
      <span class="sub"> · versão única na base (v${uteis.length?uteis[0].versao:"?"}) — não é fonte de variação</span></div>`;
    return `<details style="border-bottom:1px solid var(--linha);padding:9px 0" ${SAFRA.includes(e.etapa)?"open":""}>
      <summary style="cursor:pointer;list-style:none">
        <b style="font-family:Sora">${esc(e.etapa)}</b> <span class="sub">${esc(e.rotulo)}</span>
        <span class="sub"> · ${uteis.length} versões na base</span></summary>
      <table style="font-size:12px;margin-top:7px;max-width:760px"><thead><tr>
        <th>Versão</th><th style="text-align:right">Casos</th>
        <th style="text-align:right">Acurácia global (mediana)</th><th style="text-align:right">média</th>
        <th style="text-align:right" title="tamanho típico do caso nesta versão — se varia entre versões, a diferença de acurácia está confundida por complexidade">PJC mediano</th>
        <th style="text-align:right">1º processamento</th></tr></thead><tbody>
        ${linhas.map(l=>`<tr><td>${l.versao==="?"?"<span class='sub'>sem versão</span>":"v"+l.versao}</td>
          <td style="text-align:right">${l.n}</td><td style="text-align:right"><b>${_pct(l.med)}</b></td>
          <td style="text-align:right">${_pct(l.media)}</td>
          <td style="text-align:right">${brl(l.pjc)}</td>
          <td style="text-align:right">${l.datas[0]||"—"}</td></tr>`).join("")}
      </tbody></table></details>`;}).join("");

  // ---- 3. o que mudou de uma versão p/ a seguinte (diff do prompt) ----
  const mud=(A.mudancas||[]).slice().reverse();
  const blocosMud=mud.map(m=>{
    const trechos=(m.trechos||[]).map(t=>{
      const rem=(t.rem||[]).map(l=>`<div style="color:var(--ruim)">− ${esc(l)}</div>`).join("");
      const add=(t.add||[]).map(l=>`<div style="color:var(--ok)">+ ${esc(l)}</div>`).join("");
      const maisR=t.rem_n>(t.rem||[]).length?`<div class="sub">… +${t.rem_n-(t.rem||[]).length} linha(s) removida(s)</div>`:"";
      const maisA=t.add_n>(t.add||[]).length?`<div class="sub">… +${t.add_n-(t.add||[]).length} linha(s) adicionada(s)</div>`:"";
      return `<div style="margin:9px 0;padding-left:10px;border-left:2px solid var(--linha);font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word">
        <div class="sub" style="font-family:Onest">${esc(t.tipo)} · linha ~${t.linha} · −${t.rem_n} +${t.add_n}</div>
        ${rem}${maisR}${add}${maisA}</div>`;}).join("");
    const delta=m.chars_para-m.chars_de;
    return `<details style="border:1px solid var(--linha);border-radius:9px;padding:9px 13px;margin-bottom:7px">
      <summary style="cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <b style="font-family:Sora;color:var(--salmao)">${esc(m.agente)}</b>
        <span>v${m.de} → v${m.para}</span>
        <span class="sub">${esc(m.criado_em||"")}</span>
        <span class="sub">${(m.trechos||[]).length} trecho(s) · ${delta>=0?"+":""}${numf(delta)} chars · similaridade ${m.similaridade}</span>
      </summary>${trechos||'<div class="sub">sem trechos legíveis no diff</div>'}</details>`;}).join("");

  document.getElementById("main").innerHTML=`<h2>Versões de prompt</h2>
    <div class="sub" style="margin-bottom:12px;max-width:940px">Cada saída do LIFT carrega o
    <code>id_agente</code> que a produziu, e o catálogo <code>ft_lift_tb_agente</code> resolve esse id
    para <b>agente + versão + data + texto do prompt</b>. Então a acurácia pode ser lida
    <b>por versão</b>, e não como um número só que mistura tudo. A <b>safra</b> é a combinação de
    versões do miolo do cálculo (${SAFRA.join(" / ")}) — o upstream é praticamente constante na
    população, então a variação que importa está aí.</div>
    <div style="margin:0 0 14px">${chipEscopo()}</div>

    <h3 style="margin:22px 0 4px;font-size:14px">Comparação pareada — o mesmo caso em duas versões</h3>
    <div class="sub" style="margin-bottom:9px;max-width:940px">A <b>única</b> leitura que separa efeito de
    versão de complexidade do caso: mesmo caso, mesma referência, só a versão muda. Vem das rodadas
    anteriores guardadas nas tabelas (reprocessar cria uma rodada nova, e a antiga fica).
    <b>${PA.n_hist||0}</b> caso(s) têm histórico em mais de uma safra, e
    <b>${PA.n_comparaveis||0}</b> tem total nos dois lados e entram abaixo.
    Valor comparado = <b>principal + rescisórias</b> do LIFT; reflexos ficam fora porque são feitos em
    código e não têm versão de prompt — então “aproximou da referência” é <b>direção</b>, não acurácia
    (a referência inclui reflexos e os dois lados aqui não).</div>
    <div style="max-width:940px">${blocoPar}</div>

    <h3 style="margin:26px 0 4px;font-size:14px">Safras na base de acurácia (${base.length} casos) — descritivo</h3>
    <div class="sub" style="margin-bottom:7px">Uma linha por combinação <b>${SAFRA.join("/")}</b>, em ordem
    de entrada em produção. Serve para ver <b>que a população é misturada</b>. Não é ranking de versão:
    os casos de cada linha são outros.</div>
    <div style="overflow-x:auto;max-width:940px"><table style="font-size:12px"><thead><tr>
      <th>Safra (${SAFRA.join("/")})</th><th style="text-align:right">1º processamento</th>
      <th style="text-align:right">último</th><th style="text-align:right">Casos</th>
      <th style="text-align:right" title="de todo o dinheiro do caso, quanto está no lugar certo (mediana)">Acurácia global</th>
      <th style="text-align:right" title="a soma final bate (mediana)">Assertividade</th>
      <th style="text-align:right" title="tamanho típico do caso na safra — se varia entre linhas, a comparação entre safras está confundida por complexidade">PJC mediano</th></tr></thead>
      <tbody>${trSafra||'<tr><td colspan="7" class="sub">sem safra identificada nesta base</td></tr>'}</tbody></table></div>
    ${alerta}

    <h3 style="margin:26px 0 4px;font-size:14px">Acurácia por versão, etapa a etapa</h3>
    <div class="sub" style="margin-bottom:7px">Serve para localizar em qual etapa a troca de versão
    <b>acompanha</b> mudança de resultado, e para ver quais etapas não variam na população.
    Também é <b>descritivo</b>: cada versão tem casos diferentes, e a coluna <b>PJC mediano</b> deixa
    o confundidor à vista — se ele muda junto com a acurácia, a leitura é sobre a amostra.</div>
    <div style="max-width:900px">${blocosEtapa}</div>

    <h3 style="margin:26px 0 4px;font-size:14px">O que mudou entre versões (${mud.length} mudanças)</h3>
    <div class="sub" style="margin-bottom:7px">Diff do próprio texto do prompt, lido do catálogo de
    agentes — mais recentes primeiro. É onde procurar a causa quando uma safra desloca o resultado.</div>
    <div style="max-width:940px">${blocosMud||'<p class="sub">sem histórico de versões no catálogo.</p>'}</div>`;
}

function _anPct(v){return v==null?"—":(Math.round(v*10)/10).toString().replace(".",",")+"%";}
function _anParse(d){const p=d.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
function _anShift(d,days){const t=_anParse(d);t.setUTCDate(t.getUTCDate()-days);return t.toISOString().slice(0,10);}
function _anWeek(d){const t=_anParse(d);const k=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-k);return t.toISOString().slice(0,10);}
function _anDM(d){return d.slice(8,10)+"/"+d.slice(5,7);}
function anSetPeriodo(n,label){
  const ds=D.cnjs.map(c=>D.casos[c]).filter(Boolean).map(c=>c.data_processamento).filter(Boolean).sort();
  const anchor=ds.length?ds[ds.length-1]:null;
  if(!n||!anchor){fDe="";fAte="";}else{fDe=_anShift(anchor,n);fAte="";}
  anPeriodo=label; _render();
}
// `ref` = o valor do período inteiro (o número do card). Sem ele, a ponta da
// linha vira "o nível de hoje" — e uma semana de 1 caso mostrava 75% ao lado de
// um card de 24%, os dois certos. A linha de referência e os pontos vazados em
// semana com menos de 3 casos existem para impedir essa leitura.
const N_MIN_SEMANA=3;
function _anSerie(x,med,media,verbas,cb,cc,ref,refLab){
  const N=x.length;
  if(!N)return '<div class="sub">Sem casos no recorte.</div>';
  const all=med.concat(media,verbas).filter(v=>v!=null).concat(ref!=null?[ref]:[]);
  if(!all.length)return '<div class="sub">Sem acurácia no recorte.</div>';
  let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  let y0=Math.max(0,Math.floor((lo-5)/10)*10), y1=Math.min(100,Math.ceil((hi+5)/10)*10);
  if(y1<=y0){y0=Math.max(0,y0-10);y1=Math.min(100,y0+20);}
  const W=720,H=258,pl=42,pr=52,pt=16,pb=42;
  const X=i=>N===1?(pl+(W-pr))/2:pl+i*(W-pl-pr)/(N-1);
  const Y=v=>(H-pb)-(v-y0)/(y1-y0)*((H-pb)-pt);
  const step=(y1-y0)<=20?5:10;
  let g="";
  for(let v=y0;v<=y1;v+=step){const y=Y(v);g+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--linha)" stroke-width="1"/><text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--cinza)">${v}%</text>`;}
  x.forEach((lb,i)=>{g+=`<text x="${X(i)}" y="${H-26}" text-anchor="middle" font-size="10" fill="var(--cinza)">${lb}</text>`;
    const fraco=cb[i]<N_MIN_SEMANA;
    g+=`<text x="${X(i)}" y="${H-13}" text-anchor="middle" font-size="9" fill="${fraco?"var(--ruim)":"var(--neutro)"}">${fraco?"n="+cb[i]:cb[i]}</text>`;});
  // linha do período inteiro: é o número do card, e ancora a leitura da ponta
  if(ref!=null){const yr=Y(ref);
    g+=`<line x1="${pl}" y1="${yr}" x2="${W-pr}" y2="${yr}" stroke="var(--salmao)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>`;
    g+=`<text x="${pl+4}" y="${yr-6}" font-size="10" font-weight="700" fill="var(--salmao)">${refLab||"① do período"}: ${_anPct(ref)}</text>`;}
  const path=a=>a.map((v,i)=>v==null?null:`${X(i)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
  // ponto vazado = semana com menos de 3 casos: ali a mediana é um caso, não um nível
  const dots=(a,c)=>a.map((v,i)=>{if(v==null)return"";const fraco=cb[i]<N_MIN_SEMANA;
    return `<circle cx="${X(i)}" cy="${Y(v).toFixed(1)}" r="${fraco?3.5:4}" fill="${fraco?"var(--surface)":c}" stroke="${fraco?c:"var(--surface)"}" stroke-width="2"><title>${x[i]} (${cb[i]} caso${cb[i]===1?"":"s"}${fraco?" — poucos casos, não é nível":""}): ${_anPct(v)}</title></circle>`;}).join("");
  g+=`<polyline points="${path(media)}" fill="none" stroke="var(--azul)" stroke-width="2"/>`;
  g+=`<polyline points="${path(verbas)}" fill="none" stroke="var(--ouro)" stroke-width="2"/>`;
  g+=`<polyline points="${path(med)}" fill="none" stroke="var(--salmao)" stroke-width="2"/>`;
  g+=dots(media,"var(--azul)")+dots(verbas,"var(--ouro)")+dots(med,"var(--salmao)");
  const last=N-1, fracoFim=cb[last]<N_MIN_SEMANA;
  // rótulos diretos nas pontas, com de-colisão vertical (≥13px entre eles). Se a
  // última semana tem menos de 3 casos, o rótulo sai apagado e com o n: aquele
  // número é um caso, e em negrito colorido ele competia com o card.
  const items=[[med,"var(--salmao)"],[verbas,"var(--ouro)"],[media,"var(--azul)"]]
    .filter(it=>it[0][last]!=null).map(it=>({y:Y(it[0][last]),c:it[1],t:_anPct(it[0][last])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<items.length;i++){if(items[i].y-items[i-1].y<13)items[i].y=items[i-1].y+13;}
  items.forEach(it=>{g+=`<text x="${X(last)+6}" y="${it.y+3}" font-size="${fracoFim?10:11}" font-weight="${fracoFim?400:700}" fill="${fracoFim?"var(--cinza)":it.c}" opacity="${fracoFim?0.9:1}">${it.t}</text>`;});
  if(fracoFim)g+=`<text x="${X(last)+6}" y="${items.length?items[items.length-1].y+16:pt+12}" font-size="9" fill="var(--ruim)">n=${cb[last]}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Série temporal de acurácia">${g}</svg>`;
}
function _anHist(vals){
  const labels=["≥ 95%","80–95%","50–80%","< 50%"];
  const cores=FAIXAS_ACC.map(f=>f[1]);
  const tot=vals.reduce((a,b)=>a+b,0);
  if(!tot)return '<div class="sub">Sem casos no recorte.</div>';
  const W=460,H=230,pl=34,pr=10,pt=14,pb=40,max=Math.max.apply(null,vals.concat(1)),bw=(W-pl-pr)/vals.length;
  const step=max<=10?2:(max<=25?5:10),Y=v=>(H-pb)-v/max*((H-pb)-pt);
  let g="";
  for(let v=0;v<=max;v+=step){const y=Y(v);g+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--linha)" stroke-width="1"/><text x="${pl-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--cinza)">${v}</text>`;}
  vals.forEach((n,i)=>{const x=pl+i*bw+bw*0.18,w=bw*0.64,y=Y(n),h=(H-pb)-y;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${cores[i]||"var(--salmao)"}"><title>${labels[i]}: ${n} casos</title></rect>`;
    if(n>0)g+=`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" font-family="Sora" fill="var(--text)">${n}</text>`;
    g+=`<text x="${x+w/2}" y="${H-22}" text-anchor="middle" font-size="11" fill="var(--text)">${labels[i]}</text>`;});
  g+=`<text x="${pl}" y="${H-6}" font-size="10" fill="var(--cinza)">nº de casos por faixa de acurácia</text>`;
  // max-width no tamanho de projeto: com width:100% e viewBox fixo, um painel
  // largo amplia o desenho inteiro (fonte e barras junto) e o gráfico fica
  // gigante. O SVG encolhe em tela estreita, mas nunca passa do tamanho natural.
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Distribuição de acurácia">${g}</svg>`;
}
// Dispersão índice de compensação × assertividade, um ponto por caso.
// SVG inline com viewBox, no padrão do _anSerie e do _anHist — sem biblioteca.
//
// O eixo do ② é cortado em −100% por necessidade, não por estética: com a régua
// nova há casos em −965% e até −19.900%, e sem o corte eles esmagam os outros
// 130 contra o topo. Quem fica abaixo do corte é fixado na borda de baixo com
// marca própria (triângulo, não círculo) e contado na nota — ponto fixado que se
// parece com ponto normal vira número errado lido da posição.
const QUADRANTES=[
  ["aa","Aprovados que talvez não devessem passar",
   "O total bate, mas metade ou mais do erro se anulou no caminho. Aqui a assertividade não pode ser lida sozinha — abra a acurácia global."],
  ["ab","Aprovados de verdade",
   "O total bate e o erro verba a verba é pequeno. É o quadrante que se quer cheio."],
  ["ba","Piores do que parecem",
   "Reprovados cujo erro real é maior do que a nota sugere, porque parte dele se cancelou no total."],
  ["bb","Reprovados francos",
   "Erro grande e todo na mesma direção. A nota já conta a história inteira."]];
const _quadDe=(a,i)=>(a>=80?"a":"b")+(i>=50?"a":"b");
function _anDisp(pontos,sel){
  if(!pontos.length)return '<div class="sub">Sem casos no recorte.</div>';
  const W=560,H=330,pl=52,pr=14,pt=18,pb=44,PISO=-100;
  const X=i=>pl+(i/100)*(W-pl-pr);
  const Y=a=>(H-pb)-((Math.max(a,PISO)-PISO)/(100-PISO))*((H-pb)-pt);
  let g="";
  // grade
  for(const v of [-100,-50,0,50,100]){const y=Y(v);
    g+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--linha)" stroke-width="1"/>`
      +`<text x="${pl-7}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--cinza)">${v}%</text>`;}
  for(const v of [0,25,50,75,100]){const x=X(v);
    g+=`<line x1="${x}" y1="${pt}" x2="${x}" y2="${H-pb}" stroke="var(--linha)" stroke-width="1"/>`
      +`<text x="${x}" y="${H-pb+15}" text-anchor="middle" font-size="10" fill="var(--cinza)">${v}%</text>`;}
  // quadrantes clicáveis, por baixo dos pontos
  const yMeta=Y(80),xMeio=X(50);
  const caixa={aa:[xMeio,pt,W-pr-xMeio,yMeta-pt],ab:[pl,pt,xMeio-pl,yMeta-pt],
               ba:[xMeio,yMeta,W-pr-xMeio,(H-pb)-yMeta],bb:[pl,yMeta,xMeio-pl,(H-pb)-yMeta]};
  for(const [k,rot] of QUADRANTES){const[x,y,w,h]=caixa[k];const on=sel===k;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on?"var(--salmao)":"transparent"}"`
      +` fill-opacity="${on?0.09:1}" stroke="${on?"var(--salmao)":"none"}" stroke-width="1.5"`
      +` style="cursor:pointer" onclick="setQuadDisp('${k}')"><title>${esc(rot)} — clique para listar</title></rect>`;}
  // cortes: a meta do ② e a metade do índice
  g+=`<line x1="${pl}" y1="${yMeta}" x2="${W-pr}" y2="${yMeta}" stroke="var(--acc-meta)" stroke-width="1.5" stroke-dasharray="5 4"/>`
    +`<text x="${W-pr-2}" y="${yMeta-5}" text-anchor="end" font-size="10" fill="var(--acc-meta)">② 80% (meta)</text>`
    +`<line x1="${xMeio}" y1="${pt}" x2="${xMeio}" y2="${H-pb}" stroke="var(--cinza)" stroke-width="1.5" stroke-dasharray="5 4"/>`
    +`<text x="${xMeio+4}" y="${pt+11}" font-size="10" fill="var(--cinza)">compensação 50%</text>`;
  // rótulo curto de cada quadrante, com a contagem calculada
  const nQ={};QUADRANTES.forEach(([k])=>nQ[k]=pontos.filter(p=>_quadDe(p.a,p.i)===k).length);
  const rotCurto={aa:"Talvez não devessem passar",ab:"Aprovados de verdade",
                  ba:"Piores do que parecem",bb:"Reprovados francos"};
  for(const [k] of QUADRANTES){const[x,y,w,h]=caixa[k];
    g+=`<text x="${x+w/2}" y="${y+(k[0]==="a"?14:h-8)}" text-anchor="middle" font-size="10.5"`
      +` font-weight="${sel===k?"700":"400"}" fill="var(--cinza)" style="pointer-events:none">${rotCurto[k]} (${nQ[k]})</text>`;}
  // pontos: círculo para quem cabe no eixo, triângulo para quem foi fixado
  for(const p of pontos){const x=X(p.i),y=Y(p.a),fixo=p.a<PISO,foco=!sel||_quadDe(p.a,p.i)===sel;
    const cor=corAcc(p.a),op=foco?0.85:0.18;
    const t=`<title>${p.cnj} · ② ${accTxt(p.a)} · ① ${accTxt(p.g)} · compensação ${p.i.toFixed(1)}%</title>`;
    g+=fixo?`<path d="M ${x} ${y-7} L ${x+5.5} ${y+2} L ${x-5.5} ${y+2} Z" fill="none" stroke="${cor}" stroke-width="1.6" opacity="${op}">${t}</path>`
           :`<circle cx="${x}" cy="${y}" r="4" fill="${cor}" opacity="${op}">${t}</circle>`;}
  g+=`<text x="${pl}" y="${H-6}" font-size="10" fill="var(--cinza)">índice de compensação (→) × assertividade (↑)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Dispersão do índice de compensação contra a assertividade">${g}</svg>`;
}
function setQuadDisp(k){_quadDisp=(_quadDisp===k?null:k);telaErro();}
function aplicaTema(t){document.documentElement.classList.toggle("dark",t==="dark");
  const b=document.getElementById("themebtn"); if(b)b.textContent=t==="dark"?"☀️":"🌙";}
function toggleTema(){const t=document.documentElement.classList.contains("dark")?"light":"dark";
  try{localStorage.setItem("tema",t);}catch(e){} aplicaTema(t);}
function temaInicial(){try{const s=localStorage.getItem("tema"); if(s)return s;
  if(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)return "dark";}catch(e){} return "light";}
try{aplicaTema(temaInicial());}catch(e){}
topo();irPlacar();
</script>
